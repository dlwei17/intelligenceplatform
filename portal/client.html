 * Unpinning lets the timeline scroll with everything else, so nothing is ever
 * covered. Default stays on, because most people run few columns.
 */
var pinTimeline = true;

function isPinned(c) { return !!((c.timeline || c.reason) && pinTimeline); }

function setPinTimeline(on) {
  pinTimeline = !!on;
  try { localStorage.setItem('sk_pin_tl', pinTimeline ? '1' : '0'); } catch (e) {}
  render();
}

/* ============ table text size ============ */

/**
 * Scales the project table and nothing else. Browser zoom already handles the
 * whole page and does it better; what it cannot do is make the table legible
 * while leaving the dashboard compact enough to stay on one screen, which is
 * the actual problem when this is on a boardroom display.
 *
 * A CSS variable rather than a re-render, so changing size never disturbs open
 * rows, sort order or scroll position.
 */
function setTableFont(px) {
  var v = parseFloat(px);
  if (isNaN(v) || v < 8 || v > 28) v = 11;
  document.documentElement.style.setProperty('--tfs', v + 'px');
  try { localStorage.setItem('sk_tbl_font', String(v)); } catch (e) {}
}

/* ============ columns ============ */
function colDef(key) {
  var d = {key:key, label:key, minW:'90px'};
  if (key === '__flag__') {
    d.label = '';
    d.minW = '26px';
    d.flag = true;
    return d;
  }
  if (key === '__reason__') {
    d.label = 'On Hold Reason';
    d.minW = '260px';
    d.reason = true;
    return d;
  }
  if (key === '__timeline__') {
    var slots = baseMilestones().length + 1;
    d.label = 'Timeline';
    d.minW = (slots * TL_COL_W + (slots-1) * 14 + 28) + 'px';
    d.timeline = true;
  }
  else if (key === 'Project: Project Name') { d.label='Project'; d.minW='220px'; d.bold=true; }
  else if (key === 'Stage') { d.label='SolarKal Stage'; d.minW='130px'; d.status=true; }
  else if (key === 'State') { d.label='State'; d.minW='40px'; }
  else if (key === 'Project: Record Type') { d.label='System Type'; d.minW='120px'; }
  else if (key === 'Vendor Awarded') { d.label='Vendor'; d.minW='110px'; }
  else if (key === 'Project Size (KW)') { d.label='Size (kW)'; d.minW='70px'; d.num=true; }
  else if (key === 'Year 1 Lease Rate') { d.label='Yr1 Lease Rate'; d.minW='95px'; d.num=true; d.dollar=true; }
  else if (key === 'Annual Escalator (lease)') { d.label='Escalator'; d.minW='60px'; d.num=true; d.pct=true; }
  else if (key === '__nextms__') { d.label='Next Milestone'; d.minW='150px'; d.nextms=true; }
  else if (key === 'Utility') { d.label='Utility'; d.minW='110px'; }
  else if (key === ROOF_SQFT) { d.label='Roof (sqft)'; d.minW='80px'; d.num=true; d.sqft=true; }
  else if (key === CONTRACT_TERM) { d.label='Contract Term'; d.minW='95px'; }
  else if (key === 'Last User Update Time') { d.label='Last Update'; d.minW='85px'; d.dateOnly=true; }
  else if (/Date|Time/i.test(key)) {
    d.label = key.replace('Project: ','').replace(' Date','');
    d.minW = '85px'; d.dateOnly = true;
  }
  return d;
}

// Fields that exist in the data but do not belong in the table. Some are shown
// in the page header (leads), some in the expanded row detail (address, folder).
// 'Utility' is the canonical key built on load from Utility Company; the raw
// report field stays hidden so the picker never offers the same thing twice.
var HIDE_FROM_PICKER = ['Account', 'Owner Name', 'Account Executive',
  'Street Address', 'Zip Code', 'SolarKal Google Folder', 'Utility Company',
  'Project: ID', HOLD_REASON];

/**
 * Estimate assumptions, all clearly labelled as estimates in the UI.
 *
 * The three equivalency figures are yours, stated per 1 MW of system size and
 * scaled linearly. They are EPA greenhouse-gas equivalencies and all three
 * imply roughly 885 metric tons of CO2 avoided per MW per year.
 *
 * NOTE: 885 tCO2/MW/yr implies annual production near 1,264 kWh per kW. The
 * production figure below is set to that, so the kWh number and the coal,
 * gasoline and forest numbers tell one consistent story. Raise it to ~1,300
 * if you would rather use the more common industry rule of thumb, but then
 * the equivalencies will read slightly conservative against the kWh.
 */
/**
 * Annual production, kWh per kW installed, by state.
 *
 * Only CA and NY actually vary by sub-region in the source table. All four NJ
 * utilities are 1,250 and all three MA utilities are 1,225, so those need no
 * override.
 *
 * CA defaults to 1,500 (North), the CONSERVATIVE end, because these figures go
 * in front of clients and 1,650 would overstate a northern site by 10%. The
 * override lifts it to 1,650 when the utility indicates South or LADWP.
 */
var PROD_BY_STATE = {
  CA: 1500, CO: 1625, CT: 1225, DC: 1325, FL: 1600, IL: 1250,
  MA: 1225, MD: 1300, ME: 1150, NJ: 1250, NY: 1250,
  PA: 1250, RI: 1250, VA: 1400
};

// Matched against Utility Company where a state's sub-regions differ.
var PROD_OVERRIDES = {
  CA: [[/ladwp/i, 1650], [/south/i, 1650], [/north/i, 1500]],
  NY: [[/long\s*island|lipa|psegli/i, 1300],
       [/upstate|national\s*grid|nyseg|rg\s*&?\s*e/i, 1200],
       [/westchester|con\s*ed|nyc|new\s*york\s*city/i, 1250]]
};

var EST = {
  DEFAULT_KWH_PER_KW: 1250,     // used when State is blank or unlisted

  /**
   * The equivalencies were given per 1 MW, which implicitly assumed about
   * 1,264 kWh per kW. Now that production varies by state, the equivalencies
   * are converted to a per-kWh basis and scaled by ACTUAL production.
   *
   * This matters: CO2 avoided tracks kWh generated, not system size. Holding
   * them per-MW would understate a California site and overstate a Maine one
   * by roughly 20% each way.
   */
  BASELINE_KWH_PER_KW: 1264,
  PER_MW_AT_BASELINE: { coalLbs: 980116, gasolineGal: 99680, forestAcres: 1049 }
};

// Per-kWh equivalency rates, derived from the per-MW figures above.
function estPerKwh() {
  var baseKwh = 1000 * EST.BASELINE_KWH_PER_KW;
  return {
    coalLbs:     EST.PER_MW_AT_BASELINE.coalLbs     / baseKwh,
    gasolineGal: EST.PER_MW_AT_BASELINE.gasolineGal / baseKwh,
    forestAcres: EST.PER_MW_AT_BASELINE.forestAcres / baseKwh
  };
}

// Returns the production factor for a row, plus a label naming its basis so
// the footnote can always show which number was actually used.
function productionFactor(r) {
  var st = String(r['State'] || '').trim().toUpperCase();
  var util = String(r['Utility Company'] || r['Utility'] || '').trim();

  var ov = PROD_OVERRIDES[st];
  if (ov && util) {
    for (var i = 0; i < ov.length; i++) {
      if (ov[i][0].test(util)) return { kwh: ov[i][1], basis: st + ' / ' + util };
    }
  }
  if (PROD_BY_STATE[st] !== undefined) return { kwh: PROD_BY_STATE[st], basis: st };
  return {
    kwh: EST.DEFAULT_KWH_PER_KW,
    basis: st ? st + ', no factor on file' : 'state not recorded'
  };
}

/**
 * Computed columns that have no field in the report. Offered in the picker
 * alongside real ones; cellHtml() knows how to render them.
 */
var SYNTHETIC_COLS = ['__nextms__'];

function availableCols() {
  if (!allRows.length) return DEFAULT_COLS.slice();
  var hide = milestoneKeys().concat(HIDE_FROM_PICKER);
  var real = headers().filter(function(h){ return h && h.trim() && hide.indexOf(h) === -1; });
  return real.concat(SYNTHETIC_COLS);
}

// Distinct non-empty values of a field across this client's rows.
function distinctOf(field) {
  var seen = {}, out = [];
  allRows.forEach(function(r){
    var v = String(r[field] || '').trim();
    if (v && !seen[v]) { seen[v] = 1; out.push(v); }
  });
  return out.sort();
}

function chosenCols() {
  var all = availableCols();
  if (!visibleCols) visibleCols = all.filter(function(h){ return DEFAULT_COLS.indexOf(h) !== -1; });
  visibleCols = visibleCols.filter(function(c){ return all.indexOf(c) !== -1; });
  var chosen = all.filter(function(h){ return visibleCols.indexOf(h) !== -1; });
  return (chosen.length ? chosen : all).map(colDef);
}

function buildColPicker() {
  var box = document.getElementById('colPicker');
  if (!box) return;
  var all = availableCols();
  if (!visibleCols) visibleCols = all.filter(function(h){ return DEFAULT_COLS.indexOf(h) !== -1; });
  visibleCols = visibleCols.filter(function(c){ return all.indexOf(c) !== -1; });
  var h = '<div style="font-size:9px;color:var(--t4);text-transform:uppercase;letter-spacing:1px;'
        + 'margin-bottom:8px">Show columns</div>';
  all.forEach(function(c){
    var on = visibleCols.indexOf(c) !== -1 ? ' checked' : '';
    h += '<label style="display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:11px;'
      +  'color:var(--t2);cursor:pointer"><input type="checkbox" data-col="' + esc(c) + '"' + on
      +  ' onchange="onColToggle(this)" style="cursor:pointer">' + colDef(c).label + '</label>';
  });
  box.innerHTML = h;
  var cnt = document.getElementById('colCount');
  if (cnt) cnt.textContent = '(' + visibleCols.length + '/' + all.length + ')';
}

function onColToggle(el) {
  var c = el.getAttribute('data-col');
  var i = visibleCols.indexOf(c);
  if (el.checked && i === -1) visibleCols.push(c);
  if (!el.checked && i !== -1) visibleCols.splice(i,1);
  try { localStorage.setItem('sk_client_cols', JSON.stringify(visibleCols)); } catch (e) {}
  buildColPicker(); render();
}

function toggleColPicker(ev) {
  ev.stopPropagation();
  var b = document.getElementById('colPicker');
  b.style.display = b.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', function(e){
  var b = document.getElementById('colPicker');
  if (b && b.style.display === 'block' && !b.contains(e.target)) b.style.display = 'none';
});

/* ============ team header ============ */
/**
 * Emails become mailto links. Two ways to supply them, checked in this order:
 *   1. Columns in the report named 'Owner Email' / 'Account Executive Email'.
 *      Preferred, since it stays current without anyone maintaining a list.
 *   2. The manual map below, as a stopgap.
 * With neither, the name renders as plain text and nothing breaks.
 */
var TEAM_EMAILS = {
  // Overrides only. Add an entry here when someone does not fit the pattern,
  // e.g. 'Bob Smith Jr': 'bsmith@solarkal.com'
};

// House rule: first.last@solarkal.com. Uses the first and last token, so a
// middle name or initial is ignored rather than breaking the address.
function deriveEmail(name) {
  var parts = String(name || '').toLowerCase().replace(/[^a-z\s'-]/g, '').split(/\s+/)
    .filter(function(p){ return p.length; });
  if (parts.length < 2) return '';
  var first = parts[0].replace(/[^a-z]/g, '');
  var last  = parts[parts.length - 1].replace(/[^a-z]/g, '');
  if (!first || !last) return '';
  return first + '.' + last + '@solarkal.com';
}

function emailFor(name) {
  if (TEAM_EMAILS[name]) return TEAM_EMAILS[name];
  var found = '';
  allRows.forEach(function(r){
    if (String(r['Owner Name'] || '').trim() === name && r['Owner Email']) {
      found = r['Owner Email'];
    }
    if (String(r['Account Executive'] || '').trim() === name && r['Account Executive Email']) {
      found = r['Account Executive Email'];
    }
  });
  return String(found || '').trim() || deriveEmail(name);
}

/**
 * An envelope plus an underline. Feedback was that a coloured name alone did
 * not read as clickable, and colour by itself is a weak affordance anyway.
 */
function personHtml(name) {
  var e = emailFor(name);
  return e
    ? '<a class="team-nm" href="mailto:' + esc(e) + '" title="Email ' + esc(e) + '" '
      + 'style="text-decoration:underline;text-underline-offset:2px">'
      + '<span style="margin-right:5px">&#9993;</span>' + name + '</a>'
    : '<span class="team-nm">' + name + '</span>';
}

function teamChip(label, names) {
  return '<div class="team-chip"><span class="team-lbl">' + label + '</span>'
    + names.map(personHtml).join('<span style="color:var(--t4)">,</span> ') + '</div>';
}

function renderTeam() {
  var el = document.getElementById('team');
  var leads = distinctOf('Owner Name');
  var aes = distinctOf('Account Executive');
  if (!leads.length && !aes.length) { el.style.display = 'none'; return; }
  var h = '';
  if (leads.length) h += teamChip('Project Lead' + (leads.length > 1 ? 's' : ''), leads);
  if (aes.length)   h += teamChip('Account Exec' + (aes.length > 1 ? 's' : ''), aes);
  el.innerHTML = h;
  el.style.display = 'flex';
}

/* ============ expanded project view ============ */

/**
 * Salesforce stores zips as numbers, so 08901 arrives as 8901 with the
 * leading zero lost. Any all-digit zip shorter than five is left-padded.
 * Affects most of NJ (07xxx-08xxx) and all of New England (0xxxx).
 */
function fixZip(z) {
  var s = String(z == null ? '' : z).trim();
  if (!s) return '';
  if (/^\d{1,4}$/.test(s)) return ('00000' + s).slice(-5);
  var m = s.match(/^(\d{1,4})-(\d{4})$/);          // short zip+4
  if (m) return ('00000' + m[1]).slice(-5) + '-' + m[2];
  return s;
}

function fullAddress(r) {
  return [r['Street Address'], r['State'], fixZip(r['Zip Code'])]
    .map(function(x){ return String(x || '').trim(); })
    .filter(function(x){ return x.length; })
    .join(', ');
}

/**
 * Keyless Google embed. t=k is satellite, z=19 is roof level. No API key and
 * no cost. It is an undocumented endpoint, so if it ever stops working the
 * "Open in Google Maps" link below it still does.
 */
function mapHtml(r) {
  var addr = fullAddress(r);
  if (!addr) return '<div style="color:var(--t4);font-size:11px">No address on file</div>';
  var q = encodeURIComponent(addr);
  // referrerpolicy="no-referrer" and rel="noreferrer" matter here: without
  // them the full page URL, access token included, is sent to Google in the
  // Referer header on every map load and every click.
  return '<iframe loading="lazy" referrerpolicy="no-referrer" '
    + 'style="width:100%;height:200px;border:1px solid var(--b);border-radius:8px;display:block" '
    + 'src="https://www.google.com/maps?q=' + q + '&t=k&z=' + mapZoomFor(r) + '&output=embed"></iframe>'
    + '<a href="https://www.google.com/maps/search/?api=1&query=' + q + '" target="_blank" '
    + 'rel="noopener noreferrer" style="display:inline-block;margin-top:6px;font-size:10px;'
    + 'color:var(--t2)">Open in Google Maps</a>';
}

/* ============ client documents ============
 *
 * Documents come from ONE folder per client: a "_Client Portal" subfolder
 * inside their existing Drive folder, recorded in the Access sheet. The server
 * serves only that folder, so anything filed elsewhere is unreachable.
 *
 * NOTHING IN DRIVE IS SHARED. No client is a Drive user and there are no
 * permissions to grant or revoke. The web app reads each file as its owner and
 * returns the bytes, so revoking a client is deleting their Access row.
 *
 * There is deliberately no per-project lease link. Leases are not filed per
 * project, so a per-row link would have been permanently empty. The header
 * button carries the job instead.
 * ========================================================================= */

var clientDocs = [];
var docsLoaded = false;   // list is fetched on first open, not on page load
var hasDocs = false;      // does this client have a folder configured at all

function docIcon(w) {
  w = w || 14;
  return '<svg width="' + w + '" height="' + w + '" viewBox="0 0 24 24" fill="currentColor">'
    + '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm0 2 '
    + '4.5 4.5H14V4zM8 13h8v2H8v-2zm0 4h8v2H8v-2z"/></svg>';
}

function fmtBytes(n) {
  n = Number(n) || 0;
  if (!n) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return Math.round(n / 1024) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

// Hidden entirely when a client has no folder configured, so nobody clicks a
// button that opens an empty drawer.
/**
 * The button appears whenever a documents folder is CONFIGURED, which the
 * server tells us with one cell lookup. The list itself is not fetched until
 * the user opens the panel, because walking the Drive folder costs two API
 * calls per shortcut and was adding roughly twelve seconds to every page load
 * for data nobody had asked to see yet.
 *
 * The count therefore appears only after the first open.
 */
function renderDocsButton() {
  var el = document.getElementById('docsBtnWrap');
  if (!el) return;
  if (!hasDocs) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  updateDocsCount();
}

function updateDocsCount() {
  var el = document.getElementById('docsCount');
  if (!el) return;
  if (!docsLoaded) { el.textContent = ''; return; }
  var usable = clientDocs.filter(function (d) { return d.id; });
  el.textContent = usable.length ? '(' + usable.length + ')' : '(!)';
}

var docsBusy = {};

/**
 * Sections render collapsed by default. With 37 leases in one folder an
 * expanded list is a wall; a client should see the shape of what they have
 * before they see every filename. Loose files sit at the top and are always
 * visible, since there is no folder to collapse them into.
 *
 * The count reads "5" when every file is usable and "4/5" when one is
 * broken, so a filing problem is visible without opening the section.
 */
function openDocs() {
  document.getElementById('docsBack').classList.add('on');
  // Always reopen at the top. Reappearing three folders deep with no memory of
  // how you got there is more disorienting than losing your place.
  docPath = [];

  if (!docsLoaded) {
    document.getElementById('docsSub').textContent = 'Loading...';
    document.getElementById('docsList').innerHTML =
      '<div style="padding:26px 20px;color:var(--t3);font-size:12px">'
      + 'Fetching your documents<div class="doc-bar" style="margin-top:10px">'
      + '<i></i></div></div>';
    document.getElementById('docsStatus').textContent = '';
    loadDocsList(function (err) {
      if (err) {
        document.getElementById('docsSub').textContent = '';
        document.getElementById('docsList').innerHTML =
          '<div style="padding:26px 20px;color:#e0654f;font-size:12px">'
          + esc(err) + '</div>';
        return;
      }
      docsLoaded = true;
      updateDocsCount();
      paintDocs();
    });
    return;
  }
  paintDocs();
}

/** Two transports, same as downloads: google.script.run today, /api later. */
function loadDocsList(done) {
  function got(list) {
    if (list && list.error) { done(list.error); return; }
    clientDocs = (list && list.docs) || list || [];
    done(null);
  }
  if (window.google && google.script && google.script.run && window.__TOKEN) {
    google.script.run
      .withSuccessHandler(got)
      .withFailureHandler(function (e) { done(String((e && e.message) || e)); })
      .getDocumentList(window.__TOKEN, clientKey);
    return;
  }
  var slug = (window.location.pathname || '').split('/').filter(Boolean).pop() || '';
  fetch('/api/docs' + (slug ? '?want=' + encodeURIComponent(slug) : ''),
        { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(got)
    .catch(function () { done('Could not reach the document service.'); });
}

/* ---------- document browser: one folder at a time ---------- */

/**
 * ONE LEVEL AT A TIME, NOT A FLATTENED TREE.
 *
 * The server sends a flat list where each file carries its full folder path,
 * "1 - SolarKal SOW / Shading Analysis". Rendering that list as-is put every
 * nested folder at the top level side by side with its own parent, so
 * "1 - SolarKal SOW" appeared to hold nothing while three folders that were
 * actually inside it sat below it looking like siblings.
 *
 * The hierarchy is derived on the client by splitting those paths, so this
 * needed no Apps Script change and no redeploy of the Worker.
 */
var docPath = [];      // folder segments the reader has descended into
var docKids = [];      // child folder names currently on screen, for onclick
var docSep = ' / ';

/**
 * Selection is held here rather than read back off the checkboxes. Once you
 * can navigate away from a file, DOM-held state is silently discarded the
 * moment someone opens a second folder, which is exactly when picking several
 * files starts to be useful.
 */
var docPicked = {};

function docsAt(path) {
  var key = path.join(docSep);
  return clientDocs.filter(function (d) {
    return !d.empty && (d.section || '') === key;
  });
}

/** Immediate child folder names below path, in the order the server sent. */
function docChildren(path) {
  var prefix = path.length ? path.join(docSep) + docSep : '';
  var names = [], seen = {};
  clientDocs.forEach(function (d) {
    var sec = d.section || '';
    if (!sec) return;
    if (prefix && sec.indexOf(prefix) !== 0) return;
    var rest = prefix ? sec.slice(prefix.length) : sec;
    if (!rest) return;                        // the folder itself, not a child
    var first = rest.split(docSep)[0];
    if (!first || seen[first]) return;
    seen[first] = true;
    names.push(first);
  });
  return names;
}

/**
 * Files anywhere beneath a folder, not just directly inside it. A recursive
 * count is the whole reason the old display was confusing: "1 - SolarKal SOW"
 * showed (0) while holding five files one level down.
 */
function docCountUnder(path) {
  var key = path.join(docSep), pre = key + docSep;
  var n = 0, ok = 0;
  clientDocs.forEach(function (d) {
    if (d.empty) return;
    var sec = d.section || '';
    if (sec !== key && sec.indexOf(pre) !== 0) return;
    n++;
    if (d.id) ok++;
  });
  return { n: n, ok: ok };
}

function docOpen(i) {
  if (docKids[i] == null) return;
  docPath = docPath.concat([docKids[i]]);
  paintDocs();
  var l = document.getElementById('docsList');
  if (l) l.scrollTop = 0;
}

function docGo(depth) { docPath = docPath.slice(0, depth); paintDocs(); }
function docUp() { docGo(Math.max(0, docPath.length - 1)); }

function paintDocs() {
  var usable = clientDocs.filter(function (d) { return d.id; }).length;
  document.getElementById('docsSub').textContent =
    usable + (usable === 1 ? ' document' : ' documents') + ' shared with you by SolarKal';

  var html = '';

  // Breadcrumb, only once there is somewhere to go back to.
  if (docPath.length) {
    html += '<div class="doc-crumb">'
      + '<button type="button" class="doc-back" onclick="docUp()">&#9664; Back</button>'
      + '<button type="button" class="doc-crumb-b" onclick="docGo(0)">All documents</button>';
    docPath.forEach(function (seg, i) {
      html += '<span class="doc-crumb-s">/</span>'
        + (i === docPath.length - 1
          ? '<span class="doc-crumb-c">' + esc(seg) + '</span>'
          : '<button type="button" class="doc-crumb-b" onclick="docGo(' + (i + 1) + ')">'
            + esc(seg) + '</button>');
    });
    html += '</div>';
  }

  // Folders first, then the files sitting directly in this folder.
  docKids = docChildren(docPath);
  docKids.forEach(function (name, i) {
    var c = docCountUnder(docPath.concat([name]));
    var count = !c.n ? '0' : (c.ok === c.n ? String(c.n) : c.ok + '/' + c.n);
    html += '<button type="button" class="doc-sec" onclick="docOpen(' + i + ')" '
      + 'title="' + esc(name) + ' &mdash; ' + c.n + ' file'
      + (c.n === 1 ? '' : 's') + ' inside">'
      + '<span style="color:var(--y);flex:0 0 auto">' + folderIcon(17) + '</span>'
      + '<span style="flex:1 1 auto">' + esc(name) + '</span>'
      + '<span style="flex:0 0 auto;font-size:11px;color:var(--t2)">(' + count + ')</span>'
      + '<span class="doc-chev">&#9656;</span>'
      + '</button>';
  });

  var files = docsAt(docPath);
  html += files.map(docRowHtml).join('');

  if (!docKids.length && !files.length) {
    html += '<div style="padding:22px 20px;color:var(--t3);font-size:12px;'
      + 'font-style:italic">'
      + (docPath.length ? 'Nothing in this folder yet.' : 'No documents yet.')
      + '</div>';
  }

  document.getElementById('docsList').innerHTML = html;

  document.getElementById('docsStatus').textContent =
    'Large files can take a few seconds. One click is enough.';
  onDocPick();
}

function folderIcon(w) {
  w = w || 17;
  return '<svg width="' + w + '" height="' + w + '" viewBox="0 0 24 24" fill="currentColor">'
    + '<path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 '
    + '0-2-2h-8l-2-2z"/></svg>';
}

function docSelected() {
  return Object.keys(docPicked).filter(function (k) { return docPicked[k]; });
}

/** Called by each checkbox. Writes to state, not the other way round. */
function docPick(el) {
  var id = el.getAttribute('data-id');
  if (el.checked) docPicked[id] = true; else delete docPicked[id];
  onDocPick();
}

function onDocPick() {
  var n = docSelected().length;
  var b = document.getElementById('dlSel');
  if (!b) return;
  b.style.display = n ? '' : 'none';
  // Says "across N folders" because the count can now include files that are
  // not on screen, and a number you cannot see the source of looks like a bug.
  var folders = {};
  clientDocs.forEach(function (d) {
    if (d.id && docPicked[d.id]) folders[d.section || ''] = true;
  });
  var nf = Object.keys(folders).length;
  b.textContent = 'Download ' + n + ' selected'
    + (nf > 1 ? ' from ' + nf + ' folders' : '');
}

/**
 * Everything this client can see, not just the folder on screen. That is what
 * the label promises, and it is also the case the server may legitimately
 * refuse on size, which it says plainly.
 */
function pickAll(on) {
  docPicked = {};
  if (on) {
    clientDocs.forEach(function (d) { if (d.id) docPicked[d.id] = true; });
  }
  var boxes = document.querySelectorAll('.doc-pick');
  for (var i = 0; i < boxes.length; i++) boxes[i].checked = !!on;
  onDocPick();
}

/**
 * Zipped server side. Apps Script must hold the whole archive in memory and
 * base64 it, so the server refuses above MAX_ZIP_MB and says so plainly
 * rather than timing out. Faropoint's full folder is roughly 70MB, well over
 * that, which is why "select all" can legitimately be refused.
 */
function downloadZip(ids) {
  var st = document.getElementById('docsStatus');
  if (!ids || !ids.length) return;
  if (st) st.textContent = 'Building a zip of ' + ids.length + ' file'
    + (ids.length === 1 ? '' : 's') + '. This can take a while.';

  function deliver(p) {
    if (!p || p.error) {
      if (st) st.textContent = (p && p.error) || 'Could not build that download.';
      return;
    }
    var bin = atob(p.b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/zip' }));
    var a = document.createElement('a');
    a.href = url; a.download = p.name || 'documents.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    if (st) st.textContent = 'Downloaded ' + (p.name || 'documents.zip');
  }

  if (window.google && google.script && google.script.run && window.__TOKEN) {
    google.script.run
      .withSuccessHandler(deliver)
      .withFailureHandler(function (e) { deliver({ error: String((e && e.message) || e) }); })
      .getDocumentZip(window.__TOKEN, clientKey, ids);
    return;
  }
  var slug = (window.location.pathname || '').split('/').filter(Boolean).pop() || '';
  fetch('/api/zip?ids=' + encodeURIComponent(ids.join(','))
        + (slug ? '&want=' + encodeURIComponent(slug) : ''),
        { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(deliver)
    .catch(function () { deliver({ error: 'Could not reach the document service.' }); });
}

function docRowHtml(d) {
    if (d.empty) {
      return '<div style="padding:11px 20px 11px 56px;font-size:11px;color:var(--t4);'
        + 'font-style:italic">No documents in this folder yet</div>';
    }
    if (d.error) {
      return '<div style="padding:13px 20px;color:#e0654f;font-size:12px">'
        + esc(d.error) + '</div>';
    }
    if (!d.id) {
      return '<div style="padding:13px 20px;color:var(--t4);font-size:12px">'
        + esc(d.name) + '<br><span style="color:#e0654f;font-size:10px">'
        + esc(d.note || 'unavailable') + '</span></div>';
    }
    var canView = docViewable(d);
    return '<div style="display:flex;align-items:center">'
      + '<input type="checkbox" class="doc-pick" data-id="' + esc(d.id) + '" '
      +   (docPicked[d.id] ? 'checked ' : '')
      +   'onchange="docPick(this)" style="margin:0 0 0 20px;cursor:pointer;flex:0 0 auto">'
      + '<button type="button" class="doc-row" id="doc-' + esc(d.id) + '" '
      + 'style="padding-left:12px;flex:1 1 auto" '
      + 'title="' + (canView ? 'Preview in the portal' : 'Download this file')
      + '" onclick="downloadDoc(\'' + esc(d.id) + '\',\''
      + (canView ? 'view' : 'download') + '\')">'
      // Green so files read as distinct from the yellow folder rows above.
      + '<span style="color:var(--g);flex:0 0 auto">' + docIcon(18) + '</span>'
      + '<span style="flex:1 1 auto;min-width:0">'
      +   '<span style="font-size:13px;display:block">' + esc(d.name) + '</span>'
      +   '<span class="doc-note" style="font-size:10px;color:var(--t4)"></span>'
      + '</span>'
      + '<span style="flex:0 0 auto;font-size:10px;color:var(--t3);white-space:nowrap">'
      +   esc(d.modified || '') + (d.size ? ' &middot; ' + fmtBytes(d.size) : '')
      + '</span>'
      // Downward arrow only on files that cannot be previewed, so the two
      // behaviours are distinguishable before clicking.
      + (canView ? '' : '<span class="doc-dl" title="Downloads, this format '
          + 'cannot be shown in a browser">&#8623;</span>')
      + '</button></div>';
}

/**
 * WHAT THE BROWSER CAN ACTUALLY RENDER.
 *
 * No browser renders .docx or .xlsx, so those are forced to download rather
 * than opened in a viewer that would show a blank pane or binary noise. The
 * server already sends each file's mime type, so this needs no server change;
 * the extension is only a fallback for the rare file with no mime recorded.
 */
function docViewable(d) {
  var m = String((d && d.mime) || '').toLowerCase();
  if (m === 'application/pdf') return true;
  if (m.indexOf('image/') === 0) return true;
  if (m) return false;                       // mime known and not renderable
  return /\.(pdf|png|jpe?g|gif|webp|svg)$/i.test(String((d && d.name) || ''));
}

var docViewUrl = null;      // live blob URL, so it can be revoked on exit

function showDocViewer(url, name, id) {
  docViewUrl = url;
  document.getElementById('docsVName').textContent = name || 'Document';
  document.getElementById('docsVFrame').src = url;

  // Download and new-tab both act on a URL that already exists, so neither is
  // subject to the popup blocker: the click is the gesture.
  document.getElementById('docsVDl').onclick = function () {
    var a = document.createElement('a');
    a.href = url; a.download = name || 'document';
    document.body.appendChild(a); a.click(); a.remove();
  };
  document.getElementById('docsVTab').onclick = function () {
    window.open(url, '_blank');
  };

  document.getElementById('docsList').style.display = 'none';
  document.getElementById('docsView').classList.add('on');
  var st = document.getElementById('docsStatus');
  if (st) st.textContent = 'Previewing ' + (name || 'document')
    + '. Use Download for a copy.';
}

function closeDocViewer() {
  var f = document.getElementById('docsVFrame');
  if (f) f.src = 'about:blank';
  document.getElementById('docsView').classList.remove('on');
  document.getElementById('docsList').style.display = '';
  if (docViewUrl) { URL.revokeObjectURL(docViewUrl); docViewUrl = null; }
  var st = document.getElementById('docsStatus');
  if (st) st.textContent = 'Large files can take a few seconds. One click is enough.';
}

function closeDocs() {
  // Leaving the modal with a viewer open would leak the blob and keep the
  // iframe alive behind a hidden dialog.
  if (docViewUrl) closeDocViewer();
  document.getElementById('docsBack').classList.remove('on');
}

function toggleDocs() {
  var b = document.getElementById('docsBack');
  if (b.classList.contains('on')) closeDocs(); else openDocs();
}

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') closeDocs();
});


/**
 * Apps Script cannot stream binary, so a document arrives as base64 and is
 * turned into a Blob here. Two transports because this page has two homes:
 * google.script.run while Apps Script serves it, /api/file once Cloudflare
 * does. Both land on the same server-side authorisation check.
 */
/**
 * mode 'view' previews renderable formats in the modal; anything else, and
 * everything the browser cannot render, downloads as before.
 */
function downloadDoc(id, mode) {
  var st  = document.getElementById('docsStatus');
  var row = document.getElementById('doc-' + id);

  /**
   * Ignore repeat clicks on a file already downloading. Apps Script returns
   * the whole file in one response, so a second click just queues a second
   * multi-megabyte round trip and makes the wait worse.
   */
  if (docsBusy[id]) return;
  docsBusy[id] = true;

  var note = row ? row.querySelector('.doc-note') : null;
  if (row) row.setAttribute('disabled', 'disabled');
  if (note) note.innerHTML = 'Downloading<div class="doc-bar"><i></i></div>';
  if (st) st.textContent = 'Preparing download. This can take a few seconds.';

  function done() {
    docsBusy[id] = false;
    if (row) row.removeAttribute('disabled');
    if (note) note.innerHTML = '';
  }

  function deliver(p) {
    done();
    if (!p || p.error) {
      if (st) st.textContent = (p && p.error) || 'Could not open that document.';
      return;
    }
    var bin = atob(p.b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes],
      { type: p.mime || 'application/octet-stream' }));

    // Trust the mime the server actually returned over the mode the row
    // guessed from the list: a file whose type was unrecorded there must not
    // end up in a viewer that cannot show it.
    if (mode === 'view' && docViewable(p)) {
      showDocViewer(url, p.name, id);
      return;                                 // revoked by closeDocViewer
    }

    var a = document.createElement('a');
    a.href = url; a.download = p.name || 'document';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    if (st) st.textContent = 'Downloaded ' + (p.name || 'document');
  }

  var viaAppsScript = !!(window.google && google.script && google.script.run);
  if (viaAppsScript && !window.__TOKEN) {
    done();
    if (st) st.textContent = 'This page is missing its access key. Reload the portal.';
    return;
  }

  if (viaAppsScript) {
    google.script.run
      .withSuccessHandler(deliver)
      .withFailureHandler(function (e) {
        deliver({ error: String((e && e.message) || e) });
      })
      .getDocument(window.__TOKEN, id, clientKey);
    return;
  }

  var slug = (window.location.pathname || '').split('/').filter(Boolean).pop() || '';
  fetch('/api/file?id=' + encodeURIComponent(id)
        + (slug ? '&want=' + encodeURIComponent(slug) : ''),
        { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(deliver)
    .catch(function () { deliver({ error: 'Could not reach the document service.' }); });
}

// First milestone that has no date, or has a date still in the future.
function nextMilestone(r) {
  var ms = baseMilestones().concat([finalMilestone(r)]);
  var today = new Date();
  for (var i = 0; i < ms.length; i++) {
    var d = ms[i].key ? parseDate(r[ms[i].key]) : null;
    if (!d) return {label: ms[i].label, date: null};
    if (d > today) return {label: ms[i].label, date: d};
  }
  return null;
}

/**
 * Always renders the row, even with no value.
 *
 * Hiding empty rows made two projects show different field lists, so a
 * missing figure looked like a field that does not exist rather than one
 * nobody has filled in. A dash is information; an absent row is not.
 */
function detailRow_(label, value) {
  var blank = (value === '' || value == null);
  return '<div style="display:flex;justify-content:space-between;gap:14px;padding:6px 0;'
    + 'border-bottom:1px solid var(--b);font-size:12px">'
    + '<span style="color:var(--t3);flex-shrink:0">' + label + '</span>'
    + '<span style="color:' + (blank ? 'var(--t4)' : 'var(--t)')
    + ';font-weight:600;text-align:right">' + (blank ? '&mdash;' : value) + '</span></div>';
}

function panelTitle_(t) {
  return '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;'
    + 'color:var(--t);margin-bottom:10px">' + t + '</div>';
}

/**
 * Days in the current stage. Salesforce stage-change history is not in this
 * report, so the most recent completed milestone is used as the proxy for
 * when the stage began. Labelled accordingly rather than pretending to be
 * exact. Enabling Field History Tracking on Stage would make this precise.
 */
// Retained but no longer displayed: "Days in stage" was removed from the
// detail panel. Kept because the underlying proxy logic was non-obvious and
// may be wanted again if Field History Tracking is ever enabled on Stage.
function daysInStage(r) {
  var ms = baseMilestones().concat([finalMilestone(r)]);
  var today = new Date(), latest = null;
  ms.forEach(function(m){
    var d = m.key ? parseDate(r[m.key]) : null;
    if (d && d <= today && (!latest || d > latest)) latest = d;
  });
  if (!latest) return null;
  return Math.floor((today - latest) / 86400000);
}

function estBlock(r) {
  var kw = parseFloat(r['Project Size (KW)']) || 0;
  if (!kw) return '';
  var pf  = productionFactor(r);
  var kwh = kw * pf.kwh;
  var per = estPerKwh();
  var n = function(v){ return Math.round(v).toLocaleString(); };

  var item = function(val, unit, label, hero){
    return '<div style="padding:8px 0;border-bottom:1px solid var(--b)">'
      + '<div style="font-size:' + (hero ? '19px' : '16px') + ';font-weight:800;color:'
      + (hero ? 'var(--y)' : 'var(--g)') + ';line-height:1.1">' + val
      + '<span style="font-size:11px;font-weight:600;color:var(--t2);margin-left:5px">'
      + unit + '</span></div>'
      + '<div style="font-size:10.5px;color:var(--t2);margin-top:3px;line-height:1.35">'
      + label + '</div></div>';
  };

  return '<div style="background:var(--n);border:1px solid var(--b2);border-radius:9px;padding:14px 16px">'
    + panelTitle_('Environmental Benefits')
    + item(n(kwh), 'kWh', 'Estimated annual production', true)
    + item(n(per.coalLbs * kwh), 'lbs', 'Coal not burned')
    + item(n(per.gasolineGal * kwh), 'gal', 'Gasoline not consumed')
    + item(n(per.forestAcres * kwh), 'acres', 'US forest absorbing carbon for a year')
    + '<div style="font-size:10px;color:var(--t2);margin-top:10px;line-height:1.5">'
    + 'Estimates based on ' + pf.kwh.toLocaleString() + ' kWh per kW per year ('
    + esc(pf.basis) + ') and EPA greenhouse gas equivalencies. Actual production varies '
    + 'by site, weather and equipment.'
    + '</div></div>';
}

function detailHtml(r) {
  var nm = nextMilestone(r);
  var nmTxt = nm
    ? nm.label + (nm.date ? ' &middot; ' + fmtShort(nm.date) : ' &middot; not yet scheduled')
    : 'All milestones complete';

  var kw = parseFloat(r['Project Size (KW)']) || 0;
  var esc_ = r['Annual Escalator (lease)'];
  var lease = parseFloat(r['Year 1 Lease Rate']) || 0;
  var util = String(r['Utility Company'] || r['Utility'] || '').trim();
  var sqft = parseFloat(String(r[ROOF_SQFT] || '').replace(/[^0-9.\-]/g, '')) || 0;
  var why  = holdReason(r);

  var mapPanel = '<div>' + panelTitle_('Site Location') + mapHtml(r) + '</div>';

  /**
   * Per-project economics, using the same closed forms and the same rates as
   * the portfolio estimator. Reading a different NPV here than in the panel
   * above would be worse than showing none at all, so both take their rates
   * from ECON.
   *
   * Behind-the-meter projects carry no lease, so both figures are omitted
   * rather than shown as zero, which would read as "worth nothing".
   */
  var epid = projKey(r) || '';
  var econ = null;
  if (!isBTM(r) && lease) {
    var g = parseFloat(esc_);
    g = isNaN(g) ? 0 : g / 100;
    var nYrs = parseFloat(String(r[CONTRACT_TERM] || '').replace(/[^0-9.]/g, ''));
    var assumedTerm = (isNaN(nYrs) || nYrs <= 0);
    if (assumedTerm) nYrs = ECON.DEFAULT_TERM;
    // This project's own rates, which equal the portfolio rates until edited.
    var d = (parseFloat(projRate(epid, 'npv')) || 7) / 100;
    var cap = (parseFloat(projRate(epid, 'nav')) || 5) / 100;
    econ = {
      npv: Math.abs(d - g) < 1e-9
        ? lease * nYrs / (1 + d)
        : lease * (1 - Math.pow((1 + g) / (1 + d), nYrs)) / (d - g),
      nav: cap ? lease / cap : 0,
      yrs: nYrs,
      assumed: assumedTerm,
      // Carried onto the row so the figures can be recomputed in place when
      // a rate changes, without re-reading the record.
      base: lease,
      g: g
    };
  }

  var sitePanel = '<div>' + panelTitle_('Site Details')
    + detailRow_('Project', r['Project: Project Name'] || '')
    + detailRow_('Address', String(r['Street Address'] || '').trim() || '<span style="color:var(--t4)">not on file</span>')
    + detailRow_('State / Zip', [r['State'], fixZip(r['Zip Code'])].filter(Boolean).join(' '))
    + detailRow_('Utility', util || '<span style="color:var(--t4)">not on file</span>')
    + detailRow_('Roof size', sqft ? sqft.toLocaleString() + ' sqft' : '')
    + detailRow_('System type', r['Project: Record Type'] || '')
    + detailRow_('SolarKal Stage', r['Stage'] || '')
    + detailRow_('Next milestone', nmTxt)
    + '</div>';

  var projPanel = '<div>' + panelTitle_('Project Details')
    + detailRow_('System size', kw ? kw.toLocaleString() + ' kW' : '')
    + detailRow_('Yr1 lease rate', lease ? '$' + lease.toLocaleString() : '')
    + detailRow_('Contract term', r[CONTRACT_TERM] || '')
    + detailRow_('Escalator', (esc_ === '' || esc_ == null || esc_ === '-') ? '' : parseFloat(esc_) + '%')
    + detailRow_('Awarded vendor', r['Vendor Awarded'] || '')
    + (econ
      ? econDetailRow_('<span class="def" title="Present value of this lease over '
          + esc(econ.yrs) + ' years, with the annual escalator applied.'
          + (econ.assumed ? ' No contract term on file, so ' + ECON.DEFAULT_TERM
              + ' years is assumed.' : '')
          + ' The rate applies to this project only.">NPV of lease</span>',
          epid, 'npv', '% disc', moneyM(econ.npv),
          'data-lease="' + econ.base + '" data-g="' + econ.g + '" data-n="' + econ.yrs + '"')
        + econDetailRow_('<span class="def" title="Year 1 rent divided by the cap '
          + 'rate. The rate applies to this project only.">NAV increase</span>',
          epid, 'nav', '% cap', moneyM(econ.nav),
          'data-lease="' + econ.base + '"')
      : '')
    // Only meaningful for a paused project, so it appears only when a reason
    // is actually on file rather than as a permanent empty row.
    + (why ? detailRow_('On hold reason', why) : '')
    + '</div>';

  /**
   * TWO COLUMNS, not four.
   *
   * With a single four-column grid the first row was as tall as the
   * Environmental Benefits panel, so the notes card could not begin until
   * that row ended and a large void opened under the map. Nesting the three
   * detail panels inside the left column lets the card follow the content it
   * belongs to, while the benefits panel keeps its own full-height column.
   */
  var note = noteBlock(r);
  return '<div style="display:grid;grid-template-columns:1fr 300px;gap:24px;'
    + 'padding:18px 10px;align-items:start">'
    +   '<div>'
    +     '<div style="display:grid;grid-template-columns:330px 1fr 1fr;gap:24px;'
    +     'align-items:start">' + mapPanel + sitePanel + projPanel + '</div>'
    +     (note ? '<div style="margin-top:18px">' + note + '</div>' : '')
    +   '</div>'
    +   estBlock(r)
    + '</div>';
}

/* ============ notes for client ============
 *
 * The only writable thing in the portal, and the only place a person can put
 * words in front of a client. Staff see an editor; clients see the text.
 *
 * A note is REQUIRED before a project can be flagged. A bare marker tells a
 * client something is wrong and nothing about what, which is worse than
 * silence. Resolved notes stay visible with a green tick, because "we flagged
 * it, here is what happened, it is done" is the whole point.
 * ========================================================================= */

function noteBlock(r) {
  /**
   * Notes are live state and this row is a month old. Offering a compose box
   * here would let someone post a comment onto a historical view and expect it
   * to belong to that date.
   */
  if (asOfDate) {
    return '<div class="note-card"><div class="note-body" '
      + 'style="font-size:11.5px;color:var(--t3)">Messages are not part of the '
      + 'historical record. Return to today to read or post them.</div></div>';
  }
  var nt  = r.__note;
  var pid = String(r['Project: ID'] || '').trim();
  var msgs = (nt && nt.msgs) || [];
  /**
   * Resolving clears the thread outright, so there is no "resolved" state to
   * render: a project either has an open conversation or it has none, and the
   * next issue starts a clean flag.
   */
  var done = false;
  var live = !!nt;

  if (!pid) {
    return isStaff
      ? '<div class="note-card"><div class="note-body" '
        + 'style="font-size:11px;color:#e0654f">This project has no Salesforce id in '
        + 'the report, so comments cannot be attached to it.</div></div>'
      : '';
  }
  if (!msgs.length && !isStaff && !CLIENT_CAN_START) return '';

  var id = 'note-' + pid.replace(/[^A-Za-z0-9]/g, '');
  var accent = done ? 'var(--g)' : (live ? 'var(--y)' : '#5d7c8f');

  var thread = msgs.map(function (m, mi) {
    var ours = m.side === 'staff';
    // Staff may remove any comment; a client only their own, so neither side
    // can quietly delete the other's words.
    var canDel = isStaff || (m.side === 'client');
    return '<div class="note-msg" style="display:flex;gap:10px;align-items:flex-start">'
      + '<div style="flex:1 1 auto;min-width:0">'
      +   '<div style="font-size:10px;font-weight:700;color:'
      +     (ours ? 'var(--y)' : '#7fb7d4') + '">'
      +     esc(m.by || (ours ? 'SolarKal' : 'Client'))
      +     '<span style="color:var(--t4);font-weight:400"> &middot; '
      +     (ours ? 'SolarKal' : 'Client') + (m.at ? ' &middot; ' + esc(localStamp(m.at)) : '')
      +     '</span></div>'
      +   '<div style="font-size:13px;color:var(--t);margin-top:4px;white-space:pre-wrap">'
      +     markMentions(m.text) + '</div>'
      + '</div>'
      + (canDel
        ? '<button type="button" title="Delete this comment" '
          + 'onclick="deleteNoteMsg(\'' + esc(pid) + '\',' + (m.i == null ? mi : m.i) + ')" '
          + 'style="flex:0 0 auto;background:transparent;border:0;cursor:pointer;'
          + 'color:var(--t4);font-size:14px;line-height:1;padding:2px 4px">&times;</button>'
        : '')
      + '</div>';
  }).join('');

  return '<div class="note-card' + (done ? ' done' : (live ? ' on' : ''))
    + '">'
    + '<div class="note-hd">'
    +   '<div class="note-ttl">'
    +     '<span style="color:' + accent + ';font-size:14px">&#9993;</span>'
    +     'Leave a message for your SolarKal team'
    +     (nt && nt.awaitingUs
        ? '<span style="color:var(--y);font-weight:600">awaiting SolarKal</span>' : '')
    +   '</div>'
    + '</div>'
    + '<div class="note-body">'
    +   thread
    +   '<textarea id="' + id + '" rows="2" maxlength="1000" '
    +     'placeholder="Enter your comments and notes here.  Type @ to notify someone." '
    +     'oninput="mentionInput(this)" onkeydown="mentionKey(event,this)" '
    +     'style="width:100%;' + (msgs.length ? 'margin-top:10px;' : '')
    +     'background:#0d1820;color:var(--t);border:1px solid #2a4557;'
    +     'border-radius:8px;padding:9px 11px;font-family:inherit;font-size:13px;'
    +     'resize:vertical"></textarea>'
    +   '<div style="display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap">'
    +     '<button type="button" class="btn" onclick="postNote(\'' + esc(pid) + '\')">Post</button>'
    +     (isStaff && msgs.length
          ? '<button type="button" class="btn" style="color:var(--g)" '
            + 'title="Clears this conversation so a new issue can be flagged later" '
            + 'onclick="postNote(\'' + esc(pid) + '\',\'resolve\')">Mark resolved</button>' : '')
    +     '<span id="' + id + '-msg" style="font-size:10px;color:var(--t4)"></span>'
    +   '</div>'
    + '</div></div>';
}

/**
 * Clients may start a thread as well as reply. Set false to make them
 * respondents only.
 */
var CLIENT_CAN_START = true;

/**
 * Highlights any roster name written as "@First Last". Escaping happens
 * first, so a mention can never be a route for markup.
 */
function markMentions(text) {
  var out = esc(text);
  team.forEach(function (n) {
    var safe = esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp('@' + safe, 'gi'), function (m) {
      return '<span class="mention">' + m + '</span>';
    });
  });
  return out;
}

/* ---------- @mention autocomplete ---------- */

var mSel = 0, mBox = null, mArea = null, mMatches = [];

function mentionClose() {
  if (mBox && mBox.parentNode) mBox.parentNode.removeChild(mBox);
  mBox = null; mArea = null; mMatches = [];
}

/** The partial "@word" immediately before the caret, if any. */
function mentionFragment(ta) {
  var upto = ta.value.slice(0, ta.selectionStart);
  var m = upto.match(/@([A-Za-z' -]{0,40})$/);
  return m ? m[1] : null;
}

function mentionInput(ta) {
  var frag = mentionFragment(ta);
  if (frag === null || !team.length) { mentionClose(); return; }

  var q = frag.toLowerCase();
  mMatches = team.filter(function (n) {
    return !q || n.toLowerCase().indexOf(q) !== -1;
  }).slice(0, 6);
  if (!mMatches.length) { mentionClose(); return; }

  if (!mBox) {
    mBox = document.createElement('div');
    mBox.className = 'mbox';
    document.body.appendChild(mBox);
  }
  mArea = ta;
  mSel = 0;
  mentionPaint();

  var r = ta.getBoundingClientRect();
  mBox.style.left = (r.left + window.scrollX + 10) + 'px';
  mBox.style.top  = (r.bottom + window.scrollY + 4) + 'px';
}

function mentionPaint() {
  if (!mBox) return;
  mBox.innerHTML = mMatches.map(function (n, i) {
    return '<div class="' + (i === mSel ? 'sel' : '') + '" '
      + 'onmousedown="event.preventDefault();mentionPick(' + i + ')">'
      + esc(n) + '</div>';
  }).join('');
}

function mentionPick(i) {
  if (!mArea || !mMatches[i]) return;
  var ta = mArea, name = mMatches[i];
  var upto = ta.value.slice(0, ta.selectionStart);
  var rest = ta.value.slice(ta.selectionStart);
  var start = upto.lastIndexOf('@');
  ta.value = upto.slice(0, start) + '@' + name + ' ' + rest;
  var pos = start + name.length + 2;
  mentionClose();
  ta.focus();
  ta.setSelectionRange(pos, pos);
}

function mentionKey(ev, ta) {
  if (!mBox || !mMatches.length) return;
  if (ev.key === 'ArrowDown') { mSel = (mSel + 1) % mMatches.length; mentionPaint(); ev.preventDefault(); }
  else if (ev.key === 'ArrowUp') { mSel = (mSel + mMatches.length - 1) % mMatches.length; mentionPaint(); ev.preventDefault(); }
  else if (ev.key === 'Enter' || ev.key === 'Tab') { mentionPick(mSel); ev.preventDefault(); }
  else if (ev.key === 'Escape') { mentionClose(); }
}

document.addEventListener('click', function (ev) {
  if (mBox && ev.target !== mArea) mentionClose();
});

/**
 * Deletion is permanent and the row is gone from the sheet, so it asks first.
 * There is no undo and pretending otherwise would be worse.
 */
function deleteNoteMsg(pid, index) {
  if (!window.confirm('Delete this comment? This cannot be undone.')) return;

  var row = null;
  for (var i = 0; i < allRows.length; i++) {
    if (String(allRows[i]['Project: ID'] || '').trim() === pid) { row = allRows[i]; break; }
  }
  if (!row) return;

  function done(p) {
    if (!p || p.error) { window.alert((p && p.error) || 'Could not delete that comment.'); return; }
    if (row.__note && row.__note.msgs) {
      row.__note.msgs.splice(index, 1);
      row.__note.msgs.forEach(function (m, n) { m.i = n; });
      if (!row.__note.msgs.length) delete row.__note;
      else {
        var last = row.__note.msgs[row.__note.msgs.length - 1];
        row.__note.awaitingUs = (last.side === 'client' && row.__note.state !== 'resolved');
      }
    }
    render();
  }

  if (window.google && google.script && google.script.run && window.__TOKEN) {
    google.script.run
      .withSuccessHandler(done)
      .withFailureHandler(function (e) { done({ error: String((e && e.message) || e) }); })
      .saveClientNote(window.__TOKEN, clientKey, pid, '', 'delete', index);
    return;
  }
  var slug = (window.location.pathname || '').split('/').filter(Boolean).pop() || '';
  fetch('/api/note' + (slug ? '?want=' + encodeURIComponent(slug) : ''), {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ projectId: pid, action: 'delete', index: index })
  }).then(function (r) { return r.json(); }).then(done)
    .catch(function () { done({ error: 'Could not reach the notes service.' }); });
}

function postNote(pid, action) {
  var row = null;
  for (var i = 0; i < allRows.length; i++) {
    if (String(allRows[i]['Project: ID'] || '').trim() === pid) { row = allRows[i]; break; }
  }
  if (!row) return;

  var id  = 'note-' + pid.replace(/[^A-Za-z0-9]/g, '');
  var box = document.getElementById(id);
  var msg = document.getElementById(id + '-msg');
  var text = box ? box.value.trim() : '';

  if (action !== 'resolve' && !text) {
    if (msg) { msg.style.color = '#e0654f'; msg.textContent = 'Write something first.'; }
    return;
  }
  if (msg) { msg.style.color = 'var(--t4)'; msg.textContent = 'Posting...'; }
  mentionClose();


  /**
   * PAINT FIRST, SEND SECOND.
   *
   * A post takes several seconds server side: it appends a row, reads the team
   * roster, posts to Slack and may send email. None of that is anything the
   * writer needs to wait for, and staring at a disabled button for eight
   * seconds made the portal feel broken. The thread updates immediately and
   * the request is reconciled when it returns.
   */
  var snapshot = row.__note
    ? { state: row.__note.state, awaitingUs: row.__note.awaitingUs,
        msgs: row.__note.msgs.slice() }
    : null;

  if (action === 'resolve') {
    delete row.__note;                      // resolving clears the thread
  } else {
    if (!row.__note) row.__note = { state: 'open', msgs: [], awaitingUs: false };
    row.__note.msgs.push({
      i: row.__note.msgs.length,
      by: viewer || (isStaff ? 'SolarKal' : 'You'),
      side: isStaff ? 'staff' : 'client',
      text: text, at: 'sending...'
    });
    row.__note.state = 'open';
    row.__note.awaitingUs = !isStaff;
  }
  if (box) box.value = '';
  render();

  function done(p) {
    if (!p || p.error) {
      // Put it back exactly as it was, so nothing is silently lost.
      if (snapshot) row.__note = snapshot; else delete row.__note;
      render();
      window.alert((p && p.error) || 'Could not post that comment. Please try again.');
      return;
    }
    if (row.__note && row.__note.msgs.length) {
      var lastMsg = row.__note.msgs[row.__note.msgs.length - 1];
      if (lastMsg.at === 'sending...') lastMsg.at = '';
      render();
    }
  }

  var name = row['Project: Project Name'] || '';
  if (window.google && google.script && google.script.run && window.__TOKEN) {
    google.script.run
      .withSuccessHandler(done)
      .withFailureHandler(function (e) { done({ error: String((e && e.message) || e) }); })
      .saveClientNote(window.__TOKEN, clientKey, pid, name, action || 'post', text);
    return;
  }
  var slug = (window.location.pathname || '').split('/').filter(Boolean).pop() || '';
  fetch('/api/note' + (slug ? '?want=' + encodeURIComponent(slug) : ''), {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ projectId: pid, projectName: name,
                           action: action || 'post', note: text })
  }).then(function (r) {
      /**
       * A 404 or an HTML body here means the Worker has no /api/note route,
       * i.e. it has not been redeployed since notes were added. Cloudflare
       * Pages then serves the portal HTML for that path, JSON parsing throws,
       * and the old catch-all message blamed the network for a deploy that
       * simply has not happened. Say which.
       */
      var ct = r.headers.get('content-type') || '';
      if (ct.indexOf('json') === -1) {
        throw new Error('The notes service is not deployed yet. '
          + 'Ask your developer to publish the updated Worker.');
      }
      return r.json();
    })
    .then(done)
    .catch(function (e) {
      done({ error: (e && e.message) || 'Could not reach the notes service.' });
    });
}

/**
 * WHICH PROJECTS ARE EXPANDED, KEYED BY SALESFORCE ID.
 *
 * render() rebuilds the whole table, so the row ids change and any open panel
 * would collapse. Posting a comment triggers a render, which meant the project
 * you were writing in slammed shut and the page jumped elsewhere. Tracking the
 * project id instead of the row index survives regrouping, sorting and
 * filtering as well.
 */
var openProjects = {};

function projKey(r) { return String(r['Project: ID'] || '').trim(); }

function toggleDetail(id, pid) {
  var el = document.getElementById('d_' + id);
  if (!el) return;
  var open = (el.style.display === 'none');
  el.style.display = open ? 'table-row' : 'none';
  if (pid) {
    if (open) openProjects[pid] = true; else delete openProjects[pid];
  }
}

/**
 * Always opens rather than toggling, then focuses the comment box. Clicking a
 * flag to close the very panel you wanted would be maddening.
 */
function flagClick(ev, rid, pid) {
  ev.stopPropagation();
  var el = document.getElementById('d_' + rid);
  if (!el) return;
  el.style.display = 'table-row';
  if (pid) openProjects[pid] = true;
  var box = el.querySelector('textarea');
  if (box) { box.focus(); box.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}

/* ============ render ============ */
var STAGE_COLORS = {'PSA signed':'var(--t4)','Pre RFP':'var(--t4)','Active RFP':'var(--bl)',
  'Awarded':'var(--w)','Vendor Contract Signed':'var(--p)','Option / Lease Signed':'var(--y)',
  'Project Accepted to Program':'var(--g)','Notice to Proceed / Construction':'#fff',
  'PTO / Operating':'var(--g)','Project Complete':'var(--g)'};
var STAGE_ORDER = ['PSA signed','Pre RFP','Active RFP','Awarded','Vendor Contract Signed',
  'Option / Lease Signed','Project Accepted to Program','Notice to Proceed / Construction',
  'PTO / Operating','Project Complete','Closed Lost','On Hold'];

/**
 * Blank, "FALSE" and Salesforce's "#####" overflow all mean "no reason given".
 * Rendering any of them literally would be worse than rendering nothing.
 */
function holdReason(r) {
  var v = String(r[HOLD_REASON] == null ? '' : r[HOLD_REASON]).trim();
  if (!v || /^#+$/.test(v) || /^(false|no|n\/a|-)$/i.test(v)) return '';
  return v;
}

/**
 * The envelope is a button, not decoration. Clicking it opens the project and
 * puts the cursor in the comment box, which is the only way to raise a note: a
 * marker with no explanation tells a client something is up and nothing about
 * what.
 *
 * Four states, styled so a row with an open note is hard to scroll past.
 */
function cellHtml(c, r, rid, pid) {
  if (c.flag) {
    var nt = r.__note;
    var last = nt && nt.msgs && nt.msgs.length ? nt.msgs[nt.msgs.length - 1] : null;
    // Envelope, not a flag: this column is a message, not a warning.
    var glyph = '&#9993;', fg = 'var(--b2)', box = '', tip = '', ring = '';

    if (nt && nt.awaitingUs) {
      fg = '#0e1a21'; box = 'var(--y)'; ring = 'var(--y)';
      tip = 'Awaiting SolarKal: ' + (last ? last.text : '');
    } else if (nt) {
      fg = 'var(--y)'; box = 'rgba(251,215,7,.16)'; ring = 'rgba(251,215,7,.55)';
      tip = last ? last.text : 'Flagged';
    } else if (isStaff) {
      tip = 'Add a project note';
    } else {
      return '<td style="width:30px;padding-left:6px;padding-right:0"></td>';
    }

    return '<td style="width:30px;text-align:center;padding-left:6px;padding-right:0">'
      + '<span class="fbx" title="' + esc(tip) + '" onclick="flagClick(event,\''
      + rid + '\',\'' + esc(pid || '') + '\')" '
      + 'style="display:inline-flex;align-items:center;justify-content:center;'
      + 'width:22px;height:22px;border-radius:5px;cursor:pointer;font-size:13px;'
      + 'line-height:1;color:' + fg + ';'
      + (box ? 'background:' + box + ';' : '')
      + (ring ? 'border:1px solid ' + ring + ';' : 'border:1px solid transparent;')
      + '">' + glyph + '</span></td>';
  }
  // The sticky block is emitted only when pinning is on, so an unpinned
  // timeline scrolls with the table instead of covering it.
  var stick = isPinned(c)
    ? 'position:sticky;right:0;z-index:2;box-shadow:-6px 0 8px -6px rgba(0,0,0,.6);'
    : '';
  if (c.reason) {
    var why = holdReason(r);
    return '<td style="border-left:1px solid var(--b);padding-left:14px;'
      + stick + 'background:var(--n);'
      + 'font-size:11px;color:' + (why ? 'var(--t2)' : 'var(--t4)') + '">'
      + (why ? esc(why) : '') + '</td>';
  }
  if (c.timeline) {
    return '<td style="border-left:1px solid var(--b);padding-left:14px;'
      + stick + 'background:var(--n)">' + tlRow(r) + '</td>';
  }
  if (c.nextms) {
    var nm2 = nextMilestone(r);
    var t2 = nm2
      ? nm2.label + (nm2.date ? ' &middot; ' + fmtShort(nm2.date) : '')
      : 'Complete';
    return '<td style="font-size:11px;color:' + (nm2 ? 'var(--t2)' : 'var(--g)') + '">'
      + t2 + '</td>';
  }
  var val = r[c.key] || '';
  if (/^#+$/.test(val)) val = '-';
  if (TRIM_SITE_NAMES && c.key === 'Project: Project Name' && val) {
    val = '<span title="' + esc(val) + '">' + esc(trimSite(val)) + '</span>';
  } else {
    val = esc(val);
  }
  var style = '';
  if (c.bold) style += 'font-weight:600;';
  // All columns left-justified. Tabular figures keep numbers aligned anyway.
  if (c.num) style += 'font-variant-numeric:tabular-nums;';
  if (c.pct && val && val !== '-') {
    val = String(parseFloat(val)) + '%';
  } else if (c.dateOnly && val && val !== '-') {
    var dd = parseDate(val);
    if (dd) val = (dd.getMonth()+1) + '/' + dd.getDate() + '/' + dd.getFullYear();
  } else if (c.dollar && val && val !== '-') {
    val = '$' + parseFloat(val).toLocaleString(undefined,{maximumFractionDigits:0});
    style += 'color:var(--y);font-weight:600;';
  } else if (c.key === 'Project Size (KW)' && val && val !== '-') {
    val = parseFloat(val).toLocaleString(undefined,{maximumFractionDigits:0});
  } else if (c.sqft && val && val !== '-') {
    var sq = parseFloat(String(val).replace(/[^0-9.\-]/g, ''));
    val = isNaN(sq) ? val : sq.toLocaleString(undefined,{maximumFractionDigits:0});
  }
  if (c.status) {
    var col = STAGE_COLORS[val] || 'var(--t2)';
    return '<td><span style="display:inline-block;padding:2px 8px;'
      + 'border-radius:10px;font-size:9px;font-weight:600;color:' + col + '">' + val + '</span></td>';
  }
  return '<td style="' + style + '">' + val + '</td>';
}

var _tblSeq = 0;
var _groups = [];      // [{key, rows}] for the current render
var _cols = [];        // column defs for the current render
var sortState = {};    // group key -> {col: index, dir: 'asc'|'desc'}

/**
 * Sorting is per section, so each stage or state group can be ordered
 * independently. Click the same header again to reverse it.
 */
function sortBy(gIdx, colIdx) {
  var g = _groups[gIdx];
  var col = _cols[colIdx];
  if (!g || !col || col.timeline || col.reason) return;
  var st = sortState[g.key];
  sortState[g.key] = (st && st.col === colIdx && st.dir === 'asc')
    ? {col: colIdx, dir: 'desc'}
    : {col: colIdx, dir: 'asc'};
  render();
}

function applySort(gKey, rows) {
  var st = sortState[gKey];
  if (!st) return rows;
  var col = _cols[st.col];
  if (!col) return rows;
  var mult = st.dir === 'desc' ? -1 : 1;

  /**
   * Next Milestone has no field in the report, so sort it by the date the
   * project is actually waiting on. Sorting the label alphabetically would
   * put "Contract Signed" before "RFP" and read as nonsense.
   */
  /**
   * Note priority, not alphabetical: awaiting us, then open, then resolved,
   * then nothing. Sorting the glyph would order by character code, which is
   * meaningless.
   */
  if (col.flag) {
    // Awaiting us, then any open thread, then nothing. Resolved threads are
    // cleared outright, so there is no third bucket.
    var rank = function (r) {
      var n = r.__note;
      if (!n) return 2;
      return n.awaitingUs ? 0 : 1;
    };
    return rows.slice().sort(function (a, b) { return (rank(a) - rank(b)) * mult; });
  }

  if (col.nextms) {
    return rows.slice().sort(function(a, b){
      var na = nextMilestone(a), nb = nextMilestone(b);
      var ta = na && na.date ? na.date.getTime() : (na ? 0 : 8.64e15);
      var tb = nb && nb.date ? nb.date.getTime() : (nb ? 0 : 8.64e15);
      if (ta !== tb) return (ta - tb) * mult;
      return String(na ? na.label : '').localeCompare(String(nb ? nb.label : '')) * mult;
    });
  }

  return rows.slice().sort(function(a, b){
    var av = a[col.key], bv = b[col.key];
    if (col.num) {
      return ((parseFloat(av) || 0) - (parseFloat(bv) || 0)) * mult;
    }
    if (col.dateOnly) {
      var ad = parseDate(av), bd = parseDate(bv);
      return ((ad ? ad.getTime() : 0) - (bd ? bd.getTime() : 0)) * mult;
    }
    return String(av || '').localeCompare(String(bv || '')) * mult;
  });
}

function tableHtml(rows, cols, gIdx, gKey) {
  var gid = 'g' + (++_tblSeq);
  var st = sortState[gKey];
  /**
   * Summed from each column's own declared minimum instead of a flat 115px
   * guess. The timeline alone needs ~464px, so the old estimate understated
   * the table at high column counts and the browser had less scroll range
   * than the content actually required.
   */
  var wantW = 0;
  cols.forEach(function (c) {
    if (c.flag) { wantW += 30; return; }
    var m = parseInt(String(c.minW || ''), 10);
    wantW += (isNaN(m) ? 115 : m) + 20;      // + cell padding
  });

  var h = '<div class="tbl-scroll" style="overflow-x:auto"><table class="pricing-tbl" '
        + 'style="min-width:' + Math.max(640, wantW) + 'px"><thead><tr>';
  cols.forEach(function(c, ci){
    var ind = (st && st.col === ci)
      ? '<span class="sort-ind">' + (st.dir === 'asc' ? '&#9650;' : '&#9660;') + '</span>' : '';
    var pinned = isPinned(c);
    if (c.flag) {
      // Sortable so "show me everything waiting on a reply" is two clicks.
      // Sized to match the envelope in the rows below it. Inheriting the 9px
      // th size made the header glyph read as a different icon.
      h += '<th class="sortable" onclick="sortBy(' + gIdx + ',' + ci + ')" '
        + 'title="Sort by notes needing attention" '
        + 'style="min-width:30px;padding-left:6px;padding-right:0;text-align:center">'
        + '<span style="font-size:13px;line-height:1">&#9993;</span>' + ind + '</th>';
      return;
    }
    h += '<th class="' + (pinned ? '' : 'sortable') + '"'
      +  (pinned ? '' : ' onclick="sortBy(' + gIdx + ',' + ci + ')"')
      +  ' style="min-width:' + c.minW + ';'
      +  (pinned ? 'border-left:1px solid var(--b);padding-left:14px;position:sticky;right:0;'
          + 'background:var(--n3);z-index:3;box-shadow:-6px 0 8px -6px rgba(0,0,0,.6);' : '')
      +  '">' + (c.timeline ? tlHeader(rows) : (c.reason ? c.label : c.label + ind)) + '</th>';
  });
  h += '</tr></thead><tbody>';
  rows.forEach(function(r, i){
    var rid = gid + '_' + i;
    var pid = projKey(r);
    // Re-open anything the reader had open before this render.
    var wasOpen = pid && openProjects[pid];
    h += '<tr class="prow" onclick="toggleDetail(\'' + rid + '\',\'' + esc(pid) + '\')">';
    cols.forEach(function(c){ h += cellHtml(c, r, rid, pid); });
    h += '</tr>';
    h += '<tr id="d_' + rid + '" class="drow" style="display:'
      +  (wasOpen ? 'table-row' : 'none') + '"><td colspan="' + cols.length
      +  '">' + detailHtml(r) + '</td></tr>';
  });

  /**
   * Totals row. Lives inside the same table so the figures sit under the
   * columns they belong to whatever the picker is showing and however the
   * section is sorted. Only Size and Yr1 Lease Rate are summed; totalling an
   * escalator percentage would be meaningless.
   */
  var sumKw = 0, sumLease = 0, sumSqft = 0;
  rows.forEach(function(r){
    sumKw    += parseFloat(r['Project Size (KW)'])  || 0;
    sumLease += parseFloat(r['Year 1 Lease Rate'])  || 0;
    sumSqft  += parseFloat(String(r[ROOF_SQFT] || '').replace(/[^0-9.\-]/g, '')) || 0;
  });

  h += '</tbody><tfoot><tr>';
  cols.forEach(function(c, ci){
    var st2 = 'border-top:1px solid var(--b2);font-weight:700;color:var(--t);'
            + 'background:var(--n);padding-top:9px;';
    if (c.flag) {
      h += '<td style="' + st2 + '"></td>';
    } else if (c.timeline || c.reason) {
      h += '<td style="' + st2 + 'border-left:1px solid var(--b);'
        +  (isPinned(c) ? 'position:sticky;right:0;z-index:2;'
             + 'box-shadow:-6px 0 8px -6px rgba(0,0,0,.6)' : '')
        +  '"></td>';
    } else if (ci === 0) {
      h += '<td style="' + st2 + 'font-size:10px;text-transform:uppercase;letter-spacing:.5px;'
        +  'color:var(--t2)">Total</td>';
    } else if (c.key === 'Project Size (KW)') {
      h += '<td style="' + st2 + 'font-variant-numeric:tabular-nums">'
        +  Math.round(sumKw).toLocaleString() + '</td>';
    } else if (c.key === 'Year 1 Lease Rate') {
      h += '<td style="' + st2 + 'font-variant-numeric:tabular-nums;color:var(--y)">$'
        +  Math.round(sumLease).toLocaleString() + '</td>';
    } else if (c.key === ROOF_SQFT) {
      h += '<td style="' + st2 + 'font-variant-numeric:tabular-nums">'
        +  Math.round(sumSqft).toLocaleString() + '</td>';
    } else {
      h += '<td style="' + st2 + '"></td>';
    }
  });
  h += '</tr></tfoot></table></div>';
  return h;
}

function render() {
  /**
   * Hold the reader's place. Replacing the table's innerHTML collapses the
   * document and the browser scrolls to the top, which after posting a comment
   * threw you to a different part of the page. Open panels are restored by
   * openProjects in tableHtml; this restores the viewport.
   */
  var keepScroll = window.scrollY || window.pageYOffset || 0;

  var groupBy = document.getElementById('groupBy').value;
  var showBB = document.getElementById('showBackBurner').checked;

  var active = allRows.filter(function(r){
    return r['Stage'] !== 'Closed Lost' && r['Stage'] !== 'On Hold';
  });
  var inactive = allRows.filter(function(r){
    return r['Stage'] === 'Closed Lost' || r['Stage'] === 'On Hold';
  });

  // Dashboard reflects the whole active portfolio, before any filtering.
  renderDashboard(active, inactive);

  var totalMW = 0, totalLease = 0;
  active.forEach(function(r){
    totalMW    += (parseFloat(r['Project Size (KW)']) || 0) / 1000;
    totalLease += parseFloat(r['Year 1 Lease Rate']) || 0;
  });

  /**
   * Filters apply to the TABLE only. Search matches project name, address,
   * city, state, vendor and utility, because a client typing "Moonachie" or
   * "PSE&G" means the same thing either way.
   */
  var q = (document.getElementById('search').value || '').trim().toLowerCase();

  function keep(r) {
    if (attnFilter && !(r.__note && r.__note.state !== 'resolved')) return false;
    if (pipeFilter && tlBucket(r) !== pipeFilter) return false;
    if (!q) return true;
    return SEARCH_FIELDS.some(function (f) {
      return String(r[f] || '').toLowerCase().indexOf(q) !== -1;
    });
  }

  var shownActive = active.filter(keep);
  inactive = inactive.filter(function (r) {
    if (attnFilter && !(r.__note && r.__note.state !== 'resolved')) return false;
    if (!q) return true;
    return SEARCH_FIELDS.some(function (f) {
      return String(r[f] || '').toLowerCase().indexOf(q) !== -1;
    });
  });

  var filtering = !!(pipeFilter || q || attnFilter);
  document.getElementById('clearBtn').style.display = filtering ? '' : 'none';
  document.getElementById('filterNote').innerHTML = filtering
    ? 'Showing <strong style="color:var(--t)">' + shownActive.length + '</strong> of '
      + active.length + ' active projects'
    : '';

  active = shownActive;

  document.getElementById('legend').innerHTML = legendHtml();

  var cols = chosenCols().filter(function(c){ return c.key !== groupBy; });
  // No note flag in a historical view: notes are not archived, so the column
  // would be a row of permanently empty envelopes.
  if (!asOfDate) cols.unshift(colDef('__flag__'));
  cols.push(colDef('__timeline__'));

  // group
  /**
   * "All Projects" is one ungrouped section. It still honours Show Inactive,
   * so inactive work stays out unless it is asked for.
   */
  var groups = {};
  active.forEach(function(r){
    var k = (groupBy === '__all__') ? 'All Projects' : (r[groupBy] || 'Not Assigned');
    if (!groups[k]) groups[k] = [];
    groups[k].push(r);
  });
  var keys = Object.keys(groups);
  if (groupBy === 'Stage') {
    keys.sort(function(a,b){
      var ai = STAGE_ORDER.indexOf(a), bi = STAGE_ORDER.indexOf(b);
      return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    });
  } else {
    keys.sort(function(a,b){
      var am = groups[a].reduce(function(s,r){ return s + (parseFloat(r['Project Size (KW)'])||0); },0);
      var bm = groups[b].reduce(function(s,r){ return s + (parseFloat(r['Project Size (KW)'])||0); },0);
      return bm - am;
    });
  }

  _cols = cols;
  _groups = keys.map(function(k){ return {key: k, rows: groups[k]}; });
  if (showBB && inactive.length) _groups.push({key: '__inactive__', rows: inactive});

  var h = '';
  _groups.forEach(function(G, gi){
    if (G.key === '__inactive__') return;   // rendered after the active groups
    var g = applySort(G.key, G.rows);
    var hc = groupBy === 'Stage' ? (STAGE_COLORS[G.key] || 'var(--y)') : 'var(--y)';
    // Count sits beside the section title; the money and kW totals live in the
    // table's own footer row, where they line up with their columns.
    h += '<div class="mod">';
    /**
     * Totals sit on the section header rather than in a strip below the table.
     * A summary line at the very bottom of a long page is read by nobody, and
     * when there are several sections it is ambiguous which one it describes.
     */
    var gKw = 0, gLease = 0;
    g.forEach(function (r) {
      gKw    += parseFloat(r['Project Size (KW)']) || 0;
      gLease += parseFloat(r['Year 1 Lease Rate']) || 0;
    });

    h += '<div class="mod-h"><div style="display:flex;align-items:baseline;gap:10px">'
      +  '<div class="mod-t" style="color:' + hc + '">' + G.key + '</div>'
      +  '<span style="font-size:10px;color:var(--t2)">' + g.length + ' project'
      +  (g.length === 1 ? '' : 's') + '</span></div>'
      +  '<div style="display:flex;align-items:baseline;gap:20px;font-size:11px;'
      +  'font-weight:700"><span style="color:var(--t2)">Total MW '
      +  '<span style="color:var(--t)">' + (gKw / 1000).toFixed(1) + '</span></span>'
      +  '<span style="color:var(--t2)">Yr1 Lease '
      +  '<span style="color:var(--y)">' + money(gLease) + '</span></span></div></div>';
    h += tableHtml(g, cols, gi, G.key);
    h += '</div>';
  });

  if (showBB && inactive.length) {
    /**
     * Inactive projects swap the timeline for the reason they stopped. A
     * timeline of dates that will never advance says nothing; "landlord
     * declined roof access" says everything. Same table, different last
     * column, so alignment and sorting behave identically.
     */
    var inCols = cols.slice(0, -1).concat([colDef('__reason__')]);
    var inIdx = _groups.length - 1;
    h += '<div class="sec" style="margin-top:24px">Inactive</div>';
    h += '<div class="mod" style="opacity:.75">'
      +  tableHtml(applySort('__inactive__', inactive), inCols, inIdx, '__inactive__')
      +  '</div>';
  }


  document.getElementById('content').innerHTML = h;

  // Same frame, so the jump is never visible.
  if (keepScroll) window.scrollTo(0, keepScroll);
}

/* ============ load ============ */
/**
 * Two modes.
 *
 * SERVED (production): the Apps Script Web App validated a token, filtered the
 * rows server side, and injected window.BOOTSTRAP. Nothing is fetched from the
 * browser and no other client's data was ever sent.
 *
 * DIRECT (development only): opened straight from GitHub Pages with ?c=Name.
 * Filtering is cosmetic here. Never send a direct link to a client.
 */
function loadClientRows(cb) {
  // 1. Served by Apps Script with the data already injected.
  if (window.BOOTSTRAP && window.BOOTSTRAP.rows) {
    if (window.BOOTSTRAP.account) clientKey = window.BOOTSTRAP.account;
    if (window.BOOTSTRAP.meta) { meta = window.BOOTSTRAP.meta; showFreshness(); }
    hasDocs = !!window.BOOTSTRAP.hasDocs;
    team    = window.BOOTSTRAP.team || [];
    viewer  = window.BOOTSTRAP.viewer || '';
    cb(window.BOOTSTRAP.rows);
    return;
  }

  // 2. Served from platform.solarkal.com behind Cloudflare Access. Same
  //    origin, so no CORS and no credential in the page: the Worker knows who
  //    you are from the Access assertion and returns only your rows.
  // The slug is a hint, never an instruction. The server honours it only for
  // SolarKal staff; a client gets their own account regardless.
  var slug = (window.location.pathname || '').split('/').filter(Boolean).pop() || '';
  var q = slug ? '?want=' + encodeURIComponent(slug) : '';

  fetch('/api/data' + q, { credentials: 'same-origin' })
    .then(function (r) {
      if (!r.ok && r.status !== 403) throw new Error('http ' + r.status);
      return r.json();
    })
    .then(function (p) {
      if (!p || p.error) {
        document.getElementById('content').innerHTML =
          '<div class="gate"><h2>No portal access</h2><div>' + esc(p && p.error ? p.error : 'Unknown')
          + '</div><div style="margin-top:10px;font-size:11px">Please contact your SolarKal '
          + 'representative.</div>' + reportButtonHtml('No portal access') + '</div>';
        document.getElementById('freshness').textContent = '';
        gateShown = true;
        cb([]);
        return;
      }
      // Staff with no client chosen: offer a picker rather than guessing.
      if (p.staff && p.clients) {
        renderStaffPicker(p.clients);
        gateShown = true;
        cb([]);
        return;
      }
      if (p.staff) isStaff = true;
      if (p.account) clientKey = p.account;
      if (p.meta) { meta = p.meta; showFreshness(); }
      hasDocs = !!p.hasDocs;
      team    = p.team || [];
      viewer  = p.viewer || '';
      cb(p.rows || []);
    })
    .catch(function () {
      // 3. Neither route available, e.g. opened straight from GitHub Pages.
      legacyCsvLoad(cb);
    });
}

// Retained only for local development against a temporarily published CSV.
// Never used in production; both live routes are handled above.
function legacyCsvLoad(cb) {
  /**
   * Reached only when /api/data could not be called at all, i.e. the page is
   * open somewhere that is not Cloudflare and Apps Script did not inject a
   * payload. That is the real "no client reference" case, so it is reported
   * here rather than guessed at before the fetch is even attempted.
   */
