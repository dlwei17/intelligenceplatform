/* =====================================================================
   SolarKal Standalone Client Portal - build c1-2026-08-01

   DELIBERATELY CONTAINS NO INTERNAL DATA.
   There is no reference anywhere in this file to the SIP Active Pipeline
   report, to SolarKal Project Revenue, or to Fee / Watt $. Keep it that way.
   If you ever need a field here, confirm it is one a client may see.

   PHASE 1 (now): client is chosen by ?c=<Account> and data comes from the
   published CSV. This is presentation-only. A determined visitor can change
   the parameter or fetch the CSV directly. DO NOT SEND THIS TO A CLIENT YET.

   PHASE 2 (next): replace loadClientRows() below with a call to the Apps
   Script Web App, which authenticates the Google account and returns only
   that client's rows. Then unpublish the CSV. loadClientRows() is the only
   function that needs to change.
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--y:#FBD707;--n:#253846;--n3:#1a2830;--n5:#0e1a21;
--t:#e8edf2;--t2:#8fa5b5;--t3:#506070;--t4:#3a4e5e;
--b:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.10);
--g:#22c98a;--r:#f05c5c;--w:#f5a623;--bl:#6ab4f5;--p:#b48af5;
--font:'Plus Jakarta Sans',sans-serif;--card:rgba(255,255,255,0.035);
}
body{font-family:var(--font);background:var(--n5);color:var(--t);min-height:100vh}
.wrap{max-width:1900px;margin:0 auto;padding:0 28px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;
  border-bottom:1px solid var(--b);background:var(--n3);margin-bottom:22px}
.topbar-left{display:flex;align-items:center;gap:20px;flex-wrap:wrap;min-width:0}
.tb-div{width:1px;height:32px;background:var(--b2);flex-shrink:0}
.brand{display:flex;flex-direction:column;gap:2px}
/* The logo is a JPEG on a white background. mix-blend-mode:lighten drops that
   background against the dark topbar, the same trick index.html uses. */
.brand-logo{height:26px;width:auto;object-fit:contain;mix-blend-mode:lighten;display:block}
/* Indented so CLIENT PORTAL starts under the S of SolarKal rather than under
   the sun icon. Tune this one number if the logo is ever resized. */
.brand-sub{font-size:8px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--t3);padding-left:31px}
.client-name{font-size:21px;font-weight:800;color:var(--y);letter-spacing:-.5px;white-space:nowrap}
.ts{font-size:11px;color:var(--t4)}
.sec{font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t4);
  margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--b)}
.mod{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:18px;margin-bottom:12px}
.mod-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mod-t{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--y)}
.ctl{padding:8px 14px;background:var(--n);border:1px solid var(--b);border-radius:8px;color:var(--t);
  font-family:var(--font);font-size:13px;font-weight:600;outline:none;cursor:pointer}
.btn{padding:8px 12px;background:var(--n);border:1px solid var(--b);border-radius:8px;color:var(--t2);
  font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
/* Same metrics as .ctl so the Columns button and the Group By select line up
   as a matched pair rather than two different-sized controls. */
.btn-lg{padding:8px 14px;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;
  color:var(--t)}
/* MATCHING PADDING IS NOT ENOUGH IN THE TOOLBAR.
   A <select> and a <button> derive their intrinsic height from different
   things, so identical padding and font-size still left the Group By select
   about 4px taller than the Columns button. Pinning the height and centring
   the label makes the row a matched set whatever the font metrics do.
   Scoped to #controls so the Post and Mark resolved buttons in the notes
   panel keep their own size. */
#controls .ctl,#controls .btn{box-sizing:border-box;height:38px}
#controls button.ctl,#controls .btn{display:inline-flex;align-items:center;
  justify-content:center;line-height:1}
/* --tfs drives the project table only, so a reader can enlarge the data
   without inflating the dashboard. Padding scales with it: at 16px the old
   fixed 7px padding made the rows look squeezed rather than simply bigger. */
.pricing-tbl{width:100%;border-collapse:separate;border-spacing:0 2px;
  font-size:var(--tfs,11px)}
/* White, not the muted grey these used to be. A column heading is a label you
   navigate by, so it has to survive a squint from across a room; at 9px in
   #54707f it did not. One point larger and full contrast. */
.pricing-tbl th{text-align:left;font-size:calc(var(--tfs,11px) - 1px);font-weight:700;
  color:var(--t);text-transform:uppercase;
  letter-spacing:.5px;padding:calc(var(--tfs,11px) * .55) 10px;
  border-bottom:1px solid var(--b)}
.pricing-tbl td{padding:calc(var(--tfs,11px) * .64) 10px;background:var(--n);
  border:none;vertical-align:middle}
.pricing-tbl tr td:first-child{border-radius:5px 0 0 5px}
.pricing-tbl tr td:last-child{border-radius:0 5px 5px 0}
.pricing-tbl .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--t2)}
/* The global scrollbar rule is 6px, which is fine for a page and too thin to
   find on a table that is 2000px wide. Always visible, never overlay-hidden,
   so it is obvious there is more to the right. */
.tbl-scroll{scrollbar-width:auto;padding-bottom:2px}
.tbl-scroll::-webkit-scrollbar{height:11px}
.tbl-scroll::-webkit-scrollbar-track{background:var(--n);border-radius:6px}
.tbl-scroll::-webkit-scrollbar-thumb{background:#3a5a70;border-radius:6px}
.tbl-scroll::-webkit-scrollbar-thumb:hover{background:var(--y)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
.gate{padding:80px 20px;text-align:center;color:var(--t3)}
.gate h2{font-size:16px;color:var(--t);margin-bottom:8px;font-weight:700}
#team{display:none;gap:10px;flex-wrap:wrap;align-items:center}
.team-chip{display:flex;align-items:baseline;gap:8px;padding:6px 13px;background:var(--n);
  border:1px solid var(--b2);border-radius:20px;white-space:nowrap}
.team-lbl{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--t)}
.team-nm{font-size:12.5px;font-weight:700;color:var(--bl)}
#team a.team-nm{text-decoration:none;border-bottom:1px solid transparent}
#team a.team-nm:hover{border-bottom-color:var(--bl)}
.pricing-tbl th.sortable{cursor:pointer;user-select:none}
/* Headers are already white, so hover cannot brighten them. It goes yellow
   instead, otherwise the sort affordance disappears. */
.pricing-tbl th.sortable:hover{color:var(--y)}
.sort-ind{color:var(--y);margin-left:4px}
.prow{cursor:pointer}
.prow:hover td{background:#2f4a5f}
.drow td{background:var(--n5);border-radius:0 0 6px 6px;border-top:1px solid var(--b)}
.drow iframe{background:var(--n)}

/* ---------- dashboard ---------- */
/* Single column. The attention card used to sit to the left of the four metric
   cards; it moved out to a pill above the table, because a count that is
   usually zero should not hold the same weight as portfolio MW. */
.dash-wrap{margin-bottom:14px}
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--b);
  border:1px solid var(--b);border-radius:12px;overflow:hidden}
.dash-c{background:var(--n3);padding:16px 20px}
.dash-l{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--t3);font-weight:700}
/* Scoped to the metric cards, so the attention card and the pipeline heading
   keep their own colours. */
.dash-c .dash-l{color:var(--y)}
.dash-v{font-size:26px;font-weight:800;color:var(--t);margin-top:5px;line-height:1.1}
/* Units and sub-lines lifted to var(--t2), matching the panels below. The
   sub-line is where the caveat lives ("15 inactive", "SolarKal stage: Project
   Complete"), so it is the last thing that should be hard to read. */
.dash-u{font-size:11px;font-weight:600;color:var(--t2);margin-left:5px}
.dash-s{font-size:10px;color:var(--t2);margin-top:5px}

.pipe{background:var(--n3);border:1px solid var(--b);border-radius:12px;
  padding:14px 20px 16px;margin-bottom:14px}
/* ---- horizontal bars: how many projects sit at each stage today ----
   One row per stage, one project counted once. Bars scale to the largest
   stage rather than the portfolio, so a small stage is still visible; the MW
   and the share are printed beside every bar so the length never has to be
   judged by eye. Empty stages keep their row and say so, which is how the
   road ahead stays visible. */
.hbar{margin:14px 0 2px}
.hbar-r{display:flex;align-items:center;gap:12px;padding:5px 0;cursor:pointer;
  transition:opacity .12s}
.hbar-r:hover{opacity:.85}
.hbar-r.dim{opacity:.3}
.hbar-l{flex:0 0 138px;font-size:11px;font-weight:700;text-align:right;
  line-height:1.2}
.hbar-t{flex:1 1 auto;min-width:40px;height:20px;border-radius:5px;
  background:rgba(255,255,255,.05);position:relative}
.hbar-f{position:absolute;left:0;top:0;bottom:0;border-radius:5px;min-width:3px}
.hbar-v{flex:0 0 72px;text-align:right;font-size:12.5px;font-weight:800;
  color:var(--t);white-space:nowrap}
.hbar-n{flex:0 0 118px;font-size:10px;color:var(--t2);white-space:nowrap}
/* The stacked proportional bar, its legend, and the descending staircase that
   preceded this are gone. Their rules went with them rather than rotting. */

.panels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px}
.panel{background:var(--n3);border:1px solid var(--b);border-radius:12px;padding:16px 20px}
.panel-t{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--y);font-weight:700}
.panel-big{font-size:24px;font-weight:800;color:var(--y);margin:8px 0 12px;line-height:1.1}
.panel-r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-top:1px solid var(--b);font-size:12px}
/* Lifted from var(--t4). These footnotes carry the caveats that keep the
   figures honest, so they have to be readable; one step below the row labels
   keeps the hierarchy without hiding them. */
.panel-note{font-size:9.5px;color:var(--t3);margin-top:11px;line-height:1.5}
/* Dotted underline marks anything with a methodology tooltip. */
.def{border-bottom:1px dotted var(--t4);cursor:help}
.econ-in{width:74px;background:#0d1820;color:var(--y);border:1px solid #3a5a70;
  border-radius:6px;padding:5px 8px;font-family:inherit;font-size:13px;
  font-weight:700;text-align:center;outline:none}
.econ-in:focus{border-color:var(--y)}
.econ-r{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:10px 0;border-top:1px solid var(--b)}
/* The same control inside a project detail row, where it has to share a
   12px line with a label and a figure. */
.pecon-in{width:50px;background:#0d1820;color:var(--y);border:1px solid #3a5a70;
  border-radius:5px;padding:2px 4px;font-family:inherit;font-size:11px;
  font-weight:700;text-align:center;outline:none;flex-shrink:0}
.pecon-in:focus{border-color:var(--y)}
/* A rate this project set for itself, which the portfolio estimator no longer
   drives. Marked because otherwise the figure silently disagrees with the
   panel above it and nothing on screen says why. */
.pecon-in.custom{border-color:var(--y);border-style:dashed;
  box-shadow:0 0 0 1px rgba(251,215,7,.18)}

/* Project Notes panel. A deliberately different surface from the data panels
   beside it: this is the one place holding human words rather than report
   figures, so it should not read as another data card. */
.note-card{background:linear-gradient(180deg,#152430,#101b23);
  border:1px solid #2a4557;border-radius:12px;overflow:hidden}
.note-card.on{border-color:rgba(251,215,7,.5);box-shadow:0 0 0 1px rgba(251,215,7,.12)}
.note-card.done{border-color:rgba(61,220,151,.4)}
.note-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 16px;background:rgba(255,255,255,.035);border-bottom:1px solid #2a4557}
.note-ttl{display:flex;align-items:center;gap:9px;font-size:10.5px;font-weight:700;
  letter-spacing:.7px;text-transform:uppercase;color:#a9c2d1}
.note-body{padding:14px 16px}
.note-msg{padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.note-msg:first-child{border-top:0}
.mention{color:var(--y);font-weight:700}
.mbox{position:absolute;z-index:80;background:var(--n3);border:1px solid #2a4557;
  border-radius:8px;min-width:200px;max-height:190px;overflow:auto;
  box-shadow:0 12px 28px rgba(0,0,0,.5)}
.mbox div{padding:8px 12px;font-size:12px;color:var(--t1);cursor:pointer}
.mbox div:hover,.mbox div.sel{background:var(--n);color:var(--y)}

/* Client documents modal. Centred and large because a lease filename can run
   to eighty characters and reading it matters more than the table behind it. */
.docs-back{position:fixed;inset:0;z-index:200;display:none;align-items:center;
  justify-content:center;background:rgba(4,10,14,.72);backdrop-filter:blur(2px)}
.docs-back.on{display:flex}
.docs-card{width:min(760px,92vw);max-height:78vh;display:flex;flex-direction:column;
  background:var(--n3);border:1px solid var(--b2);border-radius:14px;overflow:hidden;
  box-shadow:0 24px 64px rgba(0,0,0,.6)}
.docs-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
  border-bottom:1px solid var(--b2);flex:0 0 auto}
.docs-list{overflow:auto;flex:1 1 auto}
.doc-row{display:flex;width:100%;align-items:center;gap:12px;padding:13px 20px;
  background:transparent;border:0;border-bottom:1px solid var(--b);cursor:pointer;
  text-align:left;color:var(--t1);font-family:inherit}
.doc-row:hover{background:var(--n)}
.doc-row[disabled]{cursor:default;opacity:.75}
.doc-row[disabled]:hover{background:transparent}
.doc-sec{display:flex;width:100%;align-items:center;gap:11px;padding:13px 20px;
  background:var(--n);border:0;border-bottom:1px solid var(--b2);cursor:pointer;
  text-align:left;color:var(--t1);font-family:inherit;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px}
.doc-sec:hover{background:var(--n5,var(--n))}

/* Breadcrumb. Sticky, because after descending two levels the way back has to
   stay on screen while you scroll a long folder. */
.doc-crumb{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;padding:10px 20px;background:var(--n3);
  border-bottom:1px solid var(--b2)}
.doc-back{background:var(--n);border:1px solid var(--b2);border-radius:6px;
  color:var(--t2);font-family:inherit;font-size:11px;font-weight:700;
  padding:5px 10px;cursor:pointer;margin-right:4px}
.doc-back:hover{color:var(--y);border-color:var(--y)}
.doc-crumb-b{background:none;border:0;padding:0;cursor:pointer;color:var(--t2);
  font-family:inherit;font-size:11.5px;font-weight:600}
.doc-crumb-b:hover{color:var(--y);text-decoration:underline}
.doc-crumb-s{color:var(--t4);font-size:11px}
.doc-crumb-c{color:var(--t);font-size:11.5px;font-weight:700}
/* Chevron sits at the far right, after the count. Folders start flush left so
   the folder icon is the leftmost thing in the list and the hierarchy reads
   without a gutter of empty space. */
.doc-chev{flex:0 0 auto;color:var(--t3);font-size:11px;width:12px;text-align:right}
/* The inline expand/collapse rules that used to live here are gone. Folders
   are navigated into now rather than opened in place, so there is no nested
   body to style and no sticky folder header to keep on screen. The breadcrumb
   does that job. */

/* Files sit one indent in from folders. */
.doc-row{padding-left:42px}
/* ---- inline viewer ----
   Shown in place of the file list rather than in a new tab. A blob URL opened
   with window.open arrives long after the click that asked for it, so popup
   blockers eat it; keeping it in the modal avoids the fight entirely. */
.docs-view{display:none;flex:1 1 auto;min-height:0;flex-direction:column;
  background:#0d1820}
.docs-view.on{display:flex}
.docs-vhd{display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:var(--n3);border-bottom:1px solid var(--b2)}
.docs-vnm{flex:1 1 auto;min-width:0;font-size:12px;font-weight:600;color:var(--t);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docs-vbtn{flex:0 0 auto;background:var(--n);border:1px solid var(--b2);
  border-radius:6px;color:var(--t2);font-family:inherit;font-size:11px;
  font-weight:700;padding:5px 10px;cursor:pointer;white-space:nowrap}
.docs-vbtn:hover{color:var(--y);border-color:var(--y)}
.docs-view iframe{flex:1 1 auto;width:100%;border:0;background:#fff;min-height:320px}
/* Marks a row the browser cannot render, so the click behaviour is not a
   surprise. */
.doc-dl{flex:0 0 auto;color:var(--t4);font-size:12px;margin-left:6px}

/* ---- what's changed ---- */
.chg-wk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 20px;
  border-bottom:1px solid var(--b2);background:var(--n3)}
.chg-chip{background:var(--n);border:1px solid var(--b2);border-radius:16px;
  color:var(--t2);font-family:inherit;font-size:11px;font-weight:700;
  padding:5px 12px;cursor:pointer;white-space:nowrap}
.chg-chip:hover{color:var(--y);border-color:var(--y)}
.chg-chip.on{background:var(--y);border-color:var(--y);color:#0e1a21}
.chg-sec{padding:13px 20px 4px;font-size:9.5px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--y)}
.chg-r{display:flex;gap:12px;align-items:baseline;padding:8px 20px;
  border-bottom:1px solid rgba(255,255,255,.045);font-size:12px}
.chg-nm{flex:1 1 auto;min-width:0;color:var(--t);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Both right-hand columns are FIXED width. With the value column set to auto,
   a narrow value like "6/20/2025" let the name column grow and pushed the
   field label right, so "Contract signed" sat further across than "Stage" one
   row below it. Fixed bases keep all three columns on the same verticals. */
.chg-f{flex:0 0 132px;color:var(--t2);font-size:11px}
.chg-v{flex:0 0 210px;text-align:right;white-space:nowrap;font-size:11px;
  overflow:hidden;text-overflow:ellipsis}
.chg-old{color:var(--t4);text-decoration:line-through}
/* Yellow, not green. A change is neither good nor bad on its own: a project
   moving to On Hold and a project clearing Utility Approval are both just
   movement, and colouring them green implies progress that may not exist. */
.chg-new{color:var(--y);font-weight:700}
.chg-none{padding:26px 20px;color:var(--t3);font-size:12px}
.chg-note{padding:10px 20px;font-size:9.5px;color:var(--t3);line-height:1.5;
  border-top:1px solid var(--b2)}

/* ---- historical view banner ----
   Deliberately loud and full width. Someone will screenshot a historical view
   and send it to a client, so the frame has to be unmistakable inside the
   image itself, not a subtle date field in a corner. */
.hist-bar{display:none;align-items:center;gap:14px;flex-wrap:wrap;
  background:#3a3206;border:1px solid var(--y);border-radius:10px;
  padding:11px 18px;margin-bottom:14px}
.hist-bar.on{display:flex}
.hist-t{font-size:12.5px;font-weight:800;color:var(--y);letter-spacing:.3px}
.hist-s{flex:1 1 auto;min-width:200px;font-size:10.5px;color:#e0d089;line-height:1.45}
.hist-x{flex:0 0 auto;background:var(--y);border:1px solid var(--y);border-radius:18px;
  color:#0e1a21;font-family:inherit;font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.4px;padding:7px 14px;cursor:pointer}
/* Indeterminate on purpose: the file arrives in one response, so there is no
   real percentage to report. Honest motion beats a fake percentage. */
.doc-bar{height:3px;border-radius:3px;background:var(--b2);overflow:hidden;margin-top:6px}
.doc-bar i{display:block;height:100%;width:40%;background:var(--y);border-radius:3px;
  animation:docslide 1.1s ease-in-out infinite}
@keyframes docslide{0%{margin-left:-40%}100%{margin-left:100%}}
</style>

<div class="wrap">

  <!-- Portfolio dashboard. Everything here reflects ACTIVE projects only and
       ignores the pipeline filter, so the headline never moves under you when
       you click a segment to drill in. -->
  <div class="hist-bar" id="histBar"></div>

  <div class="dash-wrap" id="dashWrap" style="display:none">
    <div id="dash"></div>
  </div>
  <div id="pipe" style="display:none"></div>
  <div id="panels" style="display:none"></div>

  <!-- Left: what you are looking at. Right: what you do with it. -->
  <div id="controls" style="display:none;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-size:10px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Group By</span>
      <select id="groupBy" class="ctl" onchange="render()">
        <option value="__all__">All Projects</option>
        <option value="Stage">SolarKal Stage</option>
        <option value="State">State</option>
        <option value="Vendor Awarded">Vendor Awarded</option>
        <option value="Project: Record Type">System Type</option>
        <option value="Utility">Utility</option>
      </select>
    </div>

    <div style="position:relative">
      <button type="button" class="btn btn-lg" onclick="toggleColPicker(event)">Columns <span id="colCount"></span></button>
      <div id="colPicker" style="display:none;position:absolute;left:0;top:42px;z-index:50;background:var(--n3);
        border:1px solid var(--b2);border-radius:10px;padding:10px;min-width:250px;max-height:340px;
        overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,.55)"></div>
    </div>

    <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
      <input type="checkbox" id="showBackBurner" onchange="render()" style="cursor:pointer;width:16px;height:16px">
      <span style="font-size:10px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Show Inactive</span>
    </label>

    <!-- Search sits with the other filters. Everything from Group By to here
         changes WHICH rows you see. -->
    <input id="search" class="ctl" type="search" placeholder="Search project or address"
      oninput="render()" autocomplete="off"
      style="min-width:250px;font-weight:400">

    <!-- Open notes. Sits in this row rather than on its own line: it is a
         filter, and every other filter is here. Hidden entirely at zero. -->
    <div id="attnBar" style="display:none;align-items:center"></div>

    <!-- Lit while filtering: a live filter you cannot see is how people end up
         reporting missing projects. -->
    <button type="button" class="btn" id="clearBtn" onclick="clearFilters()"
      style="display:none;background:var(--y);color:#0a1419;border-color:var(--y);
      font-weight:800">Clear filters</button>
    <div id="filterNote" style="font-size:11px;color:var(--t3)"></div>

    <!-- Right-hand group: these two change how you READ or TAKE the data
         rather than which rows it contains. margin-left:auto pushes the pair
         to the edge and keeps that separation visible.
         Text size affects the project table only. Browser zoom already handles
         the whole page; this is for reading the table across a room. The
         options carry their own label, so no separate one is needed. -->
    <!-- Unpin to reach the columns the timeline sits on top of when many
         columns are shown. -->
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-left:auto"
      title="Keep the timeline fixed to the right edge while you scroll. Turn off to scroll it with the rest of the table.">
      <input type="checkbox" id="pinTl" checked onchange="setPinTimeline(this.checked)"
        style="cursor:pointer;width:16px;height:16px">
      <span style="font-size:10px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Pin Timeline</span>
    </label>

    <!-- Replay is a VIEW MODE, so it lives with the other view controls rather
         than two clicks deep inside a report. Populated after first paint, so
         it costs nothing on load. -->
    <select id="asOfSel" class="ctl" onchange="onAsOfChange(this.value)"
      title="Show the portal as it stood on an earlier date">
      <option value="">As of: Today</option>
    </select>

    <select id="tblFont" class="ctl" onchange="setTableFont(this.value)"

      <option value="12.5">Text: Medium</option>
      <option value="14">Text: Large</option>
      <option value="16">Text: Extra large</option>
    </select>

      title="What has changed since an earlier date">What Changed?</button>
    <button type="button" class="btn btn-lg" onclick="exportCsv()" style="color:var(--y)"
      title="Every project and every field, ignoring the filters above">Export Data as CSV</button>
  </div>

  <div id="legend"></div>
  <div id="content"><div class="gate">Loading your projects...</div></div>
</div>

<script>
/* ============ CONFIG ============ */
var BUILD = 'c74-2026-08-26';

/* The Apps Script Web App replaces the line below with an assignment to
   window.BOOTSTRAP containing this client's rows, already filtered server
   side. Do not remove or reformat this marker. */
/*__BOOTSTRAP__*/

/**
 * SECURITY: these are intentionally blank.
 *
 * They used to hold the published Google Sheet CSV URLs, used by the old
 * standalone dev mode. That was a data leak: this file is public in the
 * GitHub repo and those URLs are unauthenticated, so anyone reading the
 * source could fetch the full dataset for every client.
 *
 * In production the data arrives pre-filtered from the Web App as
 * window.BOOTSTRAP, and no URL is needed here at all. To test standalone,
 * paste a URL back in temporarily and REMOVE IT before committing.
 */
var CLIENT_CSV_URL = '';
var CLIENT_META_URL = '';

var TL_COL_W = 76;
var TRIM_SITE_NAMES = true;

/**
 * Satellite map zoom. Change this one value.
 *
 *   21  individual rooftop units, HVAC visible
 *   20  single building, tightly cropped
 *   19  roof and parcel            (was the default, too tight for warehouses)
 *   18  building plus its lot and immediate neighbours
 *   17  building in context, adjacent parcels and roads   <-- default
 *   16  several blocks, useful for a large campus or ground mount
 *   15  neighbourhood, site becomes small
 *
 * Or set to 'auto' to scale by system size, which handles a 300 kW retail
 * roof and a 15 MW ground mount sensibly without one compromise value.
 */
var MAP_ZOOM = 17;

function mapZoomFor(r) {
  if (MAP_ZOOM !== 'auto') return MAP_ZOOM;
  var kw = parseFloat(r['Project Size (KW)']) || 0;
  if (kw >= 6000) return 15;
  if (kw >= 2000) return 16;
  if (kw >= 500)  return 17;
  return 18;
}

var DEFAULT_COLS_VERSION = '2026-08-17';
var DEFAULT_COLS = ['Project: Project Name','Stage','State','Project: Record Type',
  'Project Size (KW)','Year 1 Lease Rate','Annual Escalator (lease)','Vendor Awarded'];

/**
 * Field names that arrive from the Salesforce report. Declared once so a
 * rename in Salesforce is a one-line change here rather than a hunt.
 */
var ROOF_SQFT     = 'Roof Size (sqft)';
var CONTRACT_TERM = 'Contract Term (lease or PPA)';
var HOLD_REASON   = 'On Hold Reason';

var MILESTONES_BASE = [
  {keys:['First Round RFP Launch Date'],      label:'RFP'},
  {keys:['Vendor Contract Signed Date'],      label:'Contract Signed'},
  // Replaced NTP: utility approval is the milestone clients actually wait on,
  // and NTP tended to follow it by days.
  {keys:['Date Interconnection Approved'],    label:'Utility Approval'},
  {keys:['Mobilization','Mobilization Date'], label:'Mobilization'}
];
var MILESTONE_FINAL = {
  CS:  {keys:['Rent Commencement','Rent Commencement Date'], label:'Rent Commencement'},
  BTM: {keys:['Project Complete Date','Project Complete'],   label:'Project Complete'}
};

var allRows = [];      // this client's rows only

var SEARCH_FIELDS = ['Project: Project Name', 'Street Address', 'City', 'State',
  'Zip Code', 'Vendor Awarded', 'Utility', 'Utility Company', 'Stage'];


/**
 * Set when loadClientRows has already painted the page itself: the staff
 * picker, or a real error from the server.
 *
 * Without it, both of those called cb([]) and the empty-rows branch in init()
 * immediately overwrote them with "No projects found". A staff member saw
 * that instead of the client picker, and a genuine authorisation error was
 * replaced by a message describing a completely different problem. That cost
 * a support round trip with the developer.
 */
var gateShown = false;
var team = [];      // @mention roster, names only
var viewer = '';    // signed-in identity, supplied by the server
var meta = null;
var visibleCols = null;
var clientKey = '';
var isStaff = false;   // set by the server, never inferred in the browser

/**
 * Shown to SolarKal staff who land on the portal without choosing a client.
 * Clients never see this: the server only returns a client list to a staff
 * identity, so there is nothing here to bypass.
 */
/**
 * A "report it's broken" button must not depend on the thing that is broken.
 * An in-app endpoint would be unreachable in exactly the outage it exists to
 * report, so this is a plain mailto: it works even when Apps Script,
 * Cloudflare or the network path to us is down. The body carries the details
 * we would otherwise have to ask for.
 */
function reportLink(context) {
  var slug = (window.location.pathname || '').split('/').filter(Boolean).pop() || '(none)';
  var body = 'The SolarKal client portal is not working for me.\n\n'
    + '--- please leave the details below ---\n'
    + 'Page:    ' + window.location.href + '\n'
    + 'Portal:  ' + slug + '\n'
    + 'Build:   ' + BUILD + '\n'
    + 'When:    ' + new Date().toString() + '\n'
    + 'Signed in as: ' + (viewer || '(unknown)') + '\n'
    + 'What I saw: ' + (context || 'see above') + '\n';
  return 'mailto:david.wei@solarkal.com'
    + '?subject=' + encodeURIComponent('Portal Down - SolarKal Client Portal')
    + '&body=' + encodeURIComponent(body);
}

function reportButtonHtml(context) {
  return '<div style="margin-top:22px"><a href="' + esc(reportLink(context)) + '" '
    + 'style="display:inline-block;padding:9px 16px;border:1px solid var(--y);'

function portalSlug(clientName) {

/* ============ CSV ============ */
function parseCSV(text) {
  var result = [], row = [], field = '', inQ = false, i, ch, nx;
  for (i = 0; i < text.length; i++) {
    ch = text[i]; nx = text[i+1];
    if (ch === '"') {
      if (inQ && nx === '"') { field += '"'; i++; } else { inQ = !inQ; }
    } else if (ch === ',' && !inQ) {
      row.push(field.trim()); field = '';
    } else if ((ch === '\n' || ch === '\r') && !inQ) {
      if (field || row.length) {
        row.push(field.trim());
        if (row.some(function(f){ return f.length; })) result.push(row);
        row = []; field = '';
      }
      if (ch === '\r' && nx === '\n') i++;
    } else { field += ch; }
  }
  if (field || row.length) {
    row.push(field.trim());
    if (row.some(function(f){ return f.length; })) result.push(row);
  }
  if (!result.length) return [];
  var headers = result[0].map(function(h){ return h.replace(/^"|"$/g,''); });
  var out = [];
  for (i = 1; i < result.length; i++) {
    var o = {};
    headers.forEach(function(hh, j){ o[hh] = (result[i][j] || '').replace(/^"|"$/g,''); });
    out.push(o);
  }
  return out;
}

function parseMeta(text) {
  var o = {};
  String(text).split(/\r?\n/).forEach(function(line){
    if (!line.trim()) return;
    var i = line.indexOf(',');
    if (i === -1) return;
    var k = line.slice(0,i).trim().replace(/^"|"$/g,'');
    var v = line.slice(i+1).trim().replace(/^"|"$/g,'');
    if (k) o[k] = v;
  });
  return o;
}

/* ============ helpers ============ */
/** Tenths of a million. Used where a dashboard reads better than a ledger. */
function moneyM(v) {
  v = Number(v) || 0;
  if (Math.abs(v) >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
  if (Math.abs(v) >= 1e3) return '$' + Math.round(v / 1e3) + 'K';
  return '$' + Math.round(v).toLocaleString();
}

/** Large counts as millions, so 34,712,000 reads as 34.7M. */
function bigNum(v, unit) {
  v = Number(v) || 0;
  var t = Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + 'M'
        : Math.abs(v) >= 1e4 ? Math.round(v / 1e3) + 'K'
        : Math.round(v).toLocaleString();
  return unit ? t + ' ' + unit : t;
}

function money(v) {
  return v >= 1e6 ? '$' + (v/1e6).toFixed(2) + 'M' : '$' + Math.round(v).toLocaleString();
}

/**
 * Note timestamps in the READER's timezone.
 *
 * The server sends ISO 8601 with an offset rather than a formatted string,
 * because formatting there would bake in the script's timezone and a client in
 * Chicago would silently read a New York clock. Anything unparseable is passed
 * through untouched, so older rows written before this change still display.
 */
function localStamp(iso) {
  if (!iso) return '';
  if (iso === 'sending...') return iso;
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  try {
    return d.toLocaleString(undefined, {
      day: 'numeric', month: 'short', year: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
  } catch (e) {
    return d.toLocaleString();
  }
}

// Escapes for both attribute values and text content. Report data is rendered
// by string concatenation, so anything with a stray < or & would otherwise
// break the markup, and a crafted value could inject script.
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function trimSite(name) {
  var s = String(name || '').trim();
  var i = s.indexOf(' - ');
  if (i !== -1) return s.slice(i+3).trim() || s;
  var m = s.match(/-(?!\d)/);
  if (m) return s.slice(m.index+1).trim() || s;
  return s;
}

function headers() { return allRows.length ? Object.keys(allRows[0]) : []; }

function resolveKey(keys) {
  var h = headers();
  for (var i = 0; i < keys.length; i++) if (h.indexOf(keys[i]) !== -1) return keys[i];
  return null;
}

function isBTM(r) { return /^\s*BTM/i.test(String(r['Project: Record Type'] || '')); }

/**
 * A site that is generating. PTO means Permission To Operate, so a project at
 * that stage is producing power and is no longer in development, same as one
 * marked complete. One definition used by every metric that splits the
 * portfolio into building versus built.
 */
var OPERATING_STAGES = ['PTO / Operating', 'Project Complete'];
function isOperating(r) {
  return OPERATING_STAGES.indexOf(String(r['Stage'] || '').trim()) !== -1;
}

function baseMilestones() {
  var out = [];
  MILESTONES_BASE.forEach(function(m){
    var k = resolveKey(m.keys);
    if (k) out.push({key:k, label:m.label});
  });
  return out;
}

function finalMilestone(r) {
  var v = isBTM(r) ? MILESTONE_FINAL.BTM : MILESTONE_FINAL.CS;
  return {key: resolveKey(v.keys), label: v.label};
}

function finalHeaderLabel(rows) {
  var hasB = false, hasC = false;
  (rows || []).forEach(function(r){ if (isBTM(r)) hasB = true; else hasC = true; });
  if (hasB && hasC) return 'Rent Comm / Complete';
  return hasB ? MILESTONE_FINAL.BTM.label : MILESTONE_FINAL.CS.label;
}

function milestoneKeys() {
  var out = [];
  MILESTONES_BASE.forEach(function(m){ m.keys.forEach(function(k){ out.push(k); }); });
  MILESTONE_FINAL.CS.keys.forEach(function(k){ out.push(k); });
  MILESTONE_FINAL.BTM.keys.forEach(function(k){ out.push(k); });
  return out;
}

function parseDate(v) {
  if (!v) return null;
  var s = String(v).trim();
  if (!s || /^#+$/.test(s) || s === '-') return null;
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[1]-1, +m[2]);
  var d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function fmtShort(d) {
  var mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return mon[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2);
}

/* ============ timeline ============ */
function tlHeader(rows) {
  var ms = baseMilestones().concat([{label: finalHeaderLabel(rows)}]);
  var h = '<div style="display:flex;align-items:center">';
  ms.forEach(function(m, i){
    if (i) h += '<div style="flex:1;min-width:8px"></div>';
    // White and a point larger, to match the rest of the header row. These
    // were the least legible labels in the table and they name the milestones
    // the whole timeline is read against.
    h += '<div style="flex:0 0 ' + TL_COL_W + 'px;text-align:center;font-size:9px;font-weight:700;'
      +  'letter-spacing:.3px;line-height:1.25;text-transform:uppercase;color:var(--t)">'
      +  m.label + '</div>';
  });
  return h + '</div>';
}

function tlRow(r) {
  var ms = baseMilestones().concat([finalMilestone(r)]);
  var today = new Date();
  var st = ms.map(function(m){
    var d = m.key ? parseDate(r[m.key]) : null;
    return {d:d, done: !!(d && d <= today), missing: !m.key};
  });
  var h = '<div style="display:flex;align-items:flex-start">';
  ms.forEach(function(m, i){
    if (i) {
      var both = st[i-1].d && st[i].d;
      h += '<div style="flex:1;min-width:8px;height:2px;margin-top:4px;background:'
        +  (both ? 'var(--g)' : 'var(--b)') + '"></div>';
    }
    var s = st[i];
    var col = s.d ? (s.done ? 'var(--g)' : 'var(--w)') : 'var(--t4)';
    var bg  = s.d ? col : 'var(--n5)';
    var tip = m.label + ': ' + (s.missing ? 'not tracked yet'
      : (s.d ? fmtShort(s.d) + (s.done ? '' : ' (scheduled)') : 'pending'));
    h += '<div title="' + esc(tip) + '" style="flex:0 0 ' + TL_COL_W + 'px;display:flex;'
      +  'flex-direction:column;align-items:center">'
      +  '<div style="width:10px;height:10px;border-radius:50%;background:' + bg
      +  ';border:2px solid ' + col + ';flex-shrink:0"></div>'
      +  '<div style="font-size:7px;margin-top:2px;white-space:nowrap;color:'
      +  (s.d ? col : 'var(--t4)') + '">' + (s.d ? fmtShort(s.d) : '') + '</div></div>';
  });
  return h + '</div>';
}

function legendHtml() {
  var ms = baseMilestones();
  if (!ms.length) return '';
  // The numbered milestone list is gone: the timeline panel now has its own
  // column headers, so it was saying the same thing twice. The colour key

    +  '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:4px"></span>complete</span>'
    +  '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--w);margin-right:4px"></span>scheduled</span>'
    +  '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--t4);margin-right:4px"></span>pending</span>'

/* ============ derived pipeline stage ============
 *
 * FOUR BUCKETS, DERIVED FROM MILESTONE DATES, NOT FROM SALESFORCE STAGE.
 *
 * Stage is a label a person updates; a milestone date is a fact. When the two
 * disagree, and they do, a client-facing bar built on the label contradicts
 * the timeline sitting three inches to its right. Deriving both from the same
 * dates makes that impossible.
 *
 * Closed Lost and On Hold have no milestone equivalent, so they stay driven
 * by Stage and are excluded here entirely.
 * ========================================================================= */

/**
 * SEGMENTS ARE REAL SALESFORCE STAGES.
 *
 * An earlier version derived four buckets from milestone dates and borrowed
 * the mock's labels. It was wrong twice: "In Construction" exists in neither
 * Salesforce nor the timeline, and the rule swept every project with a signed
 * contract but no mobilization date into one segment, which is why Contracted
 * read 58 of 70. Using Stage directly also makes this bar agree with the
 * Group By sections underneath it.
 */
var pipeFilter = '';     // '' means no drill-in
var attnFilter = false;  // show only projects with an unresolved note

function togglePipe(key) {
  pipeFilter = (pipeFilter === key) ? '' : key;
  render();
}

/**
 * TIMELINE STAGE, BY COMPLETED MILESTONES ONLY.
 *
 * A project sits in the last milestone whose date is in the PAST. A future
 * date is a plan, not an achievement, so scheduled and pending dates are
 * ignored entirely. That matters now because Salesforce is about to start
 * sending scheduled dates for these same fields: without this rule a project
 * with a mobilization booked for next March would immediately claim to be
 * mobilized.
 *
 * Nothing complete yet means Pre-RFP, which is a real and useful state.
 */
var TL_BUCKETS = [
  { key:'prerfp',   label:'Pre-RFP',            color:'#5d7c8f' },
  { key:'rfp',      label:'RFP Launched',       color:'#4da3e0' },
  { key:'contract', label:'Contract Signed',    color:'#f0a92b' },
  { key:'utility',  label:'Utility Approved',   color:'#e07b39' },
  { key:'mobil',    label:'Mobilized',          color:'#b07fe8' },
  { key:'final',    label:'Operating',          color:'#3ddc97' }
];

function tlBucket(r) {
  var now = new Date();
  function done(keys) {
    for (var i = 0; i < keys.length; i++) {
      var d = r[keys[i]] ? parseDate(r[keys[i]]) : null;
      if (d && d <= now) return true;      // past only
    }
    return false;
  }
  var fin = isBTM(r) ? MILESTONE_FINAL.BTM.keys : MILESTONE_FINAL.CS.keys;
  if (done(fin))                                      return 'final';
  if (done(['Mobilization', 'Mobilization Date']))    return 'mobil';
  if (done(['Date Interconnection Approved']))        return 'utility';
  if (done(['Vendor Contract Signed Date']))          return 'contract';
  if (done(['First Round RFP Launch Date']))          return 'rfp';
  return 'prerfp';
}

function toggleAttn() {
  attnFilter = !attnFilter;
  render();
  // A filter you have to go looking for is only half a shortcut.
  if (attnFilter) {
    var c = document.getElementById('controls');
    if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function clearFilters() {
  pipeFilter = '';
  attnFilter = false;
  var q = document.getElementById('search'); if (q) q.value = '';
  render();
}

/* ============ dashboard ============ */

function statBlock(label, value, unit, sub) {
  return '<div class="dash-c"><div class="dash-l">' + label + '</div>'
    + '<div class="dash-v">' + value
    + (unit ? '<span class="dash-u">' + unit + '</span>' : '') + '</div>'
    + '<div class="dash-s">' + (sub || '&nbsp;') + '</div></div>';
}

/**
 * Built from ACTIVE projects and deliberately NOT from the filtered set: the
 * portfolio headline should stay still while you drill into one segment.
 */
function renderDashboard(active, inactive) {
  /**
   * HISTORICAL VIEW IS THE TABLE ONLY.
   *
   * The dashboard, the stage chart and the three economics panels are all
   * hidden rather than recomputed from archived rows. Two reasons, and the
   * second is the important one:
   *
   *   The banner already carries the date and the project count, so the KPI
   *   cards repeat it in a form that is easy to screenshot out of context.
   *
   *   A reader comparing two dates wants the rows, not four headline figures
   *   they then have to hold in their head. Anything derived belongs in the
   *   What Changed report, which states the difference outright.
   */
  if (asOfDate) {
    ['dashWrap', 'pipe', 'panels'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    // Notes are not archived, so the pill has nothing to count. Cleared
    // explicitly because this returns before the code that normally sets it.
    var ab = document.getElementById('attnBar');
    if (ab) { ab.style.display = 'none'; ab.innerHTML = ''; }
    return;
  }

  var kw = 0, sqft = 0, sqftN = 0, opKw = 0, attention = 0;
  var csLease = 0, csKw = 0, csSqft = 0;
  var devN = 0;

  active.forEach(function (r) {
    var k = parseFloat(r['Project Size (KW)']) || 0;
    var q = parseFloat(String(r[ROOF_SQFT] || '').replace(/[^0-9.\-]/g, '')) || 0;
    /**
     * "In development" now means active and not yet operating. Counting a
     * finished site as in development was harmless while nothing was
     * operating; the moment one energises the label stops being true.
     *
     * Total MW in Development is filtered the same way. Excluding a project
     * from the count while its megawatts stayed in the total next to it would
     * be a worse inconsistency than the one being fixed.
     */
    if (!isOperating(r)) { kw += k; devN++; }
    if (q) { sqft += q; sqftN++; }

    // A lit envelope is any note that is not resolved.
    if (r.__note && r.__note.state !== 'resolved') attention++;

    /**
     * Lease revenue is a Community Solar concept. BTM projects have no lease
     * rate, so including them would divide a CS-only numerator by a
     * portfolio-wide denominator and quietly understate the rate.
     */
    if (!isBTM(r)) {
      csLease += parseFloat(r['Year 1 Lease Rate']) || 0;
      csKw    += k;
      csSqft  += q;
    }
  });

  // Operating capacity comes from Stage, not from a milestone date.
  allRows.forEach(function (r) {
    if (isOperating(r)) opKw += parseFloat(r['Project Size (KW)']) || 0;
  });

  var mw = kw / 1000, opMw = opKw / 1000, csMw = csKw / 1000;
  var nInactive = (inactive || []).length;

  document.getElementById('dashWrap').style.display = 'block';

  /**
   * OPEN NOTES, AS A CONTROL IN THE TOOLBAR.
   *
   * It used to be a full dashboard card, which gave a number that is usually
   * zero the same weight as portfolio MW. It is a filter, so it belongs in the
   * row with the other filters, and it disappears when there is nothing to do.
   *
   * class="btn" is here only to pick up the toolbar's 38px height rule; every
   * visual property is overridden inline, including the uppercasing and letter
   * spacing that .btn would otherwise apply to a sentence.
   */
  var attnEl = document.getElementById('attnBar');
  if (!attention) {
    attnEl.style.display = 'none';
    attnEl.innerHTML = '';
  } else {
    attnEl.style.display = 'flex';
    attnEl.innerHTML =
        '<button type="button" class="btn" onclick="toggleAttn()" '
      +   'title="Show only the projects with an open note" '
      +   'style="display:inline-flex;align-items:center;gap:9px;cursor:pointer;'
      +   'border-radius:20px;padding:0 16px;font-family:inherit;font-size:11.5px;'
      +   'font-weight:700;white-space:nowrap;text-transform:none;letter-spacing:0;'
      +   (attnFilter
            ? 'background:transparent;color:var(--y);border:1px solid var(--y)'
            : 'background:#3a3206;color:var(--y);border:1px solid var(--y)')
      +   '">'
      +   '<span style="font-size:14px;line-height:1">&#9993;</span>'
      +   '<span>' + attention + ' project' + (attention === 1 ? '' : 's')
      +     ' needing attention</span>'
      // The affordance has to say what clicking does, and say it differently
      // once clicked, or the filter becomes invisible state.
      +   '<span style="font-weight:600;opacity:.75">'
      +     (attnFilter ? '&middot; showing these, click to clear'
                        : '&middot; show these') + '</span>'
      + '</button>';
  }

  document.getElementById('dash').className = 'dash';
  document.getElementById('dash').innerHTML =
      statBlock('Portfolio SQFT', Math.round(sqft).toLocaleString(), 'sqft',
        sqftN ? Math.round(sqft / sqftN).toLocaleString() + ' sqft avg site'
              : 'no roof sizes on file')

    + '<div class="dash-c"><div class="dash-l">Projects in Development</div>'
    +   '<div class="dash-v">' + devN + '</div>'
    +   '<div class="dash-s">'
    +     (active.length - devN
        ? (active.length - devN) + ' operating &middot; ' + nInactive + ' inactive'
        : nInactive + ' inactive')
    +   '</div></div>'

    + statBlock('Total MW in Development', mw.toFixed(1), 'MW DC',
        'active, not yet operating')

    // The sub-line names both stages now. It said "Project Complete" only,
    // which stopped being true the moment PTO / Operating joined the total.
    + statBlock('Total MW in Operation', opMw.toFixed(1), 'MW DC',
        'SolarKal stage: PTO / Operating or Project Complete');

  // ---- pipeline bar: timeline stages, completed milestones only ----
  var buckets = {}, kwBy = {};
  TL_BUCKETS.forEach(function (b) { buckets[b.key] = 0; kwBy[b.key] = 0; });
  active.forEach(function (r) {
    var k = tlBucket(r);
    buckets[k]++;
    kwBy[k] += (parseFloat(r['Project Size (KW)']) || 0) / 1000;
  });

  /**
   * WHERE EACH PROJECT SITS TODAY, one row per stage.
   *
   * Current positions, not cumulative progress: a project appears in exactly
   * one row, the last stage it has completed. This is a snapshot of the
   * portfolio, not a direction of travel. Everything at RFP Launched today
   * will be at Contract Signed later, so a short row further down is work that
   * has not arrived yet rather than shrinkage.
   *
   * Bars scale to the largest stage, not to the portfolio, so a stage holding
   * two percent is still visible instead of a sliver. The MW figure and the
   * share are both printed, so nothing depends on judging a bar by eye.
   */
  var drawn = TL_BUCKETS.slice(1);          // Pre-RFP excluded, by request
  var maxMw = 0, shownMw = 0, shownN = 0;
  drawn.forEach(function (b) {
    if (kwBy[b.key] > maxMw) maxMw = kwBy[b.key];
    shownMw += kwBy[b.key];
    shownN  += buckets[b.key];
  });
  if (!maxMw) maxMw = 1;

  /**
   * Pre-RFP was safe to drop from the cumulative chart, where it was always
   * 100% and said nothing. Plotting current positions makes it a real
   * population, so the projects it holds are declared below the chart rather
   * than silently vanishing from a widget that looks like it covers everything.
   */
  var hidN = buckets.prerfp, hidMw = kwBy.prerfp;
  var totMw = shownMw + hidMw;

  var bars = drawn.map(function (b) {
    var mwHere = kwBy[b.key], n = buckets[b.key];
    var pct = (mwHere / maxMw) * 100;

  document.getElementById('pipe').className = 'pipe';

  // ---- three panels ----
  var kwh = 0;

/** One label/value row. A tip adds a dotted underline and a hover definition. */
function panelRow(label, value, tip) {
  // var(--t2), matching the Economic Value Estimator rows. At var(--t3) these
  // labels were noticeably dimmer than the identical rows in the panel beside
  // them, which read as an accident rather than a hierarchy.
  return '<div class="panel-r"><span style="color:var(--t2)">'
    + (tip ? '<span class="def" title="' + esc(tip) + '">' + label + '</span>' : label)
    + '</span><span style="color:var(--t);font-weight:700">' + value + '</span></div>';
}

/* ============ economic value estimator ============ */

var ECON = { DEFAULT_TERM: 20, discount: 7, cap: 5 };
var econRows = [];

/**
 * Closed forms rather than year-by-year loops, so typing in the rate boxes
 * stays instant across a few hundred projects.
 *
 *   lifetime = base * ((1+g)^n - 1) / g            geometric series
 *   NPV      = base * (1 - ((1+g)/(1+d))^n) / (d-g)
 *
 * The NPV form is undefined when d equals g, which is why that case is split
 * out rather than left to produce Infinity.
 */
function econTotals(discount, cap) {
  var d = discount / 100, c = cap / 100;
  var lifetime = 0, npv = 0, yr1 = 0, assumed = 0;

  econRows.forEach(function (p) {
    var g = p.g, n = p.n, base = p.base;
    yr1 += base;
    if (p.assumedTerm) assumed++;

    lifetime += g ? base * (Math.pow(1 + g, n) - 1) / g : base * n;

    if (Math.abs(d - g) < 1e-9) {
      npv += base * n / (1 + d);
    } else {
      npv += base * (1 - Math.pow((1 + g) / (1 + d), n)) / (d - g);
    }
  });

  return { lifetime: lifetime, npv: npv, nav: c ? yr1 / c : 0, assumed: assumed };
}

function renderEcon() {
  var el = document.getElementById('econOut');
  if (!el) return;

  var dEl = document.getElementById('econD'), cEl = document.getElementById('econC');
  var d = parseFloat(dEl ? dEl.value : ECON.discount);
  var c = parseFloat(cEl ? cEl.value : ECON.cap);
  if (isNaN(d)) d = ECON.discount;
  if (isNaN(c)) c = ECON.cap;
  ECON.discount = d; ECON.cap = c;

  var t = econTotals(d, c);

  /**
   * One row per figure: name, rate box, value. The previous two-line layout
   * spent a whole row on each rate and left the panel mostly empty, and the
   * caveat has been moved to the header where it costs nothing.
   */
  function row(label, tip, inputId, rate, unit, value) {
    return '<div class="econ-r">'
      + '<span class="def" style="font-size:11.5px;color:var(--t2);flex:1 1 auto" '
      +   'title="' + esc(tip) + '">' + label + '</span>'
      + '<input id="' + inputId + '" class="econ-in" type="text" inputmode="decimal" '
      +   'value="' + rate + '" oninput="renderEcon()" '
      +   'title="Type any rate">'
      + '<span style="font-size:10.5px;color:var(--t3);white-space:nowrap">' + unit + '</span>'
      + '<span style="color:var(--t);font-weight:700;font-size:15px;'
      +   'white-space:nowrap;min-width:66px;text-align:right">' + value + '</span>'
      + '</div>';
  }

  /**
   * SAME VERTICAL RHYTHM AS THE PANEL TO THE LEFT.
   *
   * The caption used to be a sibling of the flex row rather than a child of
   * the left column, so the two-line "no contract term" warning set the row's
   * height and pushed the caption down. The gap under the figure therefore
   * changed depending on whether that warning was showing, and did not match
   * "Year 1 lease revenue" next door. Metrics below are copied from that
   * panel exactly: wrapper margin 8px 0 14px, figure margin 0, caption 10px
   * with a 3px top margin.
   */
  el.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:flex-end;'
    +   'gap:20px;margin:8px 0 14px">'
    +   '<div>'
    +     '<div class="panel-big" style="margin:0;color:var(--t)">'
    +       moneyM(t.lifetime) + '</div>'
    +     '<div style="font-size:10px;color:var(--t2);margin-top:3px">'
    +       '<span class="def" title="Every scheduled lease payment added up over the full '
    +       'contract term, with the annual escalator applied each year. Not discounted.'
    +       '&#10;&#10;Formula, per project:&#10;'
    +       'Year 1 rent, then Year 1 rent x (1 + escalator) for year 2, and so on for '
    +       'the whole contract term. All projects added together.">'
    +       'Total lifetime lease payments</span></div>'
    +   '</div>'
    +   (t.assumed
        ? '<div style="font-size:9.5px;color:#e0654f;text-align:right;max-width:150px;'
          + 'line-height:1.4">' + t.assumed + ' project'
          + (t.assumed === 1 ? '' : 's') + ' without a contract term; '
          + ECON.DEFAULT_TERM + ' yrs assumed</div>'
        : '')
    + '</div>'

    + row('Net Present Value of Lease Payments',
        'Present value of those same payments, discounted at the rate you choose. '
        + 'What the future rent stream is worth in today\'s money.'
        + '&#10;&#10;Formula, per project:&#10;'
        + 'Each year\'s rent divided by (1 + discount rate) raised to the number of '
        + 'years away, then added up.&#10;'
        + 'A higher discount rate lowers the value; a higher escalator raises it.',
        'econD', d, '% discount rate', moneyM(t.npv))

    + row('NAV Increase Calculation',
        'Year 1 lease revenue capitalized at the rate you choose. A common shorthand '
        + 'for the value the income stream adds to the asset.'
        + '&#10;&#10;Formula:&#10;'
        + 'Year 1 lease revenue divided by the cap rate.&#10;'
        + 'At a 5% cap rate, $100,000 of annual rent implies $2,000,000 of value.',
        'econC', c, '% cap rate', moneyM(t.nav));

  // An open project row is showing the same two rates, so it has to follow.
  refreshProjEcon();
}

/* ---- per-project rates, independent of the portfolio panel ---- */

/**
 * INDEPENDENT PER PROJECT, BY REQUEST.
 *
 * Each project row holds its own discount and cap rate. A row follows the
 * portfolio estimator until someone types in it; from then on it is pinned
 * and the panel no longer moves it. That way "independent" does not also mean
 * "starts at some arbitrary default".
 *
 * The cost of independence is that two NPVs on screen can rest on different
 * assumptions, so a pinned box is marked — see .pecon-in.custom. Without that
 * marker this is a figure that quietly disagrees with the panel above it.
 *
 * Nothing here is persisted. Reloading returns every row to the portfolio
 * rates, which is the safe direction to forget in.
 */
var projEcon = {};   // pid -> {d: number, c: number}, present only once edited


function projRate(pid, kind) {
  var key = kind === 'npv' ? 'd' : 'c';
  var o = projEcon[pid];
  if (o && o[key] != null) return o[key];
  return kind === 'npv' ? ECON.discount : ECON.cap;
}


/** Recomputes one figure from the attributes carried on its own span. */
function paintEconRow(o) {
  var kind  = o.getAttribute('data-kind');
  var lease = parseFloat(o.getAttribute('data-lease')) || 0;
  var r     = parseFloat(projRate(o.getAttribute('data-pid'), kind)) || 0;

  if (kind === 'nav') {
    var cap = r / 100;
    o.textContent = cap ? moneyM(lease / cap) : '—';
    return;
  }
  var g = parseFloat(o.getAttribute('data-g')) || 0;
  var n = parseFloat(o.getAttribute('data-n')) || 0;
  var d = r / 100;
  o.textContent = moneyM(Math.abs(d - g) < 1e-9
    ? lease * n / (1 + d)
    : lease * (1 - Math.pow((1 + g) / (1 + d), n)) / (d - g));
}


function econProjInput(el) {
  var pid = el.getAttribute('data-pid'), kind = el.getAttribute('data-kind');
  var v = parseFloat(el.value);
  // Mid-typing states like "" or "." leave the last good figure alone rather
  // than flashing NaN.
  if (isNaN(v)) return;

  if (!projEcon[pid]) projEcon[pid] = {};
  projEcon[pid][kind === 'npv' ? 'd' : 'c'] = v;
  el.className = 'pecon-in custom';
  el.title = 'This project is using its own rate. The Economic Value '
           + 'Estimator above no longer changes it.';

  // Only this row. The sibling lookup avoids building a CSS selector out of a
  // Salesforce id, which would need escaping.
  var o = el.parentNode.querySelector('.pecon-v');
  if (o) paintEconRow(o);
}


/**
 * Called when the portfolio rates change. Updates only the rows that have not
 * been pinned, in place rather than through a re-render: a full render closes
 * the open row and drops the scroll position, and the person doing this is
 * mid-comparison.
 */
function refreshProjEcon() {
  var live = document.activeElement;
  var outs = document.querySelectorAll('.pecon-v');

  for (var j = 0; j < outs.length; j++) {
    var o = outs[j];
    var pid = o.getAttribute('data-pid'), kind = o.getAttribute('data-kind');
    var key = kind === 'npv' ? 'd' : 'c';
    if (projEcon[pid] && projEcon[pid][key] != null) continue;   // pinned

    var box = o.parentNode.querySelector('.pecon-in');
    // Never rewrite the box being typed in: it would fight the cursor.
    if (box && box !== live) {
      box.value = (kind === 'npv' ? ECON.discount : ECON.cap);
    }
    paintEconRow(o);
  }
}


/**
 * A detail row carrying a rate box. Same rhythm as detailRow_, with the
 * input and its unit sitting between the label and the figure.
 */
function econDetailRow_(label, pid, kind, unit, value, attrs) {
  var pinned = !!(projEcon[pid] && projEcon[pid][kind === 'npv' ? 'd' : 'c'] != null);
  return '<div style="display:flex;justify-content:space-between;align-items:center;'
    + 'gap:8px;padding:6px 0;border-bottom:1px solid var(--b);font-size:12px">'
    + '<span style="color:var(--t3);flex:1 1 auto">' + label + '</span>'
    + '<input class="pecon-in' + (pinned ? ' custom' : '') + '" '
    +   'data-pid="' + esc(pid) + '" data-kind="' + kind + '" '
    +   'type="text" inputmode="decimal" value="' + esc(projRate(pid, kind)) + '" '
    +   'oninput="econProjInput(this)" '
    +   'title="' + (pinned
          ? 'This project is using its own rate. The Economic Value Estimator '
            + 'above no longer changes it.'
          : 'Type any rate. This project only. Editing it here stops the '
            + 'Economic Value Estimator above from changing it.') + '">'
    + '<span style="font-size:9px;color:var(--t4);white-space:nowrap;flex-shrink:0">'
    +   unit + '</span>'
    + '<span class="pecon-v" data-pid="' + esc(pid) + '" data-kind="' + kind + '" '
    +   attrs
    +   ' style="color:var(--t);font-weight:600;text-align:right;white-space:nowrap;'
    +   'min-width:54px">' + value + '</span></div>';
}

/* ============ CSV export ============ */

/**
 * One cell.
 *
 * Everything is quoted rather than only the cells that need it. Conditional
 * quoting is where CSV writers usually break, and the file is a few percent
 * larger either way.
 *
 * The leading apostrophe is formula-injection defence. Excel treats a cell
 * beginning = + - @ as a formula, and these values come from Salesforce free
 * text that a client will open on their own machine. Negative numbers are
 * left alone, since "-500" is a number and "-cmd" is not.
 */
function csvCell(v) {
  var s = String(v == null ? '' : v);
  if (/^[=+@\t\r]/.test(s) || /^-[^0-9.]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}

/**
 * Every project and every field, deliberately ignoring the filters and the
 * column picker above: this is the "give me the underlying data" button, and
 * an export that silently matched the current view is how people end up
 * reconciling against a subset without realising.
 *
 * Inactive projects are included and flagged rather than dropped, so the file
 * reconciles against Salesforce rather than against the dashboard totals.
 *
 * Columns denied to clients are already stripped server-side and never reach
 * allRows, so there is nothing to filter out here.
 */
function exportCsv() {
  if (!allRows.length) { alert('Nothing to export yet.'); return; }

  var cols = headers();
  var lines = [cols.map(csvCell).join(',')];

  allRows.forEach(function (r) {
    lines.push(cols.map(function (k) { return csvCell(r[k]); }).join(','));
  });

  /**
   * CRLF because Excel wants it, and a UTF-8 BOM because without one Excel on
   * Windows reads the file as the local codepage and mangles any address with
   * an accent in it.
   */
  var blob = new Blob(['﻿' + lines.join('\r\n')],
    { type: 'text/csv;charset=utf-8;' });

  var d = new Date();
  var stamp = d.getFullYear() + '-'
    + ('0' + (d.getMonth() + 1)).slice(-2) + '-'
    + ('0' + d.getDate()).slice(-2);
  var name = (clientKey || 'SolarKal').replace(/[^A-Za-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');

  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name + '-projects-' + stamp + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // Deferred: revoking immediately cancels the download in some browsers.
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

/* ============ historical view (replay) ============ */

/**
 * REPLAY, NOT A DIFF.
 *
 * Swaps allRows for an archived day's rows and re-renders everything that is
 * derived from them: KPI cards, stage bars, the economics panels and the table.
 * The live rows are kept so returning to today costs no round trip.
 *
 * Notes and documents are excluded server side, because neither is versioned.
 * Attaching this week's conversation to a month-old row would read as though
 * it was said then.
 */
var asOfDate = null;      // null means live
var liveRows = null;      // stashed while a historical view is on screen
var liveMeta = null;
var liveHasDocs = null;   // a client with no folder must not gain one on exit

function enterAsOf(date) {
  closeChg();
  var bar = document.getElementById('histBar');
  bar.classList.add('on');
  bar.innerHTML = '<span class="hist-t">Loading ' + esc(date) + '&hellip;</span>';

  callPortal('asof', { from: date }, function (p) {
    if (!p || p.error || !p.rows) {
      bar.innerHTML = '<span class="hist-t">Could not load that date</span>'
        + '<span class="hist-s">' + esc((p && p.error) || 'Unknown error') + '</span>'
        + '<button type="button" class="hist-x" onclick="exitAsOf()">Back to today</button>';
      syncAsOfSel();
      return;
    }

    if (liveRows === null) {
      liveRows = allRows; liveMeta = meta; liveHasDocs = hasDocs;
    }
    asOfDate = p.asOf;

    // Match the live loader's treatment so a blank utility reads the same way
    // in history as it does today.
    p.rows.forEach(function (r) {
      var u = String(r['Utility Company'] || r['Utility'] || '').trim();
      r['Utility'] = u || 'Not on file';
    });

    allRows = p.rows;
    if (p.meta) { meta = p.meta; showFreshness(); }
    hasDocs = false;
    renderDocsButton();
    paintHistBar(p);
    syncAsOfSel();
    render();
  });
}

function paintHistBar(p) {
  var d = new Date(p.asOf + 'T12:00:00');
  var mon = ['January','February','March','April','May','June','July',
             'August','September','October','November','December'];
  document.getElementById('histBar').innerHTML =
      '<span class="hist-t">HISTORICAL VIEW &middot; ' + d.getDate() + ' '
    +   mon[d.getMonth()] + ' ' + d.getFullYear() + '</span>'
    + '<span class="hist-s">The portfolio as reported on ' + esc(p.asOf)
    +   (p.exact ? '' : ' (nearest archived date to ' + esc(p.requested) + ')')
    +   '. ' + p.rows.length + ' project' + (p.rows.length === 1 ? '' : 's')
    +   '. Documents and notes are excluded, because neither is versioned.'
    + '</span>'
    + '<button type="button" class="hist-x" onclick="exitAsOf()">Back to today</button>';
}

function exitAsOf() {
  document.getElementById('histBar').classList.remove('on');
  document.getElementById('histBar').innerHTML = '';
  if (liveRows !== null) {
    allRows = liveRows;
    liveRows = null;
    if (liveMeta) { meta = liveMeta; showFreshness(); }
    liveMeta = null;
  }
  asOfDate = null;
  if (liveHasDocs !== null) { hasDocs = liveHasDocs; liveHasDocs = null; }
  renderDocsButton();
  syncAsOfSel();
  // render() calls renderDashboard, which now takes the live branch and sets
  // each panel's display itself, so nothing needs un-hiding by hand.
  render();
}

/* ============ what's changed ============ */

/**
 * WEEKLY BY DEFAULT, DAILY UNDERNEATH.
 *
 * The archive keeps every day, but a client offered 26 dates picks one and
 * stares at it. Offered "last Monday" they get an answer without having to
 * know what to ask. The full list stays available in the dropdown for the day
 * someone needs a specific Thursday.
 */
/**
 * THE COMPARISON FLOOR.
 *
 * The archive reaches back to 31 July, but the portal was not in use before
 * the week of 18 August. Comparing against anything earlier reports the entire
 * portfolio as having changed, which is true of the record and useless to a
 * reader.
 *
 * 18 August 2026 is a Tuesday, so this is the Monday of that week. Move it
 * forward to '2026-08-24' if the earlier week should be excluded too.
 */
var HISTORY_FLOOR = '2026-08-17';

var chgDates = [];       // every archived date, ascending
var chgFrom = '';        // the date currently being compared against

/**
 * One loader for both the toolbar picker and the Updates modal, so the two can
 * never disagree about which dates exist. Fired after first paint rather than
 * during init: the dashboard must not wait on a list of dates.
 */
function loadSnapDates(cb) {
  if (chgDates.length) { cb(true); return; }
  callPortal('snapdates', {}, function (p) {
    if (!p || p.error || !p.dates || !p.dates.length) { cb(false, p && p.error); return; }
    chgDates = p.dates;
    cb(true);
  });
}

function populateAsOf() {
  var sel = document.getElementById('asOfSel');
  if (!sel) return;
  var opts = chgMondays();
  // Nothing comparable yet, so leave it showing Today rather than opening an
  // empty menu.
  if (!opts.length) return;

  var h = '<option value="">As of: Today</option>';
  opts.forEach(function (dte) {
    h += '<option value="' + dte + '"' + (dte === asOfDate ? ' selected' : '') + '>'
      +  'As of: ' + chgOptLabel(dte) + '</option>';
  });
  sel.innerHTML = h;
}

function onAsOfChange(v) {
  if (!v) { exitAsOf(); return; }
  enterAsOf(v);
}

/** Keeps the toolbar picker honest after Back to today, or after an error. */
function syncAsOfSel() {
  var sel = document.getElementById('asOfSel');
  if (sel) sel.value = asOfDate || '';
}

function openChg() {
  document.getElementById('chgBack').classList.add('on');
  document.getElementById('chgBody').innerHTML =
    '<div class="chg-none">Loading history<div class="doc-bar" '
    + 'style="margin-top:10px"><i></i></div></div>';
  document.getElementById('chgSub').textContent = '';
  document.getElementById('chgWeeks').innerHTML = '';

  loadSnapDates(function (ok, err) {
    if (!ok) {
      document.getElementById('chgBody').innerHTML =
        '<div class="chg-none">' + esc(err || 'No history has been archived yet.')
        + '</div>';
      return;
    }
    populateAsOf();
    paintChgWeeks();
    loadChg(chgFrom || suggestedFrom());
  });
}

function closeChg() { document.getElementById('chgBack').classList.remove('on'); }

/**
 * yyyy-mm-dd from LOCAL calendar parts.
 *
 * toISOString() converts to UTC first, so for any viewer west of UTC it
 * reports tomorrow's date once past mid-afternoon. Stepping back to Monday in
 * local time and then serialising through UTC produced Tuesdays, which is
 * exactly the day the weekly comparison is meant not to land on.
 */
function isoLocal_(d) {
  return d.getFullYear() + '-'
    + ('0' + (d.getMonth() + 1)).slice(-2) + '-'
    + ('0' + d.getDate()).slice(-2);
}

/** Archived Mondays, newest first, old enough to be a real week apart. */
function chgMondays() {
  var have = {};
  chgDates.forEach(function (d) { have[d] = true; });
  var out = [], cur = new Date();
  cur.setDate(cur.getDate() - ((cur.getDay() + 6) % 7));      // this week's Monday
  // Bounded by the floor rather than a fixed count, so the list grows by one
  // each week instead of silently dropping the oldest comparable week.
  for (var w = 0; w < 260; w++) {
    var iso = isoLocal_(cur);
    if (iso < HISTORY_FLOOR) break;
    var age = Math.round((Date.now() - new Date(iso + 'T12:00:00').getTime()) / 86400000);
    /**
     * Any Monday already in the archive, including yesterday's.
     *
     * A five-day floor used to sit here so a Tuesday could not offer "compare
     * with yesterday" under a weekly heading. Removed by request: the labels
     * say "yesterday" or "1 wk ago" outright, so the reader can see what they
     * are choosing and the guard was deciding for them.
     *
     * Today is still excluded. The live grid IS today, so the only difference
     * would be Salesforce edits made since the 5am archive, reported under a
     * heading that reads as a whole day.
     */
    if (have[iso] && age >= 1) out.push(iso);
    cur.setDate(cur.getDate() - 7);
  }
  return out;
}

/**
 * Defaults to the newest Monday on offer, which is the top item in the
 * dropdown. With the five-day floor gone that can be yesterday rather than
 * last week, so the option label spells out which it is.
 */
function suggestedFrom() {
  if (!chgDates.length) return '';
  var mondays = chgMondays();
  if (mondays.length) return mondays[0];

  // No qualifying Monday yet, so fall back to the floor itself rather than to
  // a pre-launch date that would report the whole portfolio as changed.
  return chgDates.indexOf(HISTORY_FLOOR) !== -1 ? HISTORY_FLOOR : chgDates[chgDates.length - 1];
}

/**
 * Chips for the last six Mondays that actually exist in the archive, so a chip
 * can never resolve to a missing file. A full date list sits behind them.
 */
/**
 * ONE CONTROL, NOT A ROW OF CHIPS.
 *
 * Every archived date in a single dropdown, newest first, each labelled with
 * how long ago it was. Chips only ever showed Mondays and still needed a
 * dropdown behind them for anything else, so it was two controls doing one
 * job. The default is still the most recent archived Monday.
 */
function paintChgWeeks() {
  /**
   * Mondays only. Every archived day was 26 options deep and invited a
   * comparison against last Thursday, which is not a unit anyone reports in.
   */
  var opts = chgMondays();

  var h = '<span style="font-size:9.5px;font-weight:700;letter-spacing:.6px;'
        + 'text-transform:uppercase;color:var(--t2);align-self:center;'
        + 'margin-right:4px">Compare with</span>';

  if (!opts.length) {
    h += '<span style="font-size:11.5px;color:var(--t3)">'
      +  'No completed week to compare against yet. The first will be available '
      +  'the Monday after ' + HISTORY_FLOOR + '.</span>';
    document.getElementById('chgWeeks').innerHTML = h;
    return;
  }

  h += '<select class="chg-chip" style="padding:6px 10px;min-width:190px" '
    +  'onchange="if(this.value)loadChg(this.value)" '
    +  'title="Week commencing">';
  opts.forEach(function (dte) {
    h += '<option value="' + dte + '"'
      +  (dte === chgFrom ? ' selected' : '') + '>'
      +  chgOptLabel(dte) + '</option>';
  });
  h += '</select>';

  // Replay moved out to the toolbar. This modal is now only the report.
  document.getElementById('chgWeeks').innerHTML = h;
}

/** "18 Aug 2026 (1 wk ago)". Days for anything under a week, so a recent date
 *  is never rounded up to a week it is not. */
function chgOptLabel(iso) {
  var d = new Date(iso + 'T12:00:00');
  var days = Math.round((Date.now() - d.getTime()) / 86400000);
  var mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var when;
  if (days <= 0)     when = 'today';
  else if (days === 1) when = 'yesterday';
  else if (days < 7) when = days + ' days ago';
  else {
    var wks = Math.round(days / 7);
    when = wks === 1 ? '1 wk ago' : wks + ' wks ago';
  }
  return d.getDate() + ' ' + mon[d.getMonth()] + ' ' + d.getFullYear()
    + ' (' + when + ')';
}

function chgLabel(iso) {
  var d = new Date(iso + 'T12:00:00');
  var wks = Math.max(1, Math.round((Date.now() - d.getTime()) / 604800000));
  var mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + mon[d.getMonth()]
    + (wks === 1 ? ' (1 wk ago)' : ' (' + wks + ' wks ago)');
}

function loadChg(from) {
  chgFrom = from;
  paintChgWeeks();
  document.getElementById('chgBody').innerHTML =
    '<div class="chg-none">Comparing<div class="doc-bar" '
    + 'style="margin-top:10px"><i></i></div></div>';
  callPortal('diff', { from: from }, paintChg);
}

/** One transport, two homes: google.script.run on /dev, fetch on Cloudflare. */
function callPortal(api, params, cb) {
  if (window.google && google.script && google.script.run && window.__TOKEN) {
    var r = google.script.run
      .withSuccessHandler(cb)
      .withFailureHandler(function (e) { cb({ error: String((e && e.message) || e) }); });
    if (api === 'snapdates') r.getSnapshotDates(window.__TOKEN);
    else r.getPortalDiff(window.__TOKEN, clientKey, params.from || '');
    return;
  }
  var slug = (window.location.pathname || '').split('/').filter(Boolean).pop() || '';
  var qs = '?' + (slug ? 'want=' + encodeURIComponent(slug) : '');
  if (params.from) qs += '&from=' + encodeURIComponent(params.from);
  fetch('/api/' + api + qs, { credentials: 'same-origin' })
    .then(function (r) {
      var ct = r.headers.get('content-type') || '';
      /**
       * Cloudflare Pages serves the portal HTML for any path the Worker does
       * not claim, so a non-JSON body here means the Worker has not been
       * patched to forward these routes yet. Say that, rather than blaming
       * the network for a deploy that has not happened.
       */
      if (ct.indexOf('json') === -1) {
        throw new Error('History is not enabled on this domain yet. The Worker '
          + 'needs the /api/diff route. It works on the Apps Script dev link.');
      }
      return r.json();
    })
    .then(cb)
    .catch(function (e) { cb({ error: String(e.message || e) }); });
}

function chgRow(name, field, from, to) {
  return '<div class="chg-r">'
    + '<span class="chg-nm">' + esc(name) + '</span>'
    + '<span class="chg-f">' + esc(field) + '</span>'
    + '<span class="chg-v">'
    + (from ? '<span class="chg-old">' + esc(from) + '</span> &rarr; ' : '')
    + '<span class="chg-new">' + esc(to || '&mdash;') + '</span>'
    + '</span></div>';
}

function paintChg(p) {
  var body = document.getElementById('chgBody');
  if (!p || p.error) {
    body.innerHTML = '<div class="chg-none" style="color:#e0654f">'
      + esc((p && p.error) || 'Could not build the comparison.') + '</div>';
    return;
  }

  var total = p.counts.moved + p.counts.edits + p.counts.added + p.counts.removed;
  /**
   * The heading names the date rather than repeating the button label.
   * "What's changed since 17 August" answers the question on sight;
   * "Updates" twice does not.
   */
  var hd = document.getElementById('chgTitle');
  if (hd) {
    var hdd = new Date(p.from + 'T12:00:00');
    var hmon = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];
    hd.textContent = 'What\u2019s changed since ' + hdd.getDate() + ' '
      + hmon[hdd.getMonth()];
  }
  document.getElementById('chgSub').textContent =
    'Now compared with ' + p.from
    + (p.exact ? '' : ' (nearest archived date to ' + p.fromRequested + ')')
    + ' \u00b7 ' + total + (total === 1 ? ' change' : ' changes');

  if (!total) {
    body.innerHTML = '<div class="chg-none">Nothing changed on this portfolio '
      + 'between ' + esc(p.from) + ' and today.</div>';
    return;
  }

  var h = '';
  if (p.moved.length) {
    h += '<div class="chg-sec">Progress &middot; ' + p.moved.length + '</div>';
    p.moved.forEach(function (m) { h += chgRow(m.name, m.field, m.from, m.to); });
  }
  if (p.added.length) {
    h += '<div class="chg-sec">New projects &middot; ' + p.added.length + '</div>';
    p.added.forEach(function (m) {
      h += chgRow(m.name, m.stage || 'added', '', (m.kw ? m.kw + ' kW' : 'new'));
    });
  }
  if (p.removed.length) {
    h += '<div class="chg-sec">No longer in the report &middot; '
      + p.removed.length + '</div>';
    p.removed.forEach(function (m) {
      h += chgRow(m.name, m.stage || '', 'was listed', 'removed');
    });
  }
  if (p.edits.length) {
    h += '<div class="chg-sec">Other detail &middot; ' + p.edits.length + '</div>';
    p.edits.forEach(function (m) { h += chgRow(m.name, m.field, m.from, m.to); });
  }

  /**
   * The retroactive-correction caveat. A date fixed in Salesforce this week
   * shows here as movement, and without saying so it reads as though a project
   * went backwards. It did not; the record was wrong before.
   */
  h += '<div class="chg-note">Compares the portfolio now against the report '
    + 'as it stood on ' + esc(p.from) + '. A date corrected in Salesforce since '
    + 'then appears here as a change, which reflects the correction rather than '
    + 'the project moving. Notes and documents are not included.</div>';

  body.innerHTML = h;
}

/* ============ pinned timeline ============ */

/**
 * WHY THIS IS A CHOICE AND NOT A CONSTANT.
 *
 * The timeline column is ~464px wide and was permanently glued to the right
 * edge with position:sticky. At six or seven columns that is a feature: the
 * milestones stay visible while you scroll the detail. Select all fifteen and
 * it becomes a 464px blind spot that covers real data at every scroll position
 * except the far right.
 *
