<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolarKal | Client Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   SolarKal Standalone Client Portal - build c1-2026-08-01

   DELIBERATELY CONTAINS NO INTERNAL DATA.
   There is no reference anywhere in this file to the SIP Active Pipeline
   report, to SolarKal Project Revenue, or to Fee / Watt $. Keep it that way.
   If you ever need a field here, confirm it is one a client may see.

   PHASE 1 (now): client is chosen by ?c=<Account> and data comes from the
   published CSV. This is presentation-only. A determined visitor can change
   the parameter or fetch the CSV directly. DO NOT SEND THIS TO A CLIENT YET.

   PHASE 2 (next): replace loadClientRows() below with a call to the Apps
   Script Web App, which authenticates the Google account and returns only
   that client's rows. Then unpublish the CSV. loadClientRows() is the only
   function that needs to change.
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--y:#FBD707;--n:#253846;--n3:#1a2830;--n5:#0e1a21;
--t:#e8edf2;--t2:#8fa5b5;--t3:#506070;--t4:#3a4e5e;
--b:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.10);
--g:#22c98a;--r:#f05c5c;--w:#f5a623;--bl:#6ab4f5;--p:#b48af5;
--font:'Plus Jakarta Sans',sans-serif;--card:rgba(255,255,255,0.035);
}
body{font-family:var(--font);background:var(--n5);color:var(--t);min-height:100vh}
.wrap{max-width:1900px;margin:0 auto;padding:0 28px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;
  border-bottom:1px solid var(--b);background:var(--n3);margin-bottom:22px}
.topbar-left{display:flex;align-items:center;gap:20px;flex-wrap:wrap;min-width:0}
.tb-div{width:1px;height:32px;background:var(--b2);flex-shrink:0}
.brand{display:flex;flex-direction:column;gap:2px}
/* The logo is a JPEG on a white background. mix-blend-mode:lighten drops that
   background against the dark topbar, the same trick index.html uses. */
.brand-logo{height:26px;width:auto;object-fit:contain;mix-blend-mode:lighten;display:block}
/* Indented so CLIENT PORTAL starts under the S of SolarKal rather than under
   the sun icon. Tune this one number if the logo is ever resized. */
.brand-sub{font-size:8px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--t3);padding-left:31px}
.client-name{font-size:21px;font-weight:800;color:var(--y);letter-spacing:-.5px;white-space:nowrap}
.ts{font-size:11px;color:var(--t4)}
.sec{font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t4);
  margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--b)}
.mod{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:18px;margin-bottom:12px}
.mod-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mod-t{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--y)}
.ctl{padding:8px 14px;background:var(--n);border:1px solid var(--b);border-radius:8px;color:var(--t);
  font-family:var(--font);font-size:13px;font-weight:600;outline:none;cursor:pointer}
.btn{padding:8px 12px;background:var(--n);border:1px solid var(--b);border-radius:8px;color:var(--t2);
  font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
/* Same metrics as .ctl so the Columns button and the Group By select line up
   as a matched pair rather than two different-sized controls. */
.btn-lg{padding:8px 14px;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;
  color:var(--t)}
.pricing-tbl{width:100%;border-collapse:separate;border-spacing:0 2px;font-size:11px}
.pricing-tbl th{text-align:left;font-size:9px;font-weight:700;color:var(--t4);text-transform:uppercase;
  letter-spacing:.5px;padding:6px 10px;border-bottom:1px solid var(--b)}
.pricing-tbl td{padding:7px 10px;background:var(--n);border:none;vertical-align:middle}
.pricing-tbl tr td:first-child{border-radius:5px 0 0 5px}
.pricing-tbl tr td:last-child{border-radius:0 5px 5px 0}
.pricing-tbl .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--t2)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
.gate{padding:80px 20px;text-align:center;color:var(--t3)}
.gate h2{font-size:16px;color:var(--t);margin-bottom:8px;font-weight:700}
#team{display:none;gap:10px;flex-wrap:wrap;align-items:center}
.team-chip{display:flex;align-items:baseline;gap:8px;padding:6px 13px;background:var(--n);
  border:1px solid var(--b2);border-radius:20px;white-space:nowrap}
.team-lbl{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--t)}
.team-nm{font-size:12.5px;font-weight:700;color:var(--bl)}
#team a.team-nm{text-decoration:none;border-bottom:1px solid transparent}
#team a.team-nm:hover{border-bottom-color:var(--bl)}
.pricing-tbl th.sortable{cursor:pointer;user-select:none}
.pricing-tbl th.sortable:hover{color:var(--t)}
.sort-ind{color:var(--y);margin-left:4px}
.prow{cursor:pointer}
.prow:hover td{background:#2f4a5f}
.drow td{background:var(--n5);border-radius:0 0 6px 6px;border-top:1px solid var(--b)}
.drow iframe{background:var(--n)}

/* ---------- dashboard ---------- */
/* The attention card is its own box, set apart from the four metric cards by a
   wider gap. Option B: same dark surface as its neighbours with a yellow
   number and left edge, so the figure shouts and the panel stays calm. Yellow
   is already the accent for money in this portal, so a fully yellow card would
   compete with the lease totals rather than stand out from them. */
.dash-wrap{display:grid;grid-template-columns:270px 1fr;gap:18px;margin-bottom:14px}
.attn{background:#17252c;border:1px solid var(--b);border-left:5px solid var(--y);
  border-radius:12px;padding:16px 20px}
.attn.none{border-left-color:#2a4557}
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--b);
  border:1px solid var(--b);border-radius:12px;overflow:hidden}
.dash-c{background:var(--n3);padding:16px 20px}
.dash-l{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--t3);font-weight:700}
/* Scoped to the metric cards, so the attention card and the pipeline heading
   keep their own colours. */
.dash-c .dash-l{color:var(--y)}
.dash-v{font-size:26px;font-weight:800;color:var(--t);margin-top:5px;line-height:1.1}
.dash-u{font-size:11px;font-weight:600;color:var(--t3);margin-left:5px}
.dash-s{font-size:10px;color:var(--t4);margin-top:5px}

.pipe{background:var(--n3);border:1px solid var(--b);border-radius:12px;
  padding:14px 20px 16px;margin-bottom:14px}
.pipe-bar{display:flex;gap:4px;margin:12px 0 12px;height:38px}
.pipe-seg{border-radius:5px;cursor:pointer;transition:opacity .12s;display:flex;
  align-items:center;justify-content:center;overflow:hidden;min-width:8px}
.pipe-seg span{font-size:11px;font-weight:800;color:#0a1419;white-space:nowrap;
  padding:0 8px;text-align:center;line-height:1.25}
.pipe-seg:hover{opacity:.8}
.pipe-seg.dim{opacity:.22}
.pipe-key{display:flex;gap:22px;flex-wrap:wrap}
.pipe-k{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px}
.pipe-k.dim{opacity:.4}
.pipe-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

.panels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px}
.panel{background:var(--n3);border:1px solid var(--b);border-radius:12px;padding:16px 20px}
.panel-t{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--y);font-weight:700}
.panel-big{font-size:24px;font-weight:800;color:var(--y);margin:8px 0 12px;line-height:1.1}
.panel-r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-top:1px solid var(--b);font-size:12px}
.panel-note{font-size:9.5px;color:var(--t4);margin-top:11px;line-height:1.5}
/* Dotted underline marks anything with a methodology tooltip. */
.def{border-bottom:1px dotted var(--t4);cursor:help}
.econ-in{width:74px;background:#0d1820;color:var(--y);border:1px solid #3a5a70;
  border-radius:6px;padding:5px 8px;font-family:inherit;font-size:13px;
  font-weight:700;text-align:center;outline:none}
.econ-in:focus{border-color:var(--y)}
.econ-r{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:10px 0;border-top:1px solid var(--b)}

/* Project Notes panel. A deliberately different surface from the data panels
   beside it: this is the one place holding human words rather than report
   figures, so it should not read as another data card. */
.note-card{background:linear-gradient(180deg,#152430,#101b23);
  border:1px solid #2a4557;border-radius:12px;overflow:hidden}
.note-card.on{border-color:rgba(251,215,7,.5);box-shadow:0 0 0 1px rgba(251,215,7,.12)}
.note-card.done{border-color:rgba(61,220,151,.4)}
.note-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 16px;background:rgba(255,255,255,.035);border-bottom:1px solid #2a4557}
.note-ttl{display:flex;align-items:center;gap:9px;font-size:10.5px;font-weight:700;
  letter-spacing:.7px;text-transform:uppercase;color:#a9c2d1}
.note-body{padding:14px 16px}
.note-msg{padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.note-msg:first-child{border-top:0}
.mention{color:var(--y);font-weight:700}
.mbox{position:absolute;z-index:80;background:var(--n3);border:1px solid #2a4557;
  border-radius:8px;min-width:200px;max-height:190px;overflow:auto;
  box-shadow:0 12px 28px rgba(0,0,0,.5)}
.mbox div{padding:8px 12px;font-size:12px;color:var(--t1);cursor:pointer}
.mbox div:hover,.mbox div.sel{background:var(--n);color:var(--y)}

/* Client documents modal. Centred and large because a lease filename can run
   to eighty characters and reading it matters more than the table behind it. */
.docs-back{position:fixed;inset:0;z-index:200;display:none;align-items:center;
  justify-content:center;background:rgba(4,10,14,.72);backdrop-filter:blur(2px)}
.docs-back.on{display:flex}
.docs-card{width:min(760px,92vw);max-height:78vh;display:flex;flex-direction:column;
  background:var(--n3);border:1px solid var(--b2);border-radius:14px;overflow:hidden;
  box-shadow:0 24px 64px rgba(0,0,0,.6)}
.docs-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
  border-bottom:1px solid var(--b2);flex:0 0 auto}
.docs-list{overflow:auto;flex:1 1 auto}
.doc-row{display:flex;width:100%;align-items:center;gap:12px;padding:13px 20px;
  background:transparent;border:0;border-bottom:1px solid var(--b);cursor:pointer;
  text-align:left;color:var(--t1);font-family:inherit}
.doc-row:hover{background:var(--n)}
.doc-row[disabled]{cursor:default;opacity:.75}
.doc-row[disabled]:hover{background:transparent}
.doc-sec{display:flex;width:100%;align-items:center;gap:11px;padding:13px 20px;
  background:var(--n);border:0;border-bottom:1px solid var(--b2);cursor:pointer;
  text-align:left;color:var(--t1);font-family:inherit;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px}
.doc-sec:hover{background:var(--n5,var(--n))}
/* Chevron sits at the far right, after the count. Folders start flush left so
   the folder icon is the leftmost thing in the list and the hierarchy reads
   without a gutter of empty space. */
.doc-chev{flex:0 0 auto;color:var(--t3);font-size:11px;width:12px;text-align:right}
/* An open folder keeps its header visible while you scroll its contents, and
   the header stays highlighted so you can see which folder you are inside. */
.doc-sec.open{position:sticky;top:0;z-index:2;background:var(--n3);
  box-shadow:inset 3px 0 0 var(--y)}

/* Folder contents are visually inside the folder: recessed background, a rule
   running down the left edge, and a closing border at the bottom. Without
   this, an expanded folder ran straight into the loose files below it with no
   boundary at all. */
.doc-sec-body{display:none;background:rgba(0,0,0,.24);
  box-shadow:inset 3px 0 0 rgba(251,215,7,.4);
  border-bottom:1px solid var(--b2)}
.doc-sec-body .doc-row{padding-left:56px;border-bottom:1px solid rgba(255,255,255,.045)}
.doc-sec-body .doc-row:last-child{border-bottom:0}
.doc-sec-body .doc-row:hover{background:rgba(255,255,255,.035)}

/* Files sit one indent in from folders, whether loose or inside a section. */
.doc-row{padding-left:42px}
/* Indeterminate on purpose: the file arrives in one response, so there is no
   real percentage to report. Honest motion beats a fake percentage. */
.doc-bar{height:3px;border-radius:3px;background:var(--b2);overflow:hidden;margin-top:6px}
.doc-bar i{display:block;height:100%;width:40%;background:var(--y);border-radius:3px;
  animation:docslide 1.1s ease-in-out infinite}
@keyframes docslide{0%{margin-left:-40%}100%{margin-left:100%}}
</style>
</head>

<script>
/* ============ CONFIG ============ */
var BUILD = 'c49-2026-08-18';

/* The Apps Script Web App replaces the line below with an assignment to
   window.BOOTSTRAP containing this client's rows, already filtered server
   side. Do not remove or reformat this marker. */
/*__BOOTSTRAP__*/

/**
 * SECURITY: these are intentionally blank.
 *
 * They used to hold the published Google Sheet CSV URLs, used by the old
 * standalone dev mode. That was a data leak: this file is public in the
 * GitHub repo and those URLs are unauthenticated, so anyone reading the
 * source could fetch the full dataset for every client.
 *
 * In production the data arrives pre-filtered from the Web App as
 * window.BOOTSTRAP, and no URL is needed here at all. To test standalone,
 * paste a URL back in temporarily and REMOVE IT before committing.
 */
var CLIENT_CSV_URL = '';
var CLIENT_META_URL = '';

var TL_COL_W = 76;
var TRIM_SITE_NAMES = true;

/**
 * Satellite map zoom. Change this one value.
 *
 *   21  individual rooftop units, HVAC visible
 *   20  single building, tightly cropped
 *   19  roof and parcel            (was the default, too tight for warehouses)
 *   18  building plus its lot and immediate neighbours
 *   17  building in context, adjacent parcels and roads   <-- default
 *   16  several blocks, useful for a large campus or ground mount
 *   15  neighbourhood, site becomes small
 *
 * Or set to 'auto' to scale by system size, which handles a 300 kW retail
 * roof and a 15 MW ground mount sensibly without one compromise value.
 */
var MAP_ZOOM = 17;

function mapZoomFor(r) {
  if (MAP_ZOOM !== 'auto') return MAP_ZOOM;
  var kw = parseFloat(r['Project Size (KW)']) || 0;
  if (kw >= 6000) return 15;
  if (kw >= 2000) return 16;
  if (kw >= 500)  return 17;
  return 18;
}

var DEFAULT_COLS_VERSION = '2026-08-17';
var DEFAULT_COLS = ['Project: Project Name','Stage','State','Project: Record Type',
  'Project Size (KW)','Year 1 Lease Rate','Annual Escalator (lease)','Vendor Awarded'];

/**
 * Field names that arrive from the Salesforce report. Declared once so a
 * rename in Salesforce is a one-line change here rather than a hunt.
 */
var ROOF_SQFT     = 'Roof Size (sqft)';
var CONTRACT_TERM = 'Contract Term (lease or PPA)';
var HOLD_REASON   = 'On Hold Reason';

var MILESTONES_BASE = [
  {keys:['First Round RFP Launch Date'],      label:'RFP'},
  {keys:['Vendor Contract Signed Date'],      label:'Contract Signed'},
  // Replaced NTP: utility approval is the milestone clients actually wait on,
  // and NTP tended to follow it by days.
  {keys:['Date Interconnection Approved'],    label:'Utility Approval'},
  {keys:['Mobilization','Mobilization Date'], label:'Mobilization'}
];
var MILESTONE_FINAL = {
  CS:  {keys:['Rent Commencement','Rent Commencement Date'], label:'Rent Commencement'},
  BTM: {keys:['Project Complete Date','Project Complete'],   label:'Project Complete'}
};

var allRows = [];      // this client's rows only

var SEARCH_FIELDS = ['Project: Project Name', 'Street Address', 'City', 'State',
  'Zip Code', 'Vendor Awarded', 'Utility', 'Utility Company', 'Stage'];


/**
 * Set when loadClientRows has already painted the page itself: the staff
 * picker, or a real error from the server.
 *
 * Without it, both of those called cb([]) and the empty-rows branch in init()

 * a support round trip with the developer.
 */
var gateShown = false;
var team = [];      // @mention roster, names only
var viewer = '';    // signed-in identity, supplied by the server
var meta = null;
var visibleCols = null;
var clientKey = '';
var isStaff = false;   // set by the server, never inferred in the browser

/**
 * Shown to SolarKal staff who land on the portal without choosing a client.
 * Clients never see this: the server only returns a client list to a staff
 * identity, so there is nothing here to bypass.
 */
/**
 * A "report it's broken" button must not depend on the thing that is broken.
 * An in-app endpoint would be unreachable in exactly the outage it exists to
 * report, so this is a plain mailto: it works even when Apps Script,
 * Cloudflare or the network path to us is down. The body carries the details

 */
function reportLink(context) {
  var slug = (window.location.pathname || '').split('/').filter(Boolean).pop() || '(none)';
  var body = 'The SolarKal client portal is not working for me.\n\n'

    + 'Signed in as: ' + (viewer || '(unknown)') + '\n'
    + 'What I saw: ' + (context || 'see above') + '\n';
  return 'mailto:david.wei@solarkal.com'
    + '?subject=' + encodeURIComponent('Portal Down - SolarKal Client Portal')
    + '&body=' + encodeURIComponent(body);
}

function reportButtonHtml(context) {

}

function renderStaffPicker(clients) {

        return sl ? '<div style="color:#e0654f;font-size:11px;margin:-12px 0 18px">'

/* ============ CSV ============ */
function parseCSV(text) {
  var result = [], row = [], field = '', inQ = false, i, ch, nx;
  for (i = 0; i < text.length; i++) {
    ch = text[i]; nx = text[i+1];
    if (ch === '"') {
      if (inQ && nx === '"') { field += '"'; i++; } else { inQ = !inQ; }
    } else if (ch === ',' && !inQ) {
      row.push(field.trim()); field = '';
    } else if ((ch === '\n' || ch === '\r') && !inQ) {
      if (field || row.length) {
        row.push(field.trim());
        if (row.some(function(f){ return f.length; })) result.push(row);
        row = []; field = '';
      }
      if (ch === '\r' && nx === '\n') i++;
    } else { field += ch; }
  }
  if (field || row.length) {
    row.push(field.trim());
    if (row.some(function(f){ return f.length; })) result.push(row);
  }
  if (!result.length) return [];
  var headers = result[0].map(function(h){ return h.replace(/^"|"$/g,''); });
  var out = [];
  for (i = 1; i < result.length; i++) {
    var o = {};
    headers.forEach(function(hh, j){ o[hh] = (result[i][j] || '').replace(/^"|"$/g,''); });
    out.push(o);
  }
  return out;
}

function parseMeta(text) {
  var o = {};
  String(text).split(/\r?\n/).forEach(function(line){
    if (!line.trim()) return;
    var i = line.indexOf(',');
    if (i === -1) return;
    var k = line.slice(0,i).trim().replace(/^"|"$/g,'');
    var v = line.slice(i+1).trim().replace(/^"|"$/g,'');
    if (k) o[k] = v;
  });
  return o;
}

/* ============ helpers ============ */
/** Tenths of a million. Used where a dashboard reads better than a ledger. */
function moneyM(v) {
  v = Number(v) || 0;
  if (Math.abs(v) >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
  if (Math.abs(v) >= 1e3) return '$' + Math.round(v / 1e3) + 'K';
  return '$' + Math.round(v).toLocaleString();
}

/** Large counts as millions, so 34,712,000 reads as 34.7M. */
function bigNum(v, unit) {
  v = Number(v) || 0;
  var t = Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + 'M'
        : Math.abs(v) >= 1e4 ? Math.round(v / 1e3) + 'K'
        : Math.round(v).toLocaleString();
  return unit ? t + ' ' + unit : t;
}

function money(v) {
  return v >= 1e6 ? '$' + (v/1e6).toFixed(2) + 'M' : '$' + Math.round(v).toLocaleString();
}

// Escapes for both attribute values and text content. Report data is rendered
// by string concatenation, so anything with a stray < or & would otherwise
// break the markup, and a crafted value could inject script.
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function trimSite(name) {
  var s = String(name || '').trim();
  var i = s.indexOf(' - ');
  if (i !== -1) return s.slice(i+3).trim() || s;
  var m = s.match(/-(?!\d)/);
  if (m) return s.slice(m.index+1).trim() || s;
  return s;
}

function headers() { return allRows.length ? Object.keys(allRows[0]) : []; }

function resolveKey(keys) {
  var h = headers();
  for (var i = 0; i < keys.length; i++) if (h.indexOf(keys[i]) !== -1) return keys[i];
  return null;
}

function isBTM(r) { return /^\s*BTM/i.test(String(r['Project: Record Type'] || '')); }

function baseMilestones() {
  var out = [];
  MILESTONES_BASE.forEach(function(m){
    var k = resolveKey(m.keys);
    if (k) out.push({key:k, label:m.label});
  });
  return out;
}

function finalMilestone(r) {
  var v = isBTM(r) ? MILESTONE_FINAL.BTM : MILESTONE_FINAL.CS;
  return {key: resolveKey(v.keys), label: v.label};
}

function finalHeaderLabel(rows) {
  var hasB = false, hasC = false;
  (rows || []).forEach(function(r){ if (isBTM(r)) hasB = true; else hasC = true; });
  if (hasB && hasC) return 'Rent Comm / Complete';
  return hasB ? MILESTONE_FINAL.BTM.label : MILESTONE_FINAL.CS.label;
}

function milestoneKeys() {
  var out = [];
  MILESTONES_BASE.forEach(function(m){ m.keys.forEach(function(k){ out.push(k); }); });
  MILESTONE_FINAL.CS.keys.forEach(function(k){ out.push(k); });
  MILESTONE_FINAL.BTM.keys.forEach(function(k){ out.push(k); });
  return out;
}

function parseDate(v) {
  if (!v) return null;
  var s = String(v).trim();
  if (!s || /^#+$/.test(s) || s === '-') return null;
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[1]-1, +m[2]);
  var d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function fmtShort(d) {
  var mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return mon[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2);
}

/* ============ timeline ============ */
function tlHeader(rows) {
  var ms = baseMilestones().concat([{label: finalHeaderLabel(rows)}]);
  var h = '<div style="display:flex;align-items:center">';
  ms.forEach(function(m, i){
    if (i) h += '<div style="flex:1;min-width:8px"></div>';
    h += '<div style="flex:0 0 ' + TL_COL_W + 'px;text-align:center;font-size:8px;font-weight:700;'
      +  'letter-spacing:.3px;line-height:1.25;text-transform:uppercase;color:var(--t4)">'
      +  m.label + '</div>';
  });
  return h + '</div>';
}

function tlRow(r) {
  var ms = baseMilestones().concat([finalMilestone(r)]);
  var today = new Date();
  var st = ms.map(function(m){
    var d = m.key ? parseDate(r[m.key]) : null;
    return {d:d, done: !!(d && d <= today), missing: !m.key};
  });
  var h = '<div style="display:flex;align-items:flex-start">';
  ms.forEach(function(m, i){
    if (i) {
      var both = st[i-1].d && st[i].d;
      h += '<div style="flex:1;min-width:8px;height:2px;margin-top:4px;background:'
        +  (both ? 'var(--g)' : 'var(--b)') + '"></div>';
    }
    var s = st[i];
    var col = s.d ? (s.done ? 'var(--g)' : 'var(--w)') : 'var(--t4)';
    var bg  = s.d ? col : 'var(--n5)';
    var tip = m.label + ': ' + (s.missing ? 'not tracked yet'
      : (s.d ? fmtShort(s.d) + (s.done ? '' : ' (scheduled)') : 'pending'));
    h += '<div title="' + esc(tip) + '" style="flex:0 0 ' + TL_COL_W + 'px;display:flex;'
      +  'flex-direction:column;align-items:center">'
      +  '<div style="width:10px;height:10px;border-radius:50%;background:' + bg
      +  ';border:2px solid ' + col + ';flex-shrink:0"></div>'
      +  '<div style="font-size:7px;margin-top:2px;white-space:nowrap;color:'
      +  (s.d ? col : 'var(--t4)') + '">' + (s.d ? fmtShort(s.d) : '') + '</div></div>';
  });
  return h + '</div>';
}

function legendHtml() {
  var ms = baseMilestones();
  if (!ms.length) return '';
  // The numbered milestone list is gone: the timeline panel now has its own
  // column headers, so it was saying the same thing twice. The colour key
  // stays, because nothing else tells a first-time viewer that a hollow dot
  // means pending rather than missing data.
  var h = '<div style="display:flex;align-items:center;justify-content:flex-end;gap:14px;'
        + 'flex-wrap:wrap;margin-bottom:10px;font-size:9px;color:var(--t4)">';
  h += '<span style="display:flex;gap:12px">'
    +  '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:4px"></span>complete</span>'
    +  '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--w);margin-right:4px"></span>scheduled</span>'
    +  '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--t4);margin-right:4px"></span>pending</span>'
    +  '</span></div>';
  return h;
}

/* ============ derived pipeline stage ============
 *
 * FOUR BUCKETS, DERIVED FROM MILESTONE DATES, NOT FROM SALESFORCE STAGE.
 *
 * Stage is a label a person updates; a milestone date is a fact. When the two
 * disagree, and they do, a client-facing bar built on the label contradicts
 * the timeline sitting three inches to its right. Deriving both from the same
 * dates makes that impossible.
 *
 * Closed Lost and On Hold have no milestone equivalent, so they stay driven
 * by Stage and are excluded here entirely.
 * ========================================================================= */

/**
 * SEGMENTS ARE REAL SALESFORCE STAGES.
 *
 * An earlier version derived four buckets from milestone dates and borrowed
 * the mock's labels. It was wrong twice: "In Construction" exists in neither
 * Salesforce nor the timeline, and the rule swept every project with a signed
 * contract but no mobilization date into one segment, which is why Contracted
 * read 58 of 70. Using Stage directly also makes this bar agree with the
 * Group By sections underneath it.
 */
var pipeFilter = '';     // '' means no drill-in
var attnFilter = false;  // show only projects with an unresolved note

function togglePipe(key) {
  pipeFilter = (pipeFilter === key) ? '' : key;
  render();
}

/**
 * TIMELINE STAGE, BY COMPLETED MILESTONES ONLY.
 *
 * A project sits in the last milestone whose date is in the PAST. A future
 * date is a plan, not an achievement, so scheduled and pending dates are
 * ignored entirely. That matters now because Salesforce is about to start
 * sending scheduled dates for these same fields: without this rule a project
 * with a mobilization booked for next March would immediately claim to be
 * mobilized.
 *
 * Nothing complete yet means Pre-RFP, which is a real and useful state.
 */
var TL_BUCKETS = [
  { key:'prerfp',   label:'Pre-RFP',            color:'#5d7c8f' },
  { key:'rfp',      label:'RFP Launched',       color:'#4da3e0' },
  { key:'contract', label:'Contract Signed',    color:'#f0a92b' },
  { key:'utility',  label:'Utility Approved',   color:'#e07b39' },
  { key:'mobil',    label:'Mobilized',          color:'#b07fe8' },
  { key:'final',    label:'Operating',          color:'#3ddc97' }
];

function tlBucket(r) {
  var now = new Date();
  function done(keys) {
    for (var i = 0; i < keys.length; i++) {
      var d = r[keys[i]] ? parseDate(r[keys[i]]) : null;
      if (d && d <= now) return true;      // past only
    }
    return false;
  }
  var fin = isBTM(r) ? MILESTONE_FINAL.BTM.keys : MILESTONE_FINAL.CS.keys;
  if (done(fin))                                      return 'final';
  if (done(['Mobilization', 'Mobilization Date']))    return 'mobil';
  if (done(['Date Interconnection Approved']))        return 'utility';
  if (done(['Vendor Contract Signed Date']))          return 'contract';
  if (done(['First Round RFP Launch Date']))          return 'rfp';
  return 'prerfp';
}

function toggleAttn() {
  attnFilter = !attnFilter;
  render();
  // A filter you have to go looking for is only half a shortcut.
  if (attnFilter) {
    var c = document.getElementById('controls');
    if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function clearFilters() {
  pipeFilter = '';
  attnFilter = false;
  var q = document.getElementById('search'); if (q) q.value = '';
  render();
}

/* ============ dashboard ============ */

function statBlock(label, value, unit, sub) {
  return '<div class="dash-c"><div class="dash-l">' + label + '</div>'
    + '<div class="dash-v">' + value
    + (unit ? '<span class="dash-u">' + unit + '</span>' : '') + '</div>'
    + '<div class="dash-s">' + (sub || '&nbsp;') + '</div></div>';
}

/** One label/value row. A tip adds a dotted underline and a hover definition. */

/* ============ economic value calculator ============ */

var ECON = { DEFAULT_TERM: 20, discount: 7, cap: 5 };
var econRows = [];

/**
 * Closed forms rather than year-by-year loops, so typing in the rate boxes
 * stays instant across a few hundred projects.
 *
 *   lifetime = base * ((1+g)^n - 1) / g            geometric series
 *   NPV      = base * (1 - ((1+g)/(1+d))^n) / (d-g)
 *
 * The NPV form is undefined when d equals g, which is why that case is split
 * out rather than left to produce Infinity.
 */
function econTotals(discount, cap) {
  var d = discount / 100, c = cap / 100;
  var lifetime = 0, npv = 0, yr1 = 0, assumed = 0;

  econRows.forEach(function (p) {
    var g = p.g, n = p.n, base = p.base;
    yr1 += base;
    if (p.assumedTerm) assumed++;

    lifetime += g ? base * (Math.pow(1 + g, n) - 1) / g : base * n;

    if (Math.abs(d - g) < 1e-9) {
      npv += base * n / (1 + d);
    } else {
      npv += base * (1 - Math.pow((1 + g) / (1 + d), n)) / (d - g);
    }
  });

  return { lifetime: lifetime, npv: npv, nav: c ? yr1 / c : 0, assumed: assumed };
}

function renderEcon() {
  var el = document.getElementById('econOut');
  if (!el) return;

  var dEl = document.getElementById('econD'), cEl = document.getElementById('econC');
  var d = parseFloat(dEl ? dEl.value : ECON.discount);
  var c = parseFloat(cEl ? cEl.value : ECON.cap);
  if (isNaN(d)) d = ECON.discount;
  if (isNaN(c)) c = ECON.cap;
  ECON.discount = d; ECON.cap = c;

  var t = econTotals(d, c);

  /**
   * One row per figure: name, rate box, value. The previous two-line layout
   * spent a whole row on each rate and left the panel mostly empty, and the
   * caveat has been moved to the header where it costs nothing.
   */
  function row(label, tip, inputId, rate, unit, value) {
    return '<div class="econ-r">'
      + '<span class="def" style="font-size:11.5px;color:var(--t2);flex:1 1 auto" '
      +   'title="' + esc(tip) + '">' + label + '</span>'
      + '<input id="' + inputId + '" class="econ-in" type="text" inputmode="decimal" '
      +   'value="' + rate + '" oninput="renderEcon()" '
      +   'title="Type any rate">'
      + '<span style="font-size:10.5px;color:var(--t4);white-space:nowrap">' + unit + '</span>'
      + '<span style="color:var(--t);font-weight:700;font-size:15px;'
      +   'white-space:nowrap;min-width:66px;text-align:right">' + value + '</span>'
      + '</div>';
  }

  el.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:14px">'
    +   '<div class="panel-big" style="margin:6px 0 2px;color:var(--t)">'
    +     moneyM(t.lifetime) + '</div>'
    +   (t.assumed
        ? '<div style="font-size:9.5px;color:#e0654f;text-align:right;max-width:140px;'
          + 'line-height:1.4">' + t.assumed + ' project'
          + (t.assumed === 1 ? '' : 's') + ' without a contract term; '
          + ECON.DEFAULT_TERM + ' yrs assumed</div>'
        : '')
    + '</div>'
    + '<div style="font-size:10.5px;color:var(--t3);margin-bottom:10px">'
    +   '<span class="def" title="Every scheduled lease payment added up over the full '
    +   'contract term, with the annual escalator applied each year. Not discounted.'
    +   '&#10;&#10;Formula, per project:&#10;'
    +   'Year 1 rent, then Year 1 rent x (1 + escalator) for year 2, and so on for '
    +   'the whole contract term. All projects added together.">'
    +   'Total lifetime lease payments</span></div>'

    + row('Net Present Value of Lease Payments',
        'Present value of those same payments, discounted at the rate you choose. '
        + 'What the future rent stream is worth in today\'s money.'
        + '&#10;&#10;Formula, per project:&#10;'
        + 'Each year\'s rent divided by (1 + discount rate) raised to the number of '
        + 'years away, then added up.&#10;'
        + 'A higher discount rate lowers the value; a higher escalator raises it.',
        'econD', d, '% discount rate', moneyM(t.npv))

    + row('NAV Increase Calculation',
        'Year 1 lease revenue capitalized at the rate you choose. A common shorthand '
        + 'for the value the income stream adds to the asset.'
        + '&#10;&#10;Formula:&#10;'
        + 'Year 1 lease revenue divided by the cap rate.&#10;'
        + 'At a 5% cap rate, $100,000 of annual rent implies $2,000,000 of value.',
        'econC', c, '% cap rate', moneyM(t.nav));
}

/* ============ columns ============ */
function colDef(key) {
  var d = {key:key, label:key, minW:'90px'};
  if (key === '__flag__') {
    d.label = '';
    d.minW = '26px';
    d.flag = true;
    return d;
  }
  if (key === '__reason__') {
    d.label = 'On Hold Reason';
    d.minW = '260px';
    d.reason = true;
    return d;
  }
  if (key === '__timeline__') {
    var slots = baseMilestones().length + 1;
    d.label = 'Timeline';
    d.minW = (slots * TL_COL_W + (slots-1) * 14 + 28) + 'px';
    d.timeline = true;
  }
  else if (key === 'Project: Project Name') { d.label='Project'; d.minW='220px'; d.bold=true; }
  else if (key === 'Stage') { d.label='SolarKal Stage'; d.minW='130px'; d.status=true; }
  else if (key === 'State') { d.label='State'; d.minW='40px'; }
  else if (key === 'Project: Record Type') { d.label='System Type'; d.minW='120px'; }
  else if (key === 'Vendor Awarded') { d.label='Vendor'; d.minW='110px'; }
  else if (key === 'Project Size (KW)') { d.label='Size (kW)'; d.minW='70px'; d.num=true; }
  else if (key === 'Year 1 Lease Rate') { d.label='Yr1 Lease Rate'; d.minW='95px'; d.num=true; d.dollar=true; }
  else if (key === 'Annual Escalator (lease)') { d.label='Escalator'; d.minW='60px'; d.num=true; d.pct=true; }
  else if (key === '__nextms__') { d.label='Next Milestone'; d.minW='150px'; d.nextms=true; }
  else if (key === 'Utility') { d.label='Utility'; d.minW='110px'; }
  else if (key === ROOF_SQFT) { d.label='Roof (sqft)'; d.minW='80px'; d.num=true; d.sqft=true; }
  else if (key === CONTRACT_TERM) { d.label='Contract Term'; d.minW='95px'; }
  else if (key === 'Last User Update Time') { d.label='Last Update'; d.minW='85px'; d.dateOnly=true; }
  else if (/Date|Time/i.test(key)) {
    d.label = key.replace('Project: ','').replace(' Date','');
    d.minW = '85px'; d.dateOnly = true;
  }
  return d;
}

// Fields that exist in the data but do not belong in the table. Some are shown
// in the page header (leads), some in the expanded row detail (address, folder).
// 'Utility' is the canonical key built on load from Utility Company; the raw
// report field stays hidden so the picker never offers the same thing twice.
var HIDE_FROM_PICKER = ['Account', 'Owner Name', 'Account Executive',
  'Street Address', 'Zip Code', 'SolarKal Google Folder', 'Utility Company',
  'Project: ID', HOLD_REASON];

/**
 * Estimate assumptions, all clearly labelled as estimates in the UI.
 *
 * The three equivalency figures are yours, stated per 1 MW of system size and
 * scaled linearly. They are EPA greenhouse-gas equivalencies and all three
 * imply roughly 885 metric tons of CO2 avoided per MW per year.
 *
 * NOTE: 885 tCO2/MW/yr implies annual production near 1,264 kWh per kW. The
 * production figure below is set to that, so the kWh number and the coal,
 * gasoline and forest numbers tell one consistent story. Raise it to ~1,300
 * if you would rather use the more common industry rule of thumb, but then
 * the equivalencies will read slightly conservative against the kWh.
 */
/**
 * Annual production, kWh per kW installed, by state.
 *
 * Only CA and NY actually vary by sub-region in the source table. All four NJ
 * utilities are 1,250 and all three MA utilities are 1,225, so those need no
 * override.
 *
 * CA defaults to 1,500 (North), the CONSERVATIVE end, because these figures go
 * in front of clients and 1,650 would overstate a northern site by 10%. The
 * override lifts it to 1,650 when the utility indicates South or LADWP.
 */
var PROD_BY_STATE = {
  CA: 1500, CO: 1625, CT: 1225, DC: 1325, FL: 1600, IL: 1250,
  MA: 1225, MD: 1300, ME: 1150, NJ: 1250, NY: 1250,
  PA: 1250, RI: 1250, VA: 1400
};

// Matched against Utility Company where a state's sub-regions differ.
var PROD_OVERRIDES = {
  CA: [[/ladwp/i, 1650], [/south/i, 1650], [/north/i, 1500]],
  NY: [[/long\s*island|lipa|psegli/i, 1300],
       [/upstate|national\s*grid|nyseg|rg\s*&?\s*e/i, 1200],
       [/westchester|con\s*ed|nyc|new\s*york\s*city/i, 1250]]
};

var EST = {
  DEFAULT_KWH_PER_KW: 1250,     // used when State is blank or unlisted

  /**
   * The equivalencies were given per 1 MW, which implicitly assumed about
   * 1,264 kWh per kW. Now that production varies by state, the equivalencies
   * are converted to a per-kWh basis and scaled by ACTUAL production.
   *
   * This matters: CO2 avoided tracks kWh generated, not system size. Holding
   * them per-MW would understate a California site and overstate a Maine one
   * by roughly 20% each way.
   */
  BASELINE_KWH_PER_KW: 1264,
  PER_MW_AT_BASELINE: { coalLbs: 980116, gasolineGal: 99680, forestAcres: 1049 }
};

// Per-kWh equivalency rates, derived from the per-MW figures above.
function estPerKwh() {
  var baseKwh = 1000 * EST.BASELINE_KWH_PER_KW;
  return {
    coalLbs:     EST.PER_MW_AT_BASELINE.coalLbs     / baseKwh,
    gasolineGal: EST.PER_MW_AT_BASELINE.gasolineGal / baseKwh,
    forestAcres: EST.PER_MW_AT_BASELINE.forestAcres / baseKwh
  };
}

// Returns the production factor for a row, plus a label naming its basis so
// the footnote can always show which number was actually used.
function productionFactor(r) {
  var st = String(r['State'] || '').trim().toUpperCase();
  var util = String(r['Utility Company'] || r['Utility'] || '').trim();

  var ov = PROD_OVERRIDES[st];
  if (ov && util) {
    for (var i = 0; i < ov.length; i++) {
      if (ov[i][0].test(util)) return { kwh: ov[i][1], basis: st + ' / ' + util };
    }
  }
  if (PROD_BY_STATE[st] !== undefined) return { kwh: PROD_BY_STATE[st], basis: st };
  return {
    kwh: EST.DEFAULT_KWH_PER_KW,
    basis: st ? st + ', no factor on file' : 'state not recorded'
  };
}

/**
 * Computed columns that have no field in the report. Offered in the picker
 * alongside real ones; cellHtml() knows how to render them.
 */
var SYNTHETIC_COLS = ['__nextms__'];

function availableCols() {
  if (!allRows.length) return DEFAULT_COLS.slice();
  var hide = milestoneKeys().concat(HIDE_FROM_PICKER);
  var real = headers().filter(function(h){ return h && h.trim() && hide.indexOf(h) === -1; });
  return real.concat(SYNTHETIC_COLS);
}

// Distinct non-empty values of a field across this client's rows.
function distinctOf(field) {
  var seen = {}, out = [];
  allRows.forEach(function(r){
    var v = String(r[field] || '').trim();
    if (v && !seen[v]) { seen[v] = 1; out.push(v); }
  });
  return out.sort();
}

function chosenCols() {
  var all = availableCols();
  if (!visibleCols) visibleCols = all.filter(function(h){ return DEFAULT_COLS.indexOf(h) !== -1; });
  visibleCols = visibleCols.filter(function(c){ return all.indexOf(c) !== -1; });
  var chosen = all.filter(function(h){ return visibleCols.indexOf(h) !== -1; });
  return (chosen.length ? chosen : all).map(colDef);
}

function buildColPicker() {
  var box = document.getElementById('colPicker');
  if (!box) return;
  var all = availableCols();
  if (!visibleCols) visibleCols = all.filter(function(h){ return DEFAULT_COLS.indexOf(h) !== -1; });
  visibleCols = visibleCols.filter(function(c){ return all.indexOf(c) !== -1; });
  var h = '<div style="font-size:9px;color:var(--t4);text-transform:uppercase;letter-spacing:1px;'
        + 'margin-bottom:8px">Show columns</div>';

    var on = visibleCols.indexOf(c) !== -1 ? ' checked' : '';
    h += '<label style="display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:11px;'
      +  'color:var(--t2);cursor:pointer"><input type="checkbox" data-col="' + esc(c) + '"' + on
      +  ' onchange="onColToggle(this)" style="cursor:pointer">' + colDef(c).label + '</label>';
  });
  box.innerHTML = h;
  var cnt = document.getElementById('colCount');
  if (cnt) cnt.textContent = '(' + visibleCols.length + '/' + all.length + ')';
}

function onColToggle(el) {
  var c = el.getAttribute('data-col');

  if (el.checked && i === -1) visibleCols.push(c);
  if (!el.checked && i !== -1) visibleCols.splice(i,1);
  try { localStorage.setItem('sk_client_cols', JSON.stringify(visibleCols)); } catch (e) {}
  buildColPicker(); render();
}

function toggleColPicker(ev) {

/* ============ team header ============ */
/**
 * Emails become mailto links. Two ways to supply them, checked in this order:
 *   1. Columns in the report named 'Owner Email' / 'Account Executive Email'.
 *      Preferred, since it stays current without anyone maintaining a list.
 *   2. The manual map below, as a stopgap.
 * With neither, the name renders as plain text and nothing breaks.
 */
var TEAM_EMAILS = {
  // Overrides only. Add an entry here when someone does not fit the pattern,
  // e.g. 'Bob Smith Jr': 'bsmith@solarkal.com'
};

// House rule: first.last@solarkal.com. Uses the first and last token, so a
// middle name or initial is ignored rather than breaking the address.
function deriveEmail(name) {
  var parts = String(name || '').toLowerCase().replace(/[^a-z\s'-]/g, '').split(/\s+/)
    .filter(function(p){ return p.length; });
  if (parts.length < 2) return '';
  var first = parts[0].replace(/[^a-z]/g, '');
  var last  = parts[parts.length - 1].replace(/[^a-z]/g, '');
  if (!first || !last) return '';
  return first + '.' + last + '@solarkal.com';
}

function emailFor(name) {
  if (TEAM_EMAILS[name]) return TEAM_EMAILS[name];
  var found = '';
  allRows.forEach(function(r){
    if (String(r['Owner Name'] || '').trim() === name && r['Owner Email']) {
      found = r['Owner Email'];
    }
    if (String(r['Account Executive'] || '').trim() === name && r['Account Executive Email']) {
      found = r['Account Executive Email'];
    }
  });
  return String(found || '').trim() || deriveEmail(name);
}

/**
 * An envelope plus an underline. Feedback was that a coloured name alone did
 * not read as clickable, and colour by itself is a weak affordance anyway.
 */
function personHtml(name) {
  var e = emailFor(name);
  return e
    ? '<a class="team-nm" href="mailto:' + esc(e) + '" title="Email ' + esc(e) + '" '
      + 'style="text-decoration:underline;text-underline-offset:2px">'
      + '<span style="margin-right:5px">&#9993;</span>' + name + '</a>'
    : '<span class="team-nm">' + name + '</span>';
}

function teamChip(label, names) {
  return '<div class="team-chip"><span class="team-lbl">' + label + '</span>'
    + names.map(personHtml).join('<span style="color:var(--t4)">,</span> ') + '</div>';
}

function renderTeam() {
  var el = document.getElementById('team');
  var leads = distinctOf('Owner Name');
  var aes = distinctOf('Account Executive');
  if (!leads.length && !aes.length) { el.style.display = 'none'; return; }
  var h = '';
  if (leads.length) h += teamChip('Project Lead' + (leads.length > 1 ? 's' : ''), leads);
  if (aes.length)   h += teamChip('Account Exec' + (aes.length > 1 ? 's' : ''), aes);
  el.innerHTML = h;
  el.style.display = 'flex';
}

/* ============ expanded project view ============ */

/**
 * Salesforce stores zips as numbers, so 08901 arrives as 8901 with the
 * leading zero lost. Any all-digit zip shorter than five is left-padded.
 * Affects most of NJ (07xxx-08xxx) and all of New England (0xxxx).
 */
function fixZip(z) {
  var s = String(z == null ? '' : z).trim();
  if (!s) return '';
  if (/^\d{1,4}$/.test(s)) return ('00000' + s).slice(-5);
  var m = s.match(/^(\d{1,4})-(\d{4})$/);          // short zip+4
  if (m) return ('00000' + m[1]).slice(-5) + '-' + m[2];
  return s;
}

function fullAddress(r) {
  return [r['Street Address'], r['State'], fixZip(r['Zip Code'])]
    .map(function(x){ return String(x || '').trim(); })
    .filter(function(x){ return x.length; })
    .join(', ');
}

/**
 * Keyless Google embed. t=k is satellite, z=19 is roof level. No API key and
 * no cost. It is an undocumented endpoint, so if it ever stops working the
 * "Open in Google Maps" link below it still does.
 */
function mapHtml(r) {
  var addr = fullAddress(r);
  if (!addr) return '<div style="color:var(--t4);font-size:11px">No address on file</div>';
  var q = encodeURIComponent(addr);
  // referrerpolicy="no-referrer" and rel="noreferrer" matter here: without
  // them the full page URL, access token included, is sent to Google in the
  // Referer header on every map load and every click.
  return '<iframe loading="lazy" referrerpolicy="no-referrer" '
    + 'style="width:100%;height:200px;border:1px solid var(--b);border-radius:8px;display:block" '
    + 'src="https://www.google.com/maps?q=' + q + '&t=k&z=' + mapZoomFor(r) + '&output=embed"></iframe>'
    + '<a href="https://www.google.com/maps/search/?api=1&query=' + q + '" target="_blank" '
    + 'rel="noopener noreferrer" style="display:inline-block;margin-top:6px;font-size:10px;'
    + 'color:var(--t2)">Open in Google Maps</a>';
}

/* ============ client documents ============
 *
 * Documents come from ONE folder per client: a "_Client Portal" subfolder
 * inside their existing Drive folder, recorded in the Access sheet. The server
 * serves only that folder, so anything filed elsewhere is unreachable.
 *
 * NOTHING IN DRIVE IS SHARED. No client is a Drive user and there are no
 * permissions to grant or revoke. The web app reads each file as its owner and
 * returns the bytes, so revoking a client is deleting their Access row.
 *
 * There is deliberately no per-project lease link. Leases are not filed per
 * project, so a per-row link would have been permanently empty. The header
 * button carries the job instead.
 * ========================================================================= */

var clientDocs = [];
var docsLoaded = false;   // list is fetched on first open, not on page load
var hasDocs = false;      // does this client have a folder configured at all

function docIcon(w) {
  w = w || 14;

    + '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm0 2 '
    + '4.5 4.5H14V4zM8 13h8v2H8v-2zm0 4h8v2H8v-2z"/></svg>';
}

function fmtBytes(n) {
  n = Number(n) || 0;
  if (!n) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return Math.round(n / 1024) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

// Hidden entirely when a client has no folder configured, so nobody clicks a
// button that opens an empty drawer.
/**
 * The button appears whenever a documents folder is CONFIGURED, which the
 * server tells us with one cell lookup. The list itself is not fetched until
 * the user opens the panel, because walking the Drive folder costs two API
 * calls per shortcut and was adding roughly twelve seconds to every page load
 * for data nobody had asked to see yet.
 *
 * The count therefore appears only after the first open.
 */
function renderDocsButton() {
  var el = document.getElementById('docsBtnWrap');

  var el = document.getElementById('docsCount');

  el.textContent = usable.length ? '(' + usable.length + ')' : '(!)';
}

var docsBusy = {};

/**
 * Sections render collapsed by default. With 37 leases in one folder an
 * expanded list is a wall; a client should see the shape of what they have
 * before they see every filename. Loose files sit at the top and are always
 * visible, since there is no folder to collapse them into.
 *
 * The count reads "5" when every file is usable and "4/5" when one is
 * broken, so a filing problem is visible without opening the section.
 */
function openDocs() {
  document.getElementById('docsBack').classList.add('on');

  if (!docsLoaded) {
    document.getElementById('docsSub').textContent = 'Loading...';
    document.getElementById('docsList').innerHTML =
      '<div style="padding:26px 20px;color:var(--t3);font-size:12px">'
      + 'Fetching your documents<div class="doc-bar" style="margin-top:10px">'
      + '<i></i></div></div>';
    document.getElementById('docsStatus').textContent = '';
    loadDocsList(function (err) {
      if (err) {
        document.getElementById('docsSub').textContent = '';
        document.getElementById('docsList').innerHTML =
          '<div style="padding:26px 20px;color:#e0654f;font-size:12px">'
          + esc(err) + '</div>';
        return;
      }
      docsLoaded = true;
      updateDocsCount();
      paintDocs();
    });
    return;
  }
  paintDocs();
}

/** Two transports, same as downloads: google.script.run today, /api later. */
function loadDocsList(done) {
  function got(list) {
    if (list && list.error) { done(list.error); return; }
    clientDocs = (list && list.docs) || list || [];
    done(null);
  }
  if (window.google && google.script && google.script.run && window.__TOKEN) {
    google.script.run
      .withSuccessHandler(got)
      .withFailureHandler(function (e) { done(String((e && e.message) || e)); })
      .getDocumentList(window.__TOKEN, clientKey);
    return;
  }
  var slug = (window.location.pathname || '').split('/').filter(Boolean).pop() || '';
  fetch('/api/docs' + (slug ? '?want=' + encodeURIComponent(slug) : ''),
        { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(got)
    .catch(function () { done('Could not reach the document service.'); });
}

function paintDocs() {
  var usable = clientDocs.filter(function (d) { return d.id; }).length;
  document.getElementById('docsSub').textContent =
    usable + (usable === 1 ? ' document' : ' documents') + ' shared with you by SolarKal';

  var loose = [], order = [], bySection = {};
  clientDocs.forEach(function (d) {
    var sec = d.section || '';
    if (!sec) { loose.push(d); return; }
    if (!bySection[sec]) { bySection[sec] = []; order.push(sec); }
    bySection[sec].push(d);
  });

  /**
   * Folders first, loose files after. A folder is a heading; scrolling past
   * thirty filenames to discover one is how the previous version read.
   */
  var html = '';

  order.forEach(function (sec, n) {
    var items = bySection[sec];
    var real = items.filter(function (d) { return !d.empty; });
    var ok = real.filter(function (d) { return d.id; }).length;
    var count = !real.length ? '0'
      : (ok === real.length ? String(real.length) : (ok + '/' + real.length));

      + 'onclick="toggleSection(' + n + ')">'

      + '<span style="flex:1 1 auto">' + esc(sec) + '</span>'
      + '<span style="flex:0 0 auto;font-size:11px;color:var(--t3)">(' + count + ')</span>'
      + '<span class="doc-chev" id="chev-' + n + '">&#9656;</span>'
      + '</button>'
      + '<div class="doc-sec-body" id="sec-' + n + '">'
      + items.map(docRowHtml).join('') + '</div>';
  });

  html += loose.map(docRowHtml).join('');

  document.getElementById('docsList').innerHTML = html
    || '<div style="padding:24px 20px;color:var(--t4);font-size:12px">No documents yet.</div>';

  document.getElementById('docsStatus').textContent =

}

function folderIcon(w) {
  w = w || 17;
  return '<svg width="' + w + '" height="' + w + '" viewBox="0 0 24 24" fill="currentColor">'
    + '<path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 '
    + '0-2-2h-8l-2-2z"/></svg>';
}

function docSelected() {

/**
 * Zipped server side. Apps Script must hold the whole archive in memory and
 * base64 it, so the server refuses above MAX_ZIP_MB and says so plainly
 * rather than timing out. Faropoint's full folder is roughly 70MB, well over
 * that, which is why "select all" can legitimately be refused.
 */
function downloadZip(ids) {
  var st = document.getElementById('docsStatus');
  if (!ids || !ids.length) return;
  if (st) st.textContent = 'Building a zip of ' + ids.length + ' file'
    + (ids.length === 1 ? '' : 's') + '. This can take a while.';

  function deliver(p) {
    if (!p || p.error) {
      if (st) st.textContent = (p && p.error) || 'Could not build that download.';
      return;
    }
    var bin = atob(p.b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/zip' }));
    var a = document.createElement('a');
    a.href = url; a.download = p.name || 'documents.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    if (st) st.textContent = 'Downloaded ' + (p.name || 'documents.zip');
  }

  if (window.google && google.script && google.script.run && window.__TOKEN) {
    google.script.run
      .withSuccessHandler(deliver)
      .withFailureHandler(function (e) { deliver({ error: String((e && e.message) || e) }); })
      .getDocumentZip(window.__TOKEN, clientKey, ids);
    return;
  }
  var slug = (window.location.pathname || '').split('/').filter(Boolean).pop() || '';
  fetch('/api/zip?ids=' + encodeURIComponent(ids.join(','))
        + (slug ? '&want=' + encodeURIComponent(slug) : ''),
        { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(deliver)
    .catch(function () { deliver({ error: 'Could not reach the document service.' }); });
}

function docRowHtml(d) {

    if (d.error) {
      return '<div style="padding:13px 20px;color:#e0654f;font-size:12px">'
        + esc(d.error) + '</div>';

    if (!d.id) {
      return '<div style="padding:13px 20px;color:var(--t4);font-size:12px">'
        + esc(d.name) + '<br><span style="color:#e0654f;font-size:10px">'
        + esc(d.note || 'unavailable') + '</span></div>';
    }
    return '<div style="display:flex;align-items:center">'
      + '<input type="checkbox" class="doc-pick" data-id="' + esc(d.id) + '" '
      +   'onchange="onDocPick()" style="margin:0 0 0 20px;cursor:pointer;flex:0 0 auto">'
      + '<button type="button" class="doc-row" id="doc-' + esc(d.id) + '" '
      + 'style="padding-left:12px;flex:1 1 auto" '

      + '<span style="color:var(--g);flex:0 0 auto">' + docIcon(18) + '</span>'
      + '<span style="flex:1 1 auto;min-width:0">'
      +   '<span style="font-size:13px;display:block">' + esc(d.name) + '</span>'
      +   '<span class="doc-note" style="font-size:10px;color:var(--t4)"></span>'
      + '</span>'
      + '<span style="flex:0 0 auto;font-size:10px;color:var(--t3);white-space:nowrap">'
      +   esc(d.modified || '') + (d.size ? ' &middot; ' + fmtBytes(d.size) : '')
      + '</span></button></div>';

function closeDocs() {

}

function toggleDocs() {
